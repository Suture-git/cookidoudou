        // --- CONFIGURATION FIREBASE ---
        const firebaseConfig = {

        const DAYS_OF_WEEK = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];

        // --- LOGIQUE MODE 100% SAISON ---
        const SEASONAL_INGREDIENTS = {
          printemps: ['asperge', 'carotte', 'champignon', 'chou', 'courgette', 'épinard', 'navet', 'oignon', 'radis', 'tomate', 'abricot', 'cerise', 'citron', 'fraise', 'framboise', 'passion', 'pêche', 'rhubarbe'],
          ete: ['artichaut', 'aubergine', 'blette', 'brocoli', 'carotte', 'céleri', 'champignon', 'chou', 'concombre', 'courgette', 'épinard', 'fenouil', 'haricot', 'oignon', 'pois', 'poivron', 'tomate', 'abricot', 'cassis', 'cerise', 'citron', 'figue', 'fraise', 'framboise', 'passion', 'groseille', 'melon', 'mirabelle', 'mûre', 'myrtille', 'nectarine', 'pastèque', 'pêche', 'prune', 'quetsche'],
          automne: ['avocat', 'carotte', 'céleri', 'champignon', 'chou', 'citrouille', 'courge', 'endive', 'épinard', 'fenouil', 'maïs', 'navet', 'oignon', 'panais', 'poireau', 'potimarron', 'potiron', 'topinambour', 'amande', 'châtaigne', 'citron', 'clémentine', 'coing', 'datte', 'figue', 'passion', 'kaki', 'mandarine', 'marron', 'mirabelle', 'mûre', 'myrtille', 'noisette', 'noix', 'papaye', 'pêche', 'poire', 'pomme', 'raisin'],
          hiver: ['avocat', 'betterave', 'carotte', 'champignon', 'chou', 'citrouille', 'courge', 'endive', 'oignon', 'panais', 'poireau', 'potimarron', 'potiron', 'salsifis', 'topinambour', 'ananas', 'banane', 'citron', 'clémentine', 'passion', 'grenade', 'kaki', 'litchi', 'mandarine', 'mangue', 'noisette', 'noix', 'orange', 'pamplemousse', 'poire', 'pomme', 'raisin']
        };

        const SEASONS_DATA = {
            printemps: { id: 'printemps', icon: '🌸', name: 'Printemps' },
            ete: { id: 'ete', icon: '☀️', name: 'Été' },
            automne: { id: 'automne', icon: '🍂', name: 'Automne' },
            hiver: { id: 'hiver', icon: '❄️', name: 'Hiver' }
        };

        const getCurrentActiveSeasons = () => {
          const month = new Date().getMonth();
          const activeIds = [];
          if ([10, 11, 0, 1, 2].includes(month)) activeIds.push('hiver');
          if ([1, 2, 3, 4, 5].includes(month)) activeIds.push('printemps');
          if ([4, 5, 6, 7, 8].includes(month)) activeIds.push('ete');
          if ([7, 8, 9, 10, 11].includes(month)) activeIds.push('automne');
          return activeIds.map(id => SEASONS_DATA[id]);
        };

        const getRecipeDominantSeasons = (ingredientsArray) => {
          if (!ingredientsArray || ingredientsArray.length === 0) return [];
          const text = ingredientsArray.join(' ').toLowerCase();
          const scores = { printemps: 0, ete: 0, automne: 0, hiver: 0 };
          
          Object.keys(SEASONAL_INGREDIENTS).forEach(season => {
              SEASONAL_INGREDIENTS[season].forEach(ing => {
                  if (text.includes(ing)) scores[season]++;
              });
          });

          let maxScore = 0;
          Object.values(scores).forEach(score => { if (score > maxScore) maxScore = score; });
          if (maxScore === 0) return [];
          return Object.keys(scores).filter(season => scores[season] === maxScore);
        };

        const getMatchingActiveSeasons = (ingredientsArray, activeSeasons) => {
          const dominantSeasonsIds = getRecipeDominantSeasons(ingredientsArray);
          return activeSeasons.filter(activeSeason => dominantSeasonsIds.includes(activeSeason.id));
        };

        // --- LOGIQUE GÉNÉRATEUR JOURNÉE TYPE ---
        const TYPICAL_DAYS = [
            {
                maxAge: 5,
                title: "Avant 6 mois",
                subtitle: "Lait exclusif",
                meals: [
                    { name: "Matin", icon: "🍼", text: "Allaitement maternel exclusif OU lait 1er âge." },
                    { name: "Midi", icon: "🍼", text: "Allaitement maternel OU lait 1er âge.\nDébut possible de la diversification vers 4-5 mois sur avis médical (quelques cuillères de purée lisse)." },
                    { name: "Goûter", icon: "🍼", text: "Allaitement maternel OU lait 1er âge." },
                    { name: "Soir", icon: "🌙", text: "Allaitement maternel OU lait 1er âge." }
                ]
            },
            {
                maxAge: 7,
                title: "De 6 à 7 mois",
                subtitle: "Début de la diversification",
                meals: [
                    { name: "Petit-déjeuner", icon: "🍼", text: "200 à 240 ml de lait 2e âge (ou allaitement).\nQuelques cuillerées de fruits." },
                    { name: "Déjeuner", icon: "🥣", text: "200 g de purée de légumes.\n10 g de viande, poisson ou œuf.\n5 g de beurre ou huile végétale.\n1/2 yaourt." },
                    { name: "Goûter", icon: "🍎", text: "200 à 240 ml de lait 2e âge.\n80 à 100 g de fruits." },
                    { name: "Dîner", icon: "🌙", text: "Lait (biberon ou tétée).\nSi insuffisant, petite purée avec des féculents." }
                ]
            },
            {
                maxAge: 9,
                title: "De 8 à 9 mois",
                subtitle: "Introduction des textures",
                meals: [
                    { name: "Petit-déjeuner", icon: "🍼", text: "250 ml de lait 2e âge (ou allaitement).\n1 petit fruit (cru, cuit ou jus)." },
                    { name: "Déjeuner", icon: "🥣", text: "140 g de purée de légumes + 50 g de féculents.\n15 g de viande, poisson ou œuf.\n5 g de beurre ou huile végétale.\n1/2 yaourt + 80 à 100 g de fruits." },
                    { name: "Goûter", icon: "🍎", text: "200 à 240 ml de lait 2e âge.\n80 à 100 g de fruits." },
                    { name: "Dîner", icon: "🌙", text: "140 g de légumes + 50 g de féculents.\n5 g de matières grasses.\n1/2 yaourt + 80 à 100 g de fruits.\n(Pas de protéines le soir)." }
                ]
            },
            {
                maxAge: 12,
                title: "De 10 à 12 mois",
                subtitle: "Les petits morceaux",
                meals: [
                    { name: "Petit-déjeuner", icon: "🥖", text: "250 ml de lait 2e âge.\n1 petit fruit.\n1 tartine de pain avec un peu de beurre." },
                    { name: "Déjeuner", icon: "🥣", text: "150 g d'écrasé de légumes + 50 à 60 g de féculents.\n20 g de viande, poisson ou œuf.\n5 g de matières grasses.\n1 yaourt ou petit-suisse + 80 à 100 g de fruits." },
                    { name: "Goûter", icon: "🍎", text: "250 ml de lait 2e âge.\n80 à 100 g de fruits." },
                    { name: "Dîner", icon: "🌙", text: "150 g de légumes + 50 à 60 g de féculents.\n5 g de matières grasses.\n1 yaourt ou petit-suisse + 80 à 100 g de fruits." }
                ]
            },
            {
                maxAge: 24,
                title: "De 1 à 2 ans",
                subtitle: "Comme les grands",
                meals: [
                    { name: "Petit-déjeuner", icon: "🥖", text: "250 ml de lait de croissance.\n1 petit fruit.\n1 tartine de pain avec un peu de beurre." },
                    { name: "Déjeuner", icon: "🥗", text: "30 g de crudités.\n90 à 110 g de légumes + 50 à 60 g de féculents.\n25 g de viande, poisson ou œuf.\n5 g de matières grasses.\n1 laitage + 80 à 100 g de fruits." },
                    { name: "Goûter", icon: "🍪", text: "250 ml de lait de croissance.\n80 à 100 g de fruits.\n1 biscuit ou tartine beurrée." },
                    { name: "Dîner", icon: "🌙", text: "30 g de crudités + 90 à 110 g de légumes + 50 à 60 g de féculents.\n5 g de matières grasses.\n1 laitage + 80 à 100 g de fruits." }
                ]
            }
        ];

        const getTypicalDayForAge = (ageInMonths) => {
            if (ageInMonths === null) return null;
            const profile = TYPICAL_DAYS.find(td => ageInMonths <= td.maxAge);
            return profile || TYPICAL_DAYS[TYPICAL_DAYS.length - 1];
        };

        // --- LOGIQUE COACH DIVERSIFICATION & RÈGLES D'OR ---
        const getCoachAdvice = (ageInMonths) => {
            if (ageInMonths === null) return null;
            if (ageInMonths < 6) return { texture: "Liquide", prot: "0g", fat: "Non", text: "Lait maternel ou infantile exclusif. La diversification peut commencer entre 4 et 6 mois sur avis médical." };
            if (ageInMonths <= 7) return { texture: "Mixé lisse", prot: "10g (2 c.à.c)", fat: "1 c.à.c", text: "C'est le début des découvertes ! Proposez des purées bien lisses pour l'habituer." };
            if (ageInMonths <= 9) return { texture: "Écrasé/Moulu", prot: "15g (3 c.à.c)", fat: "1 c.à.c", text: "On épaissit doucement les textures (écrasé à la fourchette) pour stimuler la mastication." };
            if (ageInMonths <= 12) return { texture: "Petits morceaux", prot: "20g (4 c.à.c)", fat: "1 c.à.c", text: "Bébé commence à manger presque comme les grands, avec des morceaux bien fondants." };
            return { texture: "Morceaux", prot: "25 à 30g", fat: "1 à 2 c.à.c", text: "Bébé mange de tout ! Veillez simplement à adapter la taille des morceaux." };
        };

        const getGoldenRules = (ageInMonths) => {
            if (ageInMonths === null) return [];
            const rules = [];
            if (ageInMonths < 12) {
                rules.push({ icon: '🚫', text: "Pas de sel ni de sucre ajouté." });
                rules.push({ icon: '🍯', text: "Strictement AUCUN miel (risque sévère de botulisme infantile)." });
            }
            if (ageInMonths < 15) {
                rules.push({ icon: '🫘', text: "Pas encore de légumes secs (lentilles, pois chiches...), le transit est trop immature." });
            }
            if (ageInMonths >= 12 && ageInMonths < 48) {
                 rules.push({ icon: '🥜', text: "Attention aux aliments ronds et durs (cacahuètes, tomates cerises entières, raisins) à cause des risques de fausse route." });
            }
            if (rules.length === 0) {
                rules.push({ icon: '💧', text: "Pensez à proposer de l'eau très régulièrement au cours de la journée." });
            }
            return rules;
        };

        // --- LOGIQUE TIPS D'ORGANISATION ---
        const TIPS_DICTIONARY = [
            {
                keywords: ['poulet', 'bœuf', 'boeuf', 'porc', 'veau', 'dinde', 'viande', 'agneau', 'saucisse', 'jambon'],
                icon: '🥩',
                title: "Astuce Multitâche",
                text: "Préparez la viande ou coupez vos légumes pendant que l'eau bout ou que la poêle chauffe pour gagner un temps précieux en cuisine."
            },
            {
                keywords: ['carotte', 'courgette', 'pomme', 'légume', 'tomate', 'poireau', 'aubergine', 'navet', 'potiron', 'potimarron'],
                icon: '🥕',
                title: "Ne pelez plus !",
                text: "Si vous achetez bio (ou sans pesticides), ne pelez pas vos légumes. Un bon brossage suffit ! La peau est un vrai cocktail nutritionnel riche en vitamines."
            },
            {
                keywords: ['pâtes', 'riz', 'eau', 'bouillon', 'quinoa', 'semoule', 'macaroni', 'spaghetti', 'penne'],
                icon: '🫖',
                title: "L'allié Bouilloire",
                text: "Utilisez votre bouilloire pour faire bouillir l'eau rapidement avant de la verser dans la casserole. Cuisson express garantie pour vos féculents et légumes !"
            },
            {
                keywords: ['salade', 'vinaigre', 'huile', 'laitue', 'mâche', 'endive'],
                icon: '🥗',
                title: "Préparation à l'avance",
                text: "Vous mangez souvent des salades ? Préparez votre base de vinaigrette pour la semaine dans un shaker, elle se conservera très bien et sera prête à l'emploi !"
            },
            {
                keywords: ['surgelé', 'pois', 'haricot', 'épinard', 'framboise', 'myrtille', 'salsifis'],
                icon: '🧊',
                title: "Pensez aux surgelés",
                text: "Les aliments natures surgelés ont quasiment les mêmes apports nutritionnels que les frais. Un gain de temps précieux en semaine pour choisir la juste quantité !"
            },
            {
                keywords: ['gratin', 'purée', 'soupe', 'velouté', 'compote', 'sauce'],
                icon: '❄️',
                title: "Voyez double !",
                text: "Ce plat se conserve très bien. Prévoyez de doubler les quantités afin de congeler la moitié de la préparation pour un soir où vous n'aurez pas le temps."
            },
            {
                keywords: ['pâte', 'biscuit', 'gâteau', 'tarte', 'pizza', 'crêpe', 'pancake'],
                icon: '👨‍👩‍👧‍👦',
                title: "Cuisinez à plusieurs",
                text: "La cuisine, c'est du partage ! Faites participer votre enfant à cette recette ludique. Les enfants apprécient d'autant plus lors de la dégustation."
            }
        ];

        const FALLBACK_TIP = {
            icon: '⏱️',
            title: "Organisation Chef",
            text: "Soyez multitâche : mettez la table pendant que le plat rissole ou que la préparation est en train de mixer. Chaque minute compte !"
        };

        const getRecipeTip = (ingredientsArray) => {
            if (!ingredientsArray) return FALLBACK_TIP;
            const text = ingredientsArray.join(' ').toLowerCase();
            
            // 1. On cherche TOUTES les astuces qui correspondent
            const matchingTips = TIPS_DICTIONARY.filter(tip => 
                tip.keywords.some(kw => text.includes(kw))
            );

            // 2. S'il y a des correspondances, on en tire une au sort
            if (matchingTips.length > 0) {
                const randomIndex = Math.floor(Math.random() * matchingTips.length);
                return matchingTips[randomIndex];
            }
            
            return FALLBACK_TIP;
        };

        const GENERAL_TIPS = [
            { icon: '📝', title: "Faites un planning", text: "Établissez vos menus de la semaine en un quart d'heure. Vous gagnerez du temps lors des courses et économiserez en n'achetant que le nécessaire." },
            { icon: '🧊', title: "Pensez aux surgelés", text: "Faites le plein d'aliments natures surgelés. Ils ont quasiment les mêmes apports nutritionnels que les frais et évitent le gaspillage !" },
            { icon: '🥕', title: "Ne pelez plus !", text: "Si vos légumes sont bio (ou sans pesticides), un bon brossage suffit. La peau est un cocktail nutritionnel riche en fibres et vitamines." },
            { icon: '🥗', title: "Préparations à l'avance", text: "Vous mangez souvent des salades ? Préparez votre base de vinaigrette pour la semaine dans un shaker, elle se conservera très bien." },
            { icon: '🧹', title: "Nettoyez au fur et à mesure", text: "Nettoyez et rangez vos ustensiles dès que vous n'en avez plus besoin. Un bon chef a toujours un plan de travail impeccable !" },
            { icon: '❄️', title: "Recyclez les restes", text: "Prévoyez de doubler les quantités pour congeler la moitié de la préparation (pourquoi pas en portions individuelles) pour un futur repas." }
        ];

        function App() {
          const [currentTab, setCurrentTab] = useState('home');
          const [selectedRecipe, setSelectedRecipe] = useState(null);
          const [selectedDayForAgenda, setSelectedDayForAgenda] = useState(DAYS_OF_WEEK[0]);
          
          const [babyProfile, setBabyProfile] = useState({ name: '', birthdate: '', photo: null });
          const [agenda, setAgenda] = useState({}); 
          const [shoppingList, setShoppingList] = useState([]); 
          
          const [user, setUser] = useState(null);
          const [appError, setAppError] = useState(null);
          const [familyCode, setFamilyCode] = useState(() => localStorage.getItem('cookidoudou_family_code') || '');
          const [tempFamilyCode, setTempFamilyCode] = useState(familyCode);

          const [showTypicalDayModal, setShowTypicalDayModal] = useState(false);
          const [showTipsModal, setShowTipsModal] = useState(false);
          
          // --- NOUVEAUX ÉTATS POUR LE ONBOARDING ET LE COACH ---
          const [showOnboardingModal, setShowOnboardingModal] = useState(() => localStorage.getItem('cookidoudou_onboarded') !== 'true');
          const [showMedicalConsentModal, setShowMedicalConsentModal] = useState(false);
          const [isCoachEnabled, setIsCoachEnabled] = useState(() => {
            const saved = localStorage.getItem('cookidoudou_coach_enabled');
            return saved !== null ? JSON.parse(saved) : false;
          });

          const currentActiveSeasons = useMemo(() => getCurrentActiveSeasons(), []);
          const [isSeasonalModeActive, setIsSeasonalModeActive] = useState(() => {
            const saved = localStorage.getItem('cookidoudou_season_mode');
            return saved !== null ? JSON.parse(saved) : true;
          });
          const [activeFilter, setActiveFilter] = useState('Tous');

          useEffect(() => {
            localStorage.setItem('cookidoudou_season_mode', JSON.stringify(isSeasonalModeActive));
            if (!isSeasonalModeActive && activeFilter === 'Saison') setActiveFilter('Tous');
          }, [isSeasonalModeActive, activeFilter]);

          const ageInMonths = useMemo(() => {
            if (!babyProfile.birthdate) return null;
            try {
                const diffTime = Math.abs(new Date() - new Date(babyProfile.birthdate));
                return Math.floor(Math.ceil(diffTime / (1000 * 60 * 60 * 24)) / 30.44); 
            } catch(e) { return null; }
          }, [babyProfile.birthdate]);

          // --- FIREBASE AUTH & SYNC ---
          useEffect(() => {
            const start = async () => {
              if (!window.FirebaseHelper) return;
              try {
                const app = window.FirebaseHelper.initializeApp(firebaseConfig);
                const auth = window.FirebaseHelper.getAuth(app);
                window._db = window.FirebaseHelper.getFirestore(app);
                try {
                    const cred = await window.FirebaseHelper.signInAnonymously(auth);
                    setUser(cred.user);
                    setAppError(null);
                } catch (authErr) { setAppError("Impossible de se connecter à la base."); }
              } catch (e) { console.error("Firebase Init Error", e); }
            };
            start();
          }, []);

          useEffect(() => {
            if (!user || !window._db || !familyCode) return;
            const fid = familyCode.trim().toLowerCase();
            const pRef = window.FirebaseHelper.doc(window._db, 'artifacts', appId, 'public', 'data', 'profiles', fid);
            const unsubP = window.FirebaseHelper.onSnapshot(pRef, (s) => {
              if (s.exists()) {
                const d = s.data();
                if (d.babyProfile) setBabyProfile(d.babyProfile);
                if (d.agenda) setAgenda(d.agenda);
                if (d.shoppingList) setShoppingList(d.shoppingList);
              }
            });
            return () => unsubP(); 
          }, [user, familyCode]);

          const saveToCloud = useCallback(async (data) => {
            if (!user || !window._db || !familyCode) return;
            const fid = familyCode.trim().toLowerCase();
            const docRef = window.FirebaseHelper.doc(window._db, 'artifacts', appId, 'public', 'data', 'profiles', fid);
            try { await window.FirebaseHelper.setDoc(docRef, data, { merge: true }); } catch (e) { console.error("Save error", e); }
          }, [user, familyCode]);

          const handleUpdateProfile = (newP) => { setBabyProfile(newP); saveToCloud({ babyProfile: newP }); };
          
          const addToAgenda = (day, rid) => {
            const newA = { ...agenda, [day]: rid };
            setAgenda(newA);
            const r = RECIPES.find(rec => rec.id === rid);
            let newS = [...shoppingList];
            if (r?.ingredients) {
                r.ingredients.forEach(i => { if (!newS.includes(i)) newS.push(i); });
                setShoppingList(newS);
            }
            saveToCloud({ agenda: newA, shoppingList: newS });
          };

          const removeFromShoppingList = (item) => {
            const newS = shoppingList.filter(i => i !== item);
            setShoppingList(newS);
            saveToCloud({ shoppingList: newS });
          };

          const copyShoppingList = () => {
              if (shoppingList.length === 0) return;
              const textToCopy = "Ma liste de courses Cookidoudou :\n\n- " + shoppingList.join("\n- ");
              try {
                  document.execCommand('copy'); 
                  navigator.clipboard.writeText(textToCopy);
                  alert("Liste copiée !");
              } catch (err) { alert("Impossible de copier la liste."); }
          };

          // --- GESTION DU COACH ---
          const handleCoachToggle = () => {
              if (isCoachEnabled) {
                  setIsCoachEnabled(false);
                  localStorage.setItem('cookidoudou_coach_enabled', JSON.stringify(false));
                  if (currentTab === 'coach') setCurrentTab('home');
              } else {
                  setShowMedicalConsentModal(true);
              }
          };

          const acceptMedicalConsent = () => {
              setIsCoachEnabled(true);
              localStorage.setItem('cookidoudou_coach_enabled', JSON.stringify(true));
              setShowMedicalConsentModal(false);
              setCurrentTab('coach'); // On redirige fièrement vers le nouvel onglet
          };

          const closeOnboarding = () => {
              setShowOnboardingModal(false);
              localStorage.setItem('cookidoudou_onboarded', 'true');
          };

          // --- VUES DE L'APPLICATION ---
          const renderHome = () => {
            const todayStr = new Date().toLocaleDateString('fr-FR', { weekday: 'long' }).replace(/^\w/, c => c.toUpperCase());
            const todayRecipe = RECIPES.find(r => r.id === agenda[todayStr]);
            const currentTypicalDay = getTypicalDayForAge(ageInMonths);
            
            return (
              <div className="space-y-6 animate-fadeIn pb-24">
                <div className="text-center">
                    <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest">{new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })}</p>
                    <h1 className="text-3xl font-black text-gray-800 tracking-tighter">Coucou {babyProfile.name || "!"}</h1>
                </div>
                
                {appError && (
                    <div className="bg-red-50 border border-red-200 p-5 rounded-3xl text-red-600 text-xs shadow-sm">
                        <div className="flex items-center gap-2 mb-2 font-black uppercase tracking-widest"><i className="fa-solid fa-triangle-exclamation"></i> Info</div>
                        <p className="leading-relaxed mb-3">{appError}</p>
                    </div>
                )}

                <div className="bg-white rounded-[2.5rem] p-6 shadow-sm border border-gray-100">
                    <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2 uppercase text-xs tracking-widest"><i className="fa-solid fa-calendar-day text-orange-500"></i> Menu du jour</h3>
                    {todayRecipe ? (
                        <div onClick={() => { setSelectedRecipe(todayRecipe); setCurrentTab('recipe_detail'); }} className="flex gap-4 cursor-pointer bg-orange-50 p-4 rounded-3xl group transition-all">
                            <div className="w-20 h-20 rounded-2xl bg-orange-100 overflow-hidden flex-shrink-0 shadow-sm relative">
                                <img src={todayRecipe.image} onError={(e)=>e.target.src=FALLBACK_IMAGE} loading="lazy" className="w-full h-full object-cover transition duration-500 group-hover:scale-110" alt={todayRecipe.title} />
                            </div>
                            <div className="flex-1 flex flex-col justify-center">
                                <h4 className="font-black text-gray-800 line-clamp-1">{todayRecipe.title}</h4>
                                <p className="text-xs text-orange-600 font-bold mt-1">⏱ {todayRecipe.time}</p>
                            </div>
                        </div>
                    ) : (
                        <div className="text-center py-6 opacity-60">
                            <i className="fa-solid fa-plate-wheat text-3xl text-gray-300 mb-2"></i>
                            <p className="text-sm text-gray-500 italic">Rien de prévu pour le moment.</p>
                            <button onClick={() => setCurrentTab('carnet')} className="mt-4 text-xs font-bold text-orange-500 uppercase tracking-widest bg-orange-50 px-4 py-2 rounded-xl">Voir les recettes</button>
                        </div>
                    )}
                </div>

                {/* LA SECTION COACH A ÉTÉ DÉPLACÉE DANS SON PROPRE ONGLET */}

                <div 
                    onClick={() => { if(ageInMonths !== null) setShowTypicalDayModal(true); else setCurrentTab('profile'); }}
                    className="bg-blue-500 rounded-[2.5rem] p-6 shadow-md text-white relative overflow-hidden cursor-pointer transition transform active:scale-95"
                >
                    <i className="fa-solid fa-clipboard-list absolute -right-6 -bottom-6 text-8xl opacity-10 transform -rotate-12"></i>
                    <div className="relative z-10">
                        <h3 className="font-black mb-2 flex items-center gap-2 uppercase text-xs tracking-widest">
                            <i className="fa-solid fa-lightbulb text-yellow-300"></i> Journée Type
                        </h3>
                        {ageInMonths !== null ? (
                            <>
                                <p className="text-sm font-medium leading-relaxed mb-3">Découvrez les portions et menus recommandés pour l'âge de {babyProfile.name || "bébé"} ({currentTypicalDay.title}).</p>
                                <div className="inline-flex items-center gap-2 bg-white/20 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-widest">
                                    Voir le menu <i className="fa-solid fa-arrow-right"></i>
                                </div>
                            </>
                        ) : (
                            <p className="text-sm font-medium leading-relaxed">Renseignez l'âge de votre enfant dans le profil pour découvrir sa journée type recommandée !</p>
                        )}
                    </div>
                </div>
              </div>
            );
          };

          // --- NOUVELLE VUE : ONGLET COACH ---
          const renderCoach = () => (
            <div className="animate-fadeIn space-y-6 pb-24">
                <div className="flex justify-between items-center mb-2">
                    <h1 className="text-2xl font-black text-gray-800">Coach Bébé</h1>
                </div>

                {ageInMonths === null ? (
                    <div className="text-center py-12 opacity-60 bg-white rounded-[2.5rem] p-6 shadow-sm border border-gray-100">
                        <i className="fa-solid fa-baby text-4xl mb-3 text-indigo-300"></i>
                        <p className="text-sm font-medium">Renseignez l'âge de votre enfant dans le profil pour activer les conseils.</p>
                        <button onClick={() => setCurrentTab('profile')} className="mt-4 text-xs font-bold text-indigo-500 uppercase tracking-widest bg-indigo-50 px-4 py-2 rounded-xl">Aller au profil</button>
                    </div>
                ) : (
                    <>
                        <div className="bg-gradient-to-br from-indigo-50 to-purple-50 rounded-[2.5rem] p-6 shadow-sm border border-indigo-100 relative overflow-hidden">
                            <i className="fa-solid fa-graduation-cap absolute -right-4 -bottom-4 text-7xl opacity-5 transform -rotate-12"></i>
                            <h3 className="font-black text-indigo-800 mb-4 flex items-center gap-2 uppercase text-xs tracking-widest relative z-10">
                                <i className="fa-solid fa-graduation-cap text-indigo-500"></i> Coach Diversification
                            </h3>
                            <p className="text-sm text-indigo-900 font-medium mb-5 leading-relaxed relative z-10">{getCoachAdvice(ageInMonths).text}</p>
                            
                            <div className="grid grid-cols-3 gap-3 relative z-10">
                                <div className="bg-white p-3 rounded-2xl shadow-sm text-center flex flex-col items-center justify-center">
                                    <span className="block text-2xl mb-1.5">🥣</span>
                                    <span className="block text-[8px] uppercase tracking-widest text-gray-400 font-black mb-1">Texture</span>
                                    <span className="text-[10px] leading-tight font-black text-indigo-700">{getCoachAdvice(ageInMonths).texture}</span>
                                </div>
                                <div className="bg-white p-3 rounded-2xl shadow-sm text-center flex flex-col items-center justify-center">
                                    <span className="block text-2xl mb-1.5">🥩</span>
                                    <span className="block text-[8px] uppercase tracking-widest text-gray-400 font-black mb-1">Protéines</span>
                                    <span className="text-[10px] leading-tight font-black text-indigo-700">{getCoachAdvice(ageInMonths).prot}</span>
                                </div>
                                <div className="bg-white p-3 rounded-2xl shadow-sm text-center flex flex-col items-center justify-center">
                                    <span className="block text-2xl mb-1.5">🧈</span>
                                    <span className="block text-[8px] uppercase tracking-widest text-gray-400 font-black mb-1">Matière gr.</span>
                                    <span className="text-[10px] leading-tight font-black text-indigo-700">{getCoachAdvice(ageInMonths).fat}</span>
                                </div>
                            </div>
                            <p className="text-[9px] text-indigo-400/80 mt-5 text-center font-medium italic relative z-10">* Conseils donnés à titre indicatif, ne remplaçant pas une consultation médicale.</p>
                        </div>

                        <div className="bg-red-50 rounded-[2rem] p-6 border border-red-100 shadow-sm">
                            <h4 className="font-black text-red-800 text-[10px] uppercase tracking-widest mb-4 flex items-center gap-2">
                                <i className="fa-solid fa-triangle-exclamation text-red-500"></i> Les Règles d'Or ({ageInMonths} mois)
                            </h4>
                            <div className="space-y-3">
                                {getGoldenRules(ageInMonths).map((rule, idx) => (
                                    <div key={idx} className="flex gap-3 items-start">
                                        <span className="text-lg leading-none mt-0.5">{rule.icon}</span>
                                        <p className="text-xs font-bold text-red-900 leading-relaxed">{rule.text}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </>
                )}
            </div>
          );

          const renderCarnet = () => {
            let recipesToDisplay = RECIPES;
            if (isSeasonalModeActive && activeFilter === 'Saison') {
                recipesToDisplay = RECIPES.filter(r => getMatchingActiveSeasons(r.ingredients, currentActiveSeasons).length > 0);
            }

            const grouped = recipesToDisplay.reduce((acc, r) => {
              const c = r.category?.includes("Entrée") ? "Entrées" : (r.category?.includes("Dessert") ? "Desserts" : "Plats");
              if (!acc[c]) acc[c] = []; acc[c].push(r); return acc;
            }, {});

            return (
              <div className="animate-fadeIn space-y-8 pb-24">
                <div className="flex justify-between items-center">
                    <h1 className="text-2xl font-black text-gray-800">Recettes</h1>
                </div>

                {isSeasonalModeActive && (
                    <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                        <button 
                            onClick={() => setActiveFilter('Tous')}
                            className={`px-4 py-2 rounded-2xl font-black text-[10px] uppercase tracking-widest whitespace-nowrap transition-all ${activeFilter === 'Tous' ? 'bg-gray-800 text-white shadow-md' : 'bg-white text-gray-500 border border-gray-200 hover:bg-gray-50'}`}
                        >
                            Toutes
                        </button>
                        <button 
                            onClick={() => setActiveFilter('Saison')}
                            className={`px-4 py-2 rounded-2xl font-black text-[10px] uppercase tracking-widest whitespace-nowrap transition-all flex items-center gap-1.5 ${activeFilter === 'Saison' ? 'bg-green-500 text-white shadow-md' : 'bg-green-50 text-green-700 border border-green-200 hover:bg-green-100'}`}
                        >
                            {currentActiveSeasons.map(s => s.icon).join('')} De saison ({currentActiveSeasons.map(s => s.name).join(' & ')})
                        </button>
                    </div>
                )}
                
                {["Entrées", "Plats", "Desserts"].map(c => grouped[c] && grouped[c].length > 0 && (
                    <div key={c} className="mb-8">
                      <h2 className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4 border-b pb-2 flex items-center justify-between">
                         <span>{c}</span>
                         <span className="bg-gray-100 px-2 py-1 rounded-full text-[8px]">{grouped[c].length} recettes</span>
                      </h2>
                      <div className="grid grid-cols-1 gap-3">
                        {grouped[c].sort((a,b)=>a.id-b.id).map(r => {
                          const matchingSeasons = getMatchingActiveSeasons(r.ingredients, currentActiveSeasons);
                          const isSeasonMatch = matchingSeasons.length > 0;
                          return (
                              <div key={r.id} onClick={()=>{setSelectedRecipe(r); setCurrentTab('recipe_detail');}} className="bg-white p-4 rounded-3xl flex gap-4 items-center border border-gray-100 hover:bg-orange-50 transition cursor-pointer group shadow-sm">
                                <div className="w-16 h-16 rounded-2xl bg-gray-100 overflow-hidden flex-shrink-0 shadow-inner relative">
                                    <img src={r.image} onError={(e)=>e.target.src=FALLBACK_IMAGE} loading="lazy" className="w-full h-full object-cover transition duration-500 group-hover:scale-110" alt={r.title} />
                                    {isSeasonalModeActive && isSeasonMatch && (
                                        <div className="absolute top-1 right-1 bg-white/90 backdrop-blur-sm px-1.5 py-0.5 rounded-full text-[10px] shadow-sm flex items-center justify-center h-5 leading-none gap-0.5">
                                            {matchingSeasons.map(s => <span key={s.id}>{s.icon}</span>)}
                                        </div>
                                    )}
                                </div>
                                <div className="flex-1">
                                  <h4 className="font-bold text-gray-800 text-sm line-clamp-1">{r.title}</h4>
                                  <p className="text-[10px] text-gray-400 font-bold mt-1">⏱ {r.time}</p>
                                </div>
                                <i className="fa-solid fa-chevron-right text-gray-200 text-xs mr-2"></i>
                              </div>
                          )
                        })}
                      </div>
                    </div>
                ))}

                {isSeasonalModeActive && activeFilter === 'Saison' && Object.keys(grouped).length === 0 && (
                    <div className="text-center py-12 opacity-60">
                        <i className="fa-solid fa-leaf text-4xl mb-3 text-green-300"></i>
                        <p className="text-sm font-medium">Aucune recette trouvée pour cette saison.</p>
                        <button onClick={() => setActiveFilter('Tous')} className="mt-4 text-xs font-bold text-gray-500 uppercase tracking-widest bg-gray-200 px-4 py-2 rounded-xl">Voir toutes les recettes</button>
                    </div>
                )}
              </div>
            );
          };

          const renderShopping = () => (
            <div className="animate-fadeIn space-y-6 pb-24">
              <div className="flex justify-between items-center">
                  <h1 className="text-2xl font-black text-gray-800">Ma Liste</h1>
                  <div className="flex gap-2">
                      <button onClick={() => setShowTipsModal(true)} className="text-yellow-600 bg-yellow-50 p-3 rounded-2xl hover:bg-yellow-100 transition active:scale-95 flex items-center gap-2" title="Astuces d'organisation">
                          <i className="fa-solid fa-lightbulb text-lg"></i>
                      </button>
                      {shoppingList.length > 0 && (
                          <button onClick={copyShoppingList} className="text-orange-500 bg-orange-50 p-3 rounded-2xl hover:bg-orange-100 transition active:scale-95" title="Copier la liste">
                              <i className="fa-solid fa-copy text-lg"></i>
                          </button>
                      )}
                  </div>
              </div>

              {shoppingList.length === 0 ? (
                  <div className="text-center py-24 opacity-20 flex flex-col items-center">
                      <i className="fa-solid fa-basket-shopping text-7xl mb-4"></i>
                      <p className="font-black uppercase tracking-widest text-xs">Panier vide</p>
                  </div>
              ) : (
                <div className="bg-white rounded-[2rem] border border-gray-100 overflow-hidden shadow-sm">
                  {shoppingList.map((item, i) => (
                    <div key={i} className="flex items-center gap-5 p-5 border-b border-gray-50 last:border-0 hover:bg-gray-50 transition">
                      <input type="checkbox" className="w-6 h-6 rounded-full border-2 border-gray-300 text-orange-500 focus:ring-orange-500 cursor-pointer accent-orange-500" onChange={() => setTimeout(() => removeFromShoppingList(item), 300)} />
                      <span className="text-sm font-bold text-gray-600 flex-1">{item}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );

          const renderDetail = () => {
            if (!selectedRecipe) return null;
            const r = selectedRecipe;
            const babySteps = r.babyAdaptations || [];
            
            let babyStepText = "Indiquez l'âge de bébé dans Profil pour voir les adaptations.";
            if (babyProfile.birthdate && ageInMonths !== null) {
                const step = babySteps.find(a => ageInMonths <= a.maxAge);
                babyStepText = step ? step.text : (babySteps[babySteps.length - 1]?.text || "Adaptation familiale standard");
            }

            // Génération de l'astuce contextuelle pour cette recette
            const recipeTip = getRecipeTip(r.ingredients);

            return (
              <div className="animate-fadeIn space-y-6 pb-32">
                <button onClick={()=>{setSelectedRecipe(null); setCurrentTab('carnet');}} className="text-gray-500 font-bold flex items-center gap-2 transition hover:text-gray-800 bg-white/80 px-4 py-2 rounded-full shadow-sm w-fit backdrop-blur-md border border-gray-100">
                    <i className="fa-solid fa-arrow-left"></i> Retour
                </button>
                
                <div className="relative">
                    <img src={r.image} onError={(e)=>e.target.src=FALLBACK_IMAGE} className="w-full h-72 object-cover rounded-[3rem] shadow-xl" alt={r.title} />
                    <div className="absolute bottom-4 right-4 bg-white/90 backdrop-blur-md px-4 py-2 rounded-2xl shadow-lg">
                        <span className="text-xs font-black text-gray-800">⏱ {r.time}</span>
                    </div>
                </div>

                <h1 className="text-3xl font-black text-gray-800 leading-tight px-2">{r.title}</h1>
                
                <div className="pt-2 flex gap-3 px-2">
                    <select value={selectedDayForAgenda} onChange={(e)=>setSelectedDayForAgenda(e.target.value)} className="flex-1 p-4 rounded-2xl bg-white border border-gray-200 font-black outline-none text-sm appearance-none shadow-sm focus:border-orange-400">
                      {DAYS_OF_WEEK.map(d=><option key={d} value={d}>{d}</option>)}
                    </select>
                    <button onClick={()=>{addToAgenda(selectedDayForAgenda, r.id); alert("Planifié avec succès ! Les ingrédients ont été ajoutés à votre liste.");}} className="bg-gray-900 text-white px-8 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg active:scale-95 transition hover:bg-black">
                        Planifier
                    </button>
                </div>

                <div className="bg-orange-500 p-8 rounded-[2.5rem] text-white shadow-xl mt-4 relative overflow-hidden">
                  <i className="fa-solid fa-baby absolute -right-4 -bottom-4 text-7xl opacity-10"></i>
                  <h4 className="font-black text-xs uppercase mb-3 flex items-center gap-2 relative z-10">
                      <i className="fa-solid fa-spoon"></i> Part de bébé ({ageInMonths !== null ? `${ageInMonths} mois` : '?'})
                  </h4>
                  <p className="text-sm leading-relaxed font-medium relative z-10 whitespace-pre-line">{babyStepText}</p>
                </div>

                <div className="space-y-8 pt-6 px-2">
                  <section>
                    <h3 className="font-black text-[10px] uppercase text-gray-400 mb-4 tracking-widest border-b pb-2">Ingrédients</h3>
                    <div className="grid grid-cols-1 gap-2">
                      {r.ingredients?.map((ing, idx) => (
                        <div key={idx} className="flex items-center gap-4 text-sm text-gray-700 bg-white p-4 rounded-2xl shadow-sm border border-gray-50">
                          <span className="w-2 h-2 bg-orange-400 rounded-full flex-shrink-0"></span>
                          <span className="font-medium">{ing}</span>
                        </div>
                      ))}
                    </div>
                  </section>

                  <section>
                    <h3 className="font-black text-[10px] uppercase text-gray-400 mb-4 tracking-widest border-b pb-2">Préparation</h3>
                    <div className="space-y-6">
                      {r.adultSteps?.map((s, idx) => (
                        <div key={idx} className="flex gap-5 bg-white p-5 rounded-3xl shadow-sm border border-gray-50">
                          <span className="font-black text-3xl text-orange-100 italic leading-none">{idx+1}</span>
                          <p className="text-sm leading-relaxed text-gray-600 font-medium pt-1">{s}</p>
                        </div>
                      ))}
                    </div>

                    {/* ENCART : ASTUCE DU CHEF (CONTEXTUELLE) */}
                    <div className="bg-yellow-50 p-6 rounded-[2rem] border border-yellow-100 shadow-sm relative overflow-hidden mt-6">
                        <div className="text-5xl absolute -right-3 -top-3 opacity-10 transform rotate-12">{recipeTip.icon}</div>
                        <h4 className="font-black text-yellow-800 text-[10px] uppercase tracking-widest mb-3 flex items-center gap-2 relative z-10">
                            <i className="fa-solid fa-lightbulb"></i> Astuce d'Orga
                        </h4>
                        <p className="text-sm font-medium text-yellow-900 leading-relaxed relative z-10">
                            <strong className="block mb-1 font-black">{recipeTip.title}</strong>
                            {recipeTip.text}
                        </p>
                    </div>
                  </section>

                  {/* SECTION : CONSERVATION ET NETTOYAGE (PERMANENTE) */}
                  <section className="pt-4">
                    <h3 className="font-black text-[10px] uppercase text-gray-400 mb-4 tracking-widest border-b pb-2">Les Réflexes en Cuisine</h3>
                    <div className="grid grid-cols-1 gap-4">
                        <div className="flex gap-4 bg-white p-5 rounded-3xl shadow-sm border border-gray-50 items-start">
                            <div className="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 text-xl flex-shrink-0">
                                <i className="fa-solid fa-broom"></i>
                            </div>
                            <div className="pt-1">
                                <h4 className="font-black text-gray-800 text-sm mb-1">Nettoyez au fur et à mesure</h4>
                                <p className="text-xs text-gray-500 leading-relaxed font-medium">Vous n'avez plus besoin d'un ustensile ? Nettoyez-le et rangez-le. C'est du temps de gagné à la fin du repas !</p>
                            </div>
                        </div>
                        <div className="flex gap-4 bg-white p-5 rounded-3xl shadow-sm border border-gray-50 items-start">
                            <div className="w-12 h-12 rounded-full bg-teal-50 flex items-center justify-center text-teal-500 text-xl flex-shrink-0">
                                <i className="fa-solid fa-snowflake"></i>
                            </div>
                            <div className="pt-1">
                                <h4 className="font-black text-gray-800 text-sm mb-1">Recyclez les restes</h4>
                                <p className="text-xs text-gray-500 leading-relaxed font-medium">Il vous reste des portions ? Congelez-les pour un futur repas où vous n'aurez pas le temps de cuisiner.</p>
                            </div>
                        </div>
                    </div>
                  </section>
                </div>
              </div>
            );
          };

          const renderProfile = () => (
            <div className="animate-fadeIn space-y-6 pb-24">
              <h1 className="text-2xl font-black text-gray-800">Configuration</h1>
              
              <div className="bg-white rounded-[3rem] p-8 border border-gray-100 flex flex-col items-center shadow-sm mb-6">
                <div className="w-28 h-28 rounded-full bg-orange-50 flex items-center justify-center border-4 border-white shadow-xl overflow-hidden mb-6 text-orange-200">
                  <i className="fa-solid fa-baby text-5xl"></i>
                </div>
                <div className="w-full space-y-4 text-center">
                    <div>
                        <label className="block text-[10px] font-black uppercase text-gray-400 mb-1 tracking-widest">Prénom de l'enfant</label>
                        <input type="text" value={babyProfile.name} onChange={(e) => handleUpdateProfile({...babyProfile, name: e.target.value})} placeholder="Ex: Léo" className="w-full bg-gray-50 p-4 rounded-2xl text-center font-black outline-none border border-transparent focus:border-orange-200 focus:bg-white transition" />
                    </div>
                    <div>
                        <label className="block text-[10px] font-black uppercase text-gray-400 mb-1 tracking-widest">Date de naissance</label>
                        <input type="date" value={babyProfile.birthdate} onChange={(e) => handleUpdateProfile({...babyProfile, birthdate: e.target.value})} className="w-full bg-gray-50 p-4 rounded-2xl text-center font-bold outline-none border border-transparent focus:border-orange-200 focus:bg-white transition" />
                    </div>
                </div>
              </div>

              {/* BLOC ACTIVATION DU COACH DIVERSIFICATION */}
              <div className="bg-white rounded-[2.5rem] p-8 border border-gray-100 shadow-sm mb-6 flex justify-between items-center">
                <div className="pr-4">
                  <h3 className="font-black mb-1 flex items-center gap-2 uppercase text-xs tracking-widest text-gray-800">
                    <i className="fa-solid fa-graduation-cap text-indigo-500"></i> Coach Diversification
                  </h3>
                  <p className="text-[10px] text-gray-500 font-medium leading-relaxed">
                    Débloquez un onglet dédié au suivi de l'alimentation de bébé.
                  </p>
                </div>
                <button 
                  onClick={handleCoachToggle}
                  className={`w-12 h-6 rounded-full p-1 transition-colors duration-200 ease-in-out flex flex-shrink-0 shadow-inner ${isCoachEnabled ? 'bg-indigo-500 justify-end' : 'bg-gray-300 justify-start'}`}
                >
                  <div className="w-4 h-4 rounded-full bg-white shadow-sm"></div>
                </button>
              </div>

              <div className="bg-white rounded-[2.5rem] p-8 border border-gray-100 shadow-sm mb-6 flex justify-between items-center">
                <div className="pr-4">
                  <h3 className="font-black mb-1 flex items-center gap-2 uppercase text-xs tracking-widest text-gray-800">
                    <i className="fa-solid fa-leaf text-green-500"></i> Mode 100% Saison
                  </h3>
                  <p className="text-[10px] text-gray-500 font-medium leading-relaxed">
                    Mettre en avant les recettes pour la saison en cours ({currentActiveSeasons.map(s => s.name + ' ' + s.icon).join(' et ')}).
                  </p>
                </div>
                <button 
                  onClick={() => setIsSeasonalModeActive(!isSeasonalModeActive)}
                  className={`w-12 h-6 rounded-full p-1 transition-colors duration-200 ease-in-out flex flex-shrink-0 shadow-inner ${isSeasonalModeActive ? 'bg-green-500 justify-end' : 'bg-gray-300 justify-start'}`}
                >
                  <div className="w-4 h-4 rounded-full bg-white shadow-sm"></div>
                </button>
              </div>

              <div className="bg-white rounded-[2.5rem] p-8 border border-gray-100 shadow-sm relative overflow-hidden">
                <i className="fa-solid fa-cloud absolute -right-6 -bottom-6 text-8xl text-blue-50 opacity-50"></i>
                <div className="relative z-10">
                    <h3 className="font-black mb-2 flex items-center gap-2 uppercase text-xs tracking-widest text-gray-800"><i className="fa-solid fa-link text-blue-500"></i> Partage Familial</h3>
                    <p className="text-xs text-gray-500 mb-6 font-medium leading-relaxed">Entrez un code secret pour synchroniser vos menus et courses sur un autre téléphone.</p>
                    <div className="flex gap-2">
                      <input type="text" value={tempFamilyCode} onChange={(e)=>setTempFamilyCode(e.target.value.toUpperCase())} placeholder="CODE SECRET" className="flex-1 bg-gray-50 p-4 rounded-2xl uppercase font-mono text-xs font-black outline-none border border-transparent focus:border-blue-200 transition" />
                      <button onClick={() => { if(!tempFamilyCode) return; setFamilyCode(tempFamilyCode); localStorage.setItem('cookidoudou_family_code', tempFamilyCode); alert("Synchronisation activée !"); }} className="bg-blue-600 text-white px-6 rounded-2xl font-black uppercase text-[10px] shadow-md active:scale-95 transition">Valider</button>
                    </div>
                    {familyCode && (
                        <div className="mt-5 inline-flex items-center gap-2 bg-green-50 px-3 py-2 rounded-xl">
                            <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> 
                            <span className="text-[10px] text-green-700 font-black uppercase tracking-widest">Connecté : {familyCode}</span>
                        </div>
                    )}
                </div>
              </div>
            </div>
          );

          return (
            <div className="min-h-screen bg-gray-50 flex flex-col relative overflow-x-hidden">
              <main className="flex-1 max-w-2xl mx-auto w-full p-6 pt-10 overflow-y-auto">
                {currentTab === 'home' && renderHome()}
                {currentTab === 'carnet' && renderCarnet()}
                {currentTab === 'coach' && isCoachEnabled && renderCoach()}
                {currentTab === 'shopping' && renderShopping()}
                {currentTab === 'profile' && renderProfile()}
                {currentTab === 'recipe_detail' && renderDetail()}
              </main>

              {/* FENÊTRE MODALE ONBOARDING (PREMIER LANCEMENT) */}
              {showOnboardingModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4 sm:p-6 animate-fadeIn">
                    <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl p-8 text-center relative overflow-hidden">
                        <div className="w-24 h-24 bg-orange-50 rounded-full flex items-center justify-center mx-auto mb-6 text-orange-400">
                            <i className="fa-solid fa-spoon text-5xl"></i>
                        </div>
                        <h2 className="text-2xl font-black text-gray-800 mb-3">Bienvenue dans Cookidoudou !</h2>
                        <p className="text-sm text-gray-600 font-medium leading-relaxed mb-8">
                            L'application pour nourrir toute la famille simplement. Trouvez des idées de saison, planifiez vos menus et organisez vos courses en un clin d'œil !
                        </p>
                        <button onClick={closeOnboarding} className="w-full bg-orange-500 hover:bg-orange-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs active:scale-95 transition">
                            C'est parti !
                        </button>
                    </div>
                </div>
              )}

              {/* FENÊTRE MODALE CONSENTEMENT MÉDICAL */}
              {showMedicalConsentModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-gray-900/60 backdrop-blur-md p-4 sm:p-6 animate-fadeIn">
                    <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden">
                        <div className="bg-red-50 p-8 text-center border-b border-red-100">
                            <i className="fa-solid fa-stethoscope text-4xl text-red-400 mb-4"></i>
                            <h2 className="text-xl font-black text-red-900 mb-2">Avertissement Médical</h2>
                            <p className="text-xs text-red-700 font-bold uppercase tracking-widest">À lire attentivement</p>
                        </div>
                        <div className="p-8">
                            <p className="text-sm text-gray-600 font-medium leading-relaxed mb-6 text-center">
                                Cookidoudou est un outil d'accompagnement culinaire. Les informations du Coach Diversification sont données à titre indicatif. 
                                <br/><br/>
                                <strong className="text-gray-800">Elles ne remplacent en aucun cas une consultation chez un médecin généraliste ou un pédiatre</strong>, particulièrement en cas de trouble alimentaire, de retard de croissance ou de suspicion d'allergie.
                            </p>
                            <div className="space-y-3">
                                <button onClick={acceptMedicalConsent} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs active:scale-95 transition shadow-md">
                                    J'ai compris et j'accepte
                                </button>
                                <button onClick={() => setShowMedicalConsentModal(false)} className="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 py-4 rounded-2xl font-black uppercase tracking-widest text-xs active:scale-95 transition">
                                    Annuler
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
              )}

              {/* FENÊTRE MODALE JOURNÉE TYPE */}
              {showTypicalDayModal && ageInMonths !== null && (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4 sm:p-6 animate-fadeIn">
                    <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="bg-blue-500 p-6 text-white relative flex-shrink-0">
                            <button onClick={() => setShowTypicalDayModal(false)} className="absolute top-6 right-6 w-8 h-8 bg-black/20 rounded-full flex items-center justify-center hover:bg-black/30 transition">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                            <h2 className="text-2xl font-black mb-1">{getTypicalDayForAge(ageInMonths).title}</h2>
                            <p className="text-blue-100 text-sm font-medium">{getTypicalDayForAge(ageInMonths).subtitle}</p>
                        </div>
                        
                        <div className="p-6 overflow-y-auto space-y-4 bg-gray-50 flex-1 hide-scrollbar">
                            {getTypicalDayForAge(ageInMonths).meals.map((meal, idx) => (
                                <div key={idx} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                                    <h4 className="font-black text-gray-800 flex items-center gap-2 mb-3">
                                        <span className="text-xl">{meal.icon}</span> {meal.name}
                                    </h4>
                                    <p className="text-sm text-gray-600 font-medium leading-relaxed whitespace-pre-line pl-8 border-l-2 border-blue-100">
                                        {meal.text}
                                    </p>
                                    {(meal.name === "Déjeuner" || meal.name === "Dîner" || meal.name === "Midi" || meal.name === "Soir") && ageInMonths >= 6 && (
                                        <button 
                                            onClick={() => { setShowTypicalDayModal(false); setCurrentTab('carnet'); }}
                                            className="mt-4 ml-8 text-[10px] font-black text-blue-500 uppercase tracking-widest bg-blue-50 px-3 py-1.5 rounded-xl hover:bg-blue-100 transition"
                                        >
                                            Trouver une recette <i className="fa-solid fa-arrow-right ml-1"></i>
                                        </button>
                                    )}
                                </div>
                            ))}
                        </div>
                        
                        <div className="p-6 bg-white border-t border-gray-100 flex-shrink-0">
                            <button onClick={() => setShowTypicalDayModal(false)} className="w-full bg-gray-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs active:scale-95 transition">
                                J'ai compris
                            </button>
                        </div>
                    </div>
                </div>
              )}

              {/* FENÊTRE MODALE BOÎTE À ASTUCES GLOBALES */}
              {showTipsModal && (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4 sm:p-6 animate-fadeIn">
                    <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="bg-yellow-400 p-6 text-yellow-900 relative flex-shrink-0">
                            <button onClick={() => setShowTipsModal(false)} className="absolute top-6 right-6 w-8 h-8 bg-black/10 rounded-full flex items-center justify-center hover:bg-black/20 transition text-yellow-900">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                            <h2 className="text-2xl font-black mb-1 flex items-center gap-2">
                                <i className="fa-solid fa-lightbulb"></i> Boîte à Astuces
                            </h2>
                            <p className="text-yellow-800 text-sm font-medium">L'organisation est le maître mot pour gagner du temps en cuisine.</p>
                        </div>
                        
                        <div className="p-6 overflow-y-auto space-y-4 bg-gray-50 flex-1 hide-scrollbar">
                            {GENERAL_TIPS.map((tip, idx) => (
                                <div key={idx} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex gap-4 items-start">
                                    <div className="text-3xl flex-shrink-0">{tip.icon}</div>
                                    <div>
                                        <h4 className="font-black text-gray-800 mb-1">{tip.title}</h4>
                                        <p className="text-sm text-gray-600 font-medium leading-relaxed">{tip.text}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        <div className="p-6 bg-white border-t border-gray-100 flex-shrink-0">
                            <button onClick={() => setShowTipsModal(false)} className="w-full bg-gray-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs active:scale-95 transition">
                                C'est noté !
                            </button>
                        </div>
                    </div>
                </div>
              )}

              {/* Barre de navigation */}
              <nav className="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-xl border-t border-gray-100 flex justify-around py-4 px-2 z-50 pb-safe shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                {[
                  { id: 'home', icon: 'fa-house', label: 'Accueil' },
                  { id: 'carnet', icon: 'fa-book-open', label: 'Recettes' },
                  ...(isCoachEnabled ? [{ id: 'coach', icon: 'fa-graduation-cap', label: 'Coach' }] : []),
                  { id: 'shopping', icon: 'fa-cart-shopping', label: 'Courses' },
                  { id: 'profile', icon: 'fa-user', label: 'Profil' }
                ].map(t => (
                  <button key={t.id} onClick={() => { setCurrentTab(t.id); setSelectedRecipe(null); }} className={`flex flex-col items-center gap-1.5 relative w-16 ${currentTab === t.id || (t.id === 'carnet' && currentTab === 'recipe_detail') ? 'text-orange-500' : 'text-gray-400 hover:text-gray-600'} transition-colors duration-200`}>
                    <div className={`transition-transform duration-300 ${currentTab === t.id || (t.id === 'carnet' && currentTab === 'recipe_detail') ? '-translate-y-1 scale-110' : ''}`}>
                        <i className={`fa-solid ${t.icon} text-xl`}></i>
                    </div>
                    <span className={`text-[9px] font-black uppercase tracking-widest transition-opacity duration-300 ${currentTab === t.id || (t.id === 'carnet' && currentTab === 'recipe_detail') ? 'opacity-100' : 'opacity-70'}`}>{t.label}</span>
                    {(currentTab === t.id || (t.id === 'carnet' && currentTab === 'recipe_detail')) && (
                        <span className="absolute -bottom-2 w-1 h-1 bg-orange-500 rounded-full"></span>
                    )}
                  </button>
                ))}
              </nav>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
