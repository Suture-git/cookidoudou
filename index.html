<body class="bg-gray-50 font-sans text-gray-900 overflow-x-hidden">

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        const FALLBACK_IMAGE = "https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=600&q=80";

        // --- CONFIGURATION FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCOY2zjdwiQ9fIHfKdTt3B5c5eH5NocWUk",
            authDomain: "cookidoudou-4ac92.firebaseapp.com",
            projectId: "cookidoudou-4ac92",
            storageBucket: "cookidoudou-4ac92.firebasestorage.app",
            messagingSenderId: "590128476695",
            appId: "1:590128476695:web:821122bbc1e8280694e252"
        };
        const appId = "cookidoudou-app";

        const RECIPES = (typeof window !== 'undefined' && window.RECIPES) ? window.RECIPES : [];
        const DAYS_OF_WEEK = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];

        // --- FONCTION UTILITAIRE : AGE EN MOIS ---
        const calculateAgeInMonths = (birthdate) => {
            if (!birthdate) return null;
            try {
                const diffTime = Math.abs(new Date() - new Date(birthdate));
                return Math.floor(Math.ceil(diffTime / (1000 * 60 * 60 * 24)) / 30.44); 
            } catch(e) { return null; }
        };

        // --- LOGIQUE MODE 100% SAISON ---
        const SEASONAL_INGREDIENTS = {
          printemps: ['asperge', 'carotte', 'champignon', 'chou', 'courgette', 'épinard', 'navet', 'oignon', 'radis', 'tomate', 'abricot', 'cerise', 'citron', 'fraise', 'framboise', 'passion', 'pêche', 'rhubarbe'],
          ete: ['artichaut', 'aubergine', 'blette', 'brocoli', 'carotte', 'céleri', 'champignon', 'chou', 'concombre', 'courgette', 'épinard', 'fenouil', 'haricot', 'oignon', 'pois', 'poivron', 'tomate', 'abricot', 'cassis', 'cerise', 'citron', 'figue', 'fraise', 'framboise', 'passion', 'groseille', 'melon', 'mirabelle', 'mûre', 'myrtille', 'nectarine', 'pastèque', 'pêche', 'prune', 'quetsche'],
          automne: ['avocat', 'carotte', 'céleri', 'champignon', 'chou', 'citrouille', 'courge', 'endive', 'épinard', 'fenouil', 'maïs', 'navet', 'oignon', 'panais', 'poireau', 'potimarron', 'potiron', 'topinambour', 'amande', 'châtaigne', 'citron', 'clémentine', 'coing', 'datte', 'figue', 'passion', 'kaki', 'mandarine', 'marron', 'mirabelle', 'mûre', 'myrtille', 'noisette', 'noix', 'papaye', 'pêche', 'poire', 'pomme', 'raisin'],
          hiver: ['avocat', 'betterave', 'carotte', 'champignon', 'chou', 'citrouille', 'courge', 'endive', 'oignon', 'panais', 'poireau', 'potimarron', 'potiron', 'salsifis', 'topinambour', 'ananas', 'banane', 'citron', 'clémentine', 'passion', 'grenade', 'kaki', 'litchi', 'mandarine', 'mangue', 'noisette', 'noix', 'orange', 'pamplemousse', 'poire', 'pomme', 'raisin']
        };

        const SEASONS_DATA = {
            printemps: { id: 'printemps', icon: '🌸', name: 'Printemps' },
            ete: { id: 'ete', icon: '☀️', name: 'Été' },
            automne: { id: 'automne', icon: '🍂', name: 'Automne' },
            hiver: { id: 'hiver', icon: '❄️', name: 'Hiver' }
        };

        const getCurrentActiveSeasons = () => {
          const month = new Date().getMonth();
          const activeIds = [];
          if ([10, 11, 0, 1, 2].includes(month)) activeIds.push('hiver');
          if ([1, 2, 3, 4, 5].includes(month)) activeIds.push('printemps');
          if ([4, 5, 6, 7, 8].includes(month)) activeIds.push('ete');
          if ([7, 8, 9, 10, 11].includes(month)) activeIds.push('automne');
          return activeIds.map(id => SEASONS_DATA[id]);
        };

        const getRecipeDominantSeasons = (ingredientsArray) => {
          if (!ingredientsArray || ingredientsArray.length === 0) return [];
          const text = ingredientsArray.join(' ').toLowerCase();
          const scores = { printemps: 0, ete: 0, automne: 0, hiver: 0 };
          
          Object.keys(SEASONAL_INGREDIENTS).forEach(season => {
              SEASONAL_INGREDIENTS[season].forEach(ing => {
                  if (text.includes(ing)) scores[season]++;
              });
          });

          let maxScore = 0;
          Object.values(scores).forEach(score => { if (score > maxScore) maxScore = score; });
          if (maxScore === 0) return [];
          return Object.keys(scores).filter(season => scores[season] === maxScore);
        };

        const getMatchingActiveSeasons = (ingredientsArray, activeSeasons) => {
          const dominantSeasonsIds = getRecipeDominantSeasons(ingredientsArray);
          return activeSeasons.filter(activeSeason => dominantSeasonsIds.includes(activeSeason.id));
        };

        // --- LOGIQUE CATÉGORIES DE COURSES ---
        const SHOPPING_CATEGORIES = [
            { id: 'frais', icon: '🥦', name: 'Fruits & Légumes', keywords: ['pomme', 'carotte', 'courgette', 'oignon', 'tomate', 'poireau', 'aubergine', 'navet', 'potiron', 'potimarron', 'salade', 'laitue', 'mâche', 'endive', 'citron', 'fraise', 'framboise', 'banane', 'ail', 'poivron', 'champignon', 'avocat', 'épinard', 'patate', 'terre', 'radis', 'brocoli', 'chou', 'asperge', 'mangue', 'pêche', 'poire', 'raisin', 'clémentine', 'orange'] },
            { id: 'viande', icon: '🥩', name: 'Boucherie & Poissonnerie', keywords: ['poulet', 'bœuf', 'boeuf', 'porc', 'veau', 'dinde', 'viande', 'agneau', 'saucisse', 'jambon', 'poisson', 'saumon', 'cabillaud', 'crevette', 'lardon', 'merlu', 'thon', 'colin', 'truite'] },
            { id: 'laitier', icon: '🧀', name: 'Rayon Frais', keywords: ['beurre', 'crème', 'yaourt', 'fromage', 'œuf', 'oeuf', 'lait', 'gruyère', 'emmental', 'parmesan', 'mozzarella', 'mascarpone', 'feta', 'chèvre', 'suisse', 'laitage'] },
            { id: 'sale', icon: '🍝', name: 'Épicerie Salée', keywords: ['pâte', 'riz', 'lentille', 'huile', 'sel', 'poivre', 'épice', 'conserve', 'bouillon', 'quinoa', 'semoule', 'macaroni', 'spaghetti', 'penne', 'moutarde', 'vinaigre', 'sauce', 'soja', 'pois chiche', 'haricot', 'purée', 'farine de pois', 'tomates pelées', 'ketchup', 'mayonnaise', 'olive'] },
            { id: 'sucre', icon: '🍯', name: 'Épicerie Sucrée', keywords: ['farine', 'sucre', 'chocolat', 'miel', 'biscuit', 'confiture', 'compote', 'cacao', 'vanille', 'levure', 'amande', 'noisette', 'noix', 'gâteau'] },
            { id: 'surgelé', icon: '❄️', name: 'Surgelés', keywords: ['surgelé', 'petit pois', 'glace', 'épinard haché', 'frites'] },
            { id: 'boulangerie', icon: '🥖', name: 'Boulangerie', keywords: ['pain', 'baguette', 'mie', 'brioche', 'biscotte', 'croissant'] }
        ];

        const categorizeIngredient = (ingredient) => {
            if (!ingredient) return 'autres';
            const lowerIng = ingredient.toLowerCase();
            for (const cat of SHOPPING_CATEGORIES) {
                if (cat.keywords.some(kw => lowerIng.includes(kw))) {
                    return cat.id;
                }
            }
            return 'autres';
        };

        // --- LOGIQUE GÉNÉRATEUR JOURNÉE TYPE ---
        const TYPICAL_DAYS = [
            { maxAge: 5, title: "Avant 6 mois", subtitle: "Lait exclusif", meals: [{ name: "Matin", icon: "🍼", text: "Allaitement maternel exclusif OU lait 1er âge." }, { name: "Midi", icon: "🍼", text: "Allaitement maternel OU lait 1er âge.\nDébut possible de la diversification vers 4-5 mois sur avis médical." }, { name: "Goûter", icon: "🍼", text: "Allaitement maternel OU lait 1er âge." }, { name: "Soir", icon: "🌙", text: "Allaitement maternel OU lait 1er âge." }] },
            { maxAge: 7, title: "De 6 à 7 mois", subtitle: "Début de la diversification", meals: [{ name: "Petit-déjeuner", icon: "🍼", text: "200 à 240 ml de lait 2e âge (ou allaitement).\nQuelques cuillerées de fruits." }, { name: "Déjeuner", icon: "🥣", text: "200 g de purée de légumes.\n10 g de viande, poisson ou œuf.\n5 g de beurre ou huile végétale.\n1/2 yaourt." }, { name: "Goûter", icon: "🍎", text: "200 à 240 ml de lait 2e âge.\n80 à 100 g de fruits." }, { name: "Dîner", icon: "🌙", text: "Lait (biberon ou tétée).\nSi insuffisant, petite purée avec des féculents." }] },
            { maxAge: 9, title: "De 8 à 9 mois", subtitle: "Introduction des textures", meals: [{ name: "Petit-déjeuner", icon: "🍼", text: "250 ml de lait 2e âge (ou allaitement).\n1 petit fruit (cru, cuit ou jus)." }, { name: "Déjeuner", icon: "🥣", text: "140 g de purée de légumes + 50 g de féculents.\n15 g de viande, poisson ou œuf.\n5 g de beurre ou huile végétale.\n1/2 yaourt + 80 à 100 g de fruits." }, { name: "Goûter", icon: "🍎", text: "200 à 240 ml de lait 2e âge.\n80 à 100 g de fruits." }, { name: "Dîner", icon: "🌙", text: "140 g de légumes + 50 g de féculents.\n5 g de matières grasses.\n1/2 yaourt + 80 à 100 g de fruits.\n(Pas de protéines le soir)." }] },
            { maxAge: 12, title: "De 10 à 12 mois", subtitle: "Les petits morceaux", meals: [{ name: "Petit-déjeuner", icon: "🥖", text: "250 ml de lait 2e âge.\n1 petit fruit.\n1 tartine de pain avec un peu de beurre." }, { name: "Déjeuner", icon: "🥣", text: "150 g d'écrasé de légumes + 50 à 60 g de féculents.\n20 g de viande, poisson ou œuf.\n5 g de matières grasses.\n1 yaourt ou petit-suisse + 80 à 100 g de fruits." }, { name: "Goûter", icon: "🍎", text: "250 ml de lait 2e âge.\n80 à 100 g de fruits." }, { name: "Dîner", icon: "🌙", text: "150 g de légumes + 50 à 60 g de féculents.\n5 g de matières grasses.\n1 yaourt ou petit-suisse + 80 à 100 g de fruits." }] },
            { maxAge: 24, title: "De 1 à 2 ans", subtitle: "Comme les grands", meals: [{ name: "Petit-déjeuner", icon: "🥖", text: "250 ml de lait de croissance.\n1 petit fruit.\n1 tartine de pain avec un peu de beurre." }, { name: "Déjeuner", icon: "🥗", text: "30 g de crudités.\n90 à 110 g de légumes + 50 à 60 g de féculents.\n25 g de viande, poisson ou œuf.\n5 g de matières grasses.\n1 laitage + 80 à 100 g de fruits." }, { name: "Goûter", icon: "🍪", text: "250 ml de lait de croissance.\n80 à 100 g de fruits.\n1 biscuit ou tartine beurrée." }, { name: "Dîner", icon: "🌙", text: "30 g de crudités + 90 à 110 g de légumes + 50 à 60 g de féculents.\n5 g de matières grasses.\n1 laitage + 80 à 100 g de fruits." }] }
        ];

        const getTypicalDayForAge = (ageInMonths) => {
            if (ageInMonths === null) return null;
            const profile = TYPICAL_DAYS.find(td => ageInMonths <= td.maxAge);
            return profile || TYPICAL_DAYS[TYPICAL_DAYS.length - 1];
        };

        // --- LOGIQUE COACH DIVERSIFICATION & PRÉCAUTIONS IMPORTANTES ---
        const getCoachAdvice = (ageInMonths) => {
            if (ageInMonths === null) return null;
            if (ageInMonths < 6) return { texture: "Liquide", prot: "0g", fat: "Non", text: "Lait maternel ou infantile exclusif. La diversification peut commencer entre 4 et 6 mois sur avis médical." };
            if (ageInMonths <= 7) return { texture: "Mixé lisse", prot: "10g (2 c.à.c)", fat: "1 c.à.c", text: "C'est le début des découvertes ! Proposez des purées bien lisses pour l'habituer." };
            if (ageInMonths <= 9) return { texture: "Écrasé/Moulu", prot: "15g (3 c.à.c)", fat: "1 c.à.c", text: "On épaissit doucement les textures (écrasé à la fourchette) pour stimuler la mastication." };
            if (ageInMonths <= 12) return { texture: "Petits morceaux", prot: "20g (4 c.à.c)", fat: "1 c.à.c", text: "Bébé commence à manger presque comme les grands, avec des morceaux bien fondants." };
            return { texture: "Morceaux", prot: "25 à 30g", fat: "1 à 2 c.à.c", text: "Bébé mange de tout ! Veillez simplement à adapter la taille des morceaux." };
        };

        const getGoldenRules = (ageInMonths) => {
            if (ageInMonths === null) return [];
            const rules = [];
            if (ageInMonths < 12) {
                rules.push({ icon: '🚫', text: "Pas de sel ni de sucre ajouté." });
                rules.push({ icon: '🍯', text: "Strictement AUCUN miel (risque sévère de botulisme infantile)." });
            }
            if (ageInMonths < 15) {
                rules.push({ icon: '🫘', text: "Pas encore de légumes secs (lentilles, pois chiches...), le transit est trop immature." });
            }
            if (ageInMonths >= 12 && ageInMonths < 48) {
                 rules.push({ icon: '🥜', text: "Attention aux aliments ronds et durs (cacahuètes, tomates cerises entières, raisins) à cause des risques de fausse route." });
            }
            if (rules.length === 0) {
                rules.push({ icon: '💧', text: "Pensez à proposer de l'eau très régulièrement au cours de la journée." });
            }
            return rules;
        };

        // --- LOGIQUE TIPS D'ORGANISATION ---
        const TIPS_DICTIONARY = [
            { keywords: ['poulet', 'bœuf', 'boeuf', 'porc', 'veau', 'dinde', 'viande', 'agneau', 'saucisse', 'jambon'], icon: '🥩', title: "Astuce Multitâche", text: "Préparez la viande ou coupez vos légumes pendant que l'eau bout ou que la poêle chauffe pour gagner un temps précieux en cuisine." },
            { keywords: ['carotte', 'courgette', 'pomme', 'légume', 'tomate', 'poireau', 'aubergine', 'navet', 'potiron', 'potimarron'], icon: '🥕', title: "Ne pelez plus !", text: "Si vous achetez bio (ou sans pesticides), ne pelez pas vos légumes. Un bon brossage suffit ! La peau est un vrai cocktail nutritionnel riche en vitamines." },
            { keywords: ['pâtes', 'riz', 'eau', 'bouillon', 'quinoa', 'semoule', 'macaroni', 'spaghetti', 'penne'], icon: '🫖', title: "L'allié Bouilloire", text: "Utilisez votre bouilloire pour faire bouillir l'eau rapidement avant de la verser dans la casserole. Cuisson express garantie pour vos féculents et légumes !" },
            { keywords: ['salade', 'vinaigre', 'huile', 'laitue', 'mâche', 'endive'], icon: '🥗', title: "Préparation à l'avance", text: "Vous mangez souvent des salades ? Préparez votre base de vinaigrette pour la semaine dans un shaker, elle se conservera très bien et sera prête à l'emploi !" },
            { keywords: ['surgelé', 'pois', 'haricot', 'épinard', 'framboise', 'myrtille', 'salsifis'], icon: '🧊', title: "Pensez aux surgelés", text: "Les aliments natures surgelés ont quasiment les mêmes apports nutritionnels que les frais. Un gain de temps précieux en semaine pour choisir la juste quantité !" },
            { keywords: ['gratin', 'purée', 'soupe', 'velouté', 'compote', 'sauce'], icon: '❄️', title: "Voyez double !", text: "Ce plat se conserve très bien. Prévoyez de doubler les quantités afin de congeler la moitié de la préparation pour un soir où vous n'aurez pas le temps." },
            { keywords: ['pâte', 'biscuit', 'gâteau', 'tarte', 'pizza', 'crêpe', 'pancake'], icon: '👨‍👩‍👧‍👦', title: "Cuisinez à plusieurs", text: "La cuisine, c'est du partage ! Faites participer votre enfant à cette recette ludique. Les enfants apprécient d'autant plus lors de la dégustation." }
        ];

        const FALLBACK_TIP = { icon: '⏱️', title: "Organisation Chef", text: "Soyez multitâche : mettez la table pendant que le plat rissole ou que la préparation est en train de mixer. Chaque minute compte !" };

        const getRecipeTip = (ingredientsArray) => {
            if (!ingredientsArray) return FALLBACK_TIP;
            const text = ingredientsArray.join(' ').toLowerCase();
            const matchingTips = TIPS_DICTIONARY.filter(tip => tip.keywords.some(kw => text.includes(kw)));
            if (matchingTips.length > 0) return matchingTips[Math.floor(Math.random() * matchingTips.length)];
            return FALLBACK_TIP;
        };

        const GENERAL_TIPS = [
            { icon: '📝', title: "Faites un planning", text: "Établissez vos menus de la semaine en un quart d'heure. Vous gagnerez du temps lors des courses et économiserez en n'achetant que le nécessaire." },
            { icon: '🧊', title: "Pensez aux surgelés", text: "Faites le plein d'aliments natures surgelés. Ils ont quasiment les mêmes apports nutritionnels que les frais et évitent le gaspillage !" },
            { icon: '🥕', title: "Ne pelez plus !", text: "Si vos légumes sont bio (ou sans pesticides), un bon brossage suffit. La peau est un cocktail nutritionnel riche en fibres et vitamines." },
            { icon: '🥗', title: "Préparations à l'avance", text: "Vous mangez souvent des salades ? Préparez votre base de vinaigrette pour la semaine dans un shaker, elle se conservera très bien." },
            { icon: '🧹', title: "Nettoyez au fur et à mesure", text: "Nettoyez et rangez vos ustensiles dès que vous n'en avez plus besoin. Un bon chef a toujours un plan de travail impeccable !" },
            { icon: '❄️', title: "Recyclez les restes", text: "Prévoyez de doubler les quantités pour congeler la moitié de la préparation (pourquoi pas en portions individuelles) pour un futur repas." }
        ];

        function App() {
          const [currentTab, setCurrentTab] = useState('home');
          const [selectedRecipe, setSelectedRecipe] = useState(null);
          const [selectedDayForAgenda, setSelectedDayForAgenda] = useState(DAYS_OF_WEEK[0]);
          
          const todayStrGlobal = new Date().toLocaleDateString('fr-FR', { weekday: 'long' }).replace(/^\w/, c => c.toUpperCase());
          const [selectedHomeDay, setSelectedHomeDay] = useState(todayStrGlobal);

          const [children, setChildren] = useState([]); 
          const [agenda, setAgenda] = useState({}); // Format: { "Lundi": [id1, id2], ... }
          const [shoppingList, setShoppingList] = useState([]); 
          
          const [user, setUser] = useState(null);
          const [appError, setAppError] = useState(null);
          const [familyCode, setFamilyCode] = useState(() => localStorage.getItem('cookidoudou_family_code') || '');
          const [tempFamilyCode, setTempFamilyCode] = useState(familyCode);

          const [showTypicalDayModal, setShowTypicalDayModal] = useState(false);
          const [activeModalChildId, setActiveModalChildId] = useState(null); 
          const [showTipsModal, setShowTipsModal] = useState(false);

          // --- MODALES GÉNÉRATEUR DE SEMAINE ---
          const [showGeneratorModal, setShowGeneratorModal] = useState(false);
          const [genConfig, setGenConfig] = useState({
              weekdayMeals: 1,
              weekendMeals: 2,
              structure: 'Plat + Dessert'
          });
          
          const [showOnboardingModal, setShowOnboardingModal] = useState(() => localStorage.getItem('cookidoudou_onboarded') !== 'true');
          const [showMedicalConsentModal, setShowMedicalConsentModal] = useState(false);
          const [isCoachEnabled, setIsCoachEnabled] = useState(() => {
            const saved = localStorage.getItem('cookidoudou_coach_enabled');
            return saved !== null ? JSON.parse(saved) : false;
          });

          const currentActiveSeasons = useMemo(() => getCurrentActiveSeasons(), []);
          const [isSeasonalModeActive, setIsSeasonalModeActive] = useState(() => {
            const saved = localStorage.getItem('cookidoudou_season_mode');
            return saved !== null ? JSON.parse(saved) : true;
          });

          useEffect(() => {
            localStorage.setItem('cookidoudou_season_mode', JSON.stringify(isSeasonalModeActive));
          }, [isSeasonalModeActive]);

          // --- FIREBASE AUTH & SYNC ---
          useEffect(() => {
            const start = async () => {
              if (!window.FirebaseHelper) return;
              try {
                const app = window.FirebaseHelper.initializeApp(firebaseConfig);
                const auth = window.FirebaseHelper.getAuth(app);
                window._db = window.FirebaseHelper.getFirestore(app);
                try {
                    const cred = await window.FirebaseHelper.signInAnonymously(auth);
                    setUser(cred.user);
                    setAppError(null);
                } catch (authErr) { setAppError("Erreur de connexion (Vérifiez les restrictions d'URL Google Cloud)."); }
              } catch (e) { console.error("Firebase Init Error", e); }
            };
            start();
          }, []);

          useEffect(() => {
            if (!user || !window._db || !familyCode) return;
            const fid = familyCode.trim().toLowerCase();
            const pRef = window.FirebaseHelper.doc(window._db, 'artifacts', appId, 'public', 'data', 'profiles', fid);
            const unsubP = window.FirebaseHelper.onSnapshot(pRef, (s) => {
              if (s.exists()) {
                const d = s.data();
                
                if (d.children && d.children.length > 0) {
                    setChildren(d.children);
                } else if (d.babyProfile && (d.babyProfile.name || d.babyProfile.birthdate)) {
                    setChildren([{ id: 'child-migrated-1', ...d.babyProfile }]);
                }
                
                // Migration du planning (si l'ancienne version avait un ID simple au lieu d'un tableau)
                if (d.agenda) {
                    const migratedAgenda = {};
                    Object.keys(d.agenda).forEach(day => {
                        const val = d.agenda[day];
                        if (val) {
                            migratedAgenda[day] = Array.isArray(val) ? val : [val];
                        }
                    });
                    setAgenda(migratedAgenda);
                }
                if (d.shoppingList) setShoppingList(d.shoppingList);
              }
            });
            return () => unsubP(); 
          }, [user, familyCode]);

          const saveToCloud = useCallback(async (data) => {
            if (!user || !window._db || !familyCode) return;
            const fid = familyCode.trim().toLowerCase();
            const docRef = window.FirebaseHelper.doc(window._db, 'artifacts', appId, 'public', 'data', 'profiles', fid);
            try { await window.FirebaseHelper.setDoc(docRef, data, { merge: true }); } catch (e) { console.error("Save error", e); }
          }, [user, familyCode]);

          // --- GESTION DES ENFANTS ---
          const updateChild = (childId, updates) => {
              const newChildren = children.map(c => c.id === childId ? { ...c, ...updates } : c);
              setChildren(newChildren);
              saveToCloud({ children: newChildren });
          };

          const addChild = () => {
              if (children.length >= 3) return;
              const newChildren = [...children, { id: `child-${Date.now()}`, name: '', birthdate: '', photo: null }];
              setChildren(newChildren);
              saveToCloud({ children: newChildren });
          };

          const removeChild = (childId) => {
              const newChildren = children.filter(c => c.id !== childId);
              setChildren(newChildren);
              saveToCloud({ children: newChildren });
          };

          const handlePhotoUpload = (e, childId) => {
              const file = e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = (event) => {
                  const img = new Image();
                  img.onload = () => {
                      const canvas = document.createElement('canvas');
                      const MAX_SIZE = 300; 
                      const size = Math.min(img.width, img.height);
                      const startX = (img.width - size) / 2;
                      const startY = (img.height - size) / 2;
                      canvas.width = MAX_SIZE; canvas.height = MAX_SIZE;
                      const ctx = canvas.getContext('2d');
                      ctx.drawImage(img, startX, startY, size, size, 0, 0, MAX_SIZE, MAX_SIZE);
                      updateChild(childId, { photo: canvas.toDataURL('image/jpeg', 0.8) });
                  };
                  img.src = event.target.result;
              };
              reader.readAsDataURL(file);
          };

          // --- GESTION DU PLANNING (MULTI-RECETTES) ---
          const addToAgenda = (day, rid) => {
            const currentDayList = agenda[day] || [];
            if (currentDayList.length >= 6) {
                alert("Menu complet ! Vous ne pouvez pas ajouter plus de 6 recettes pour ce jour.");
                return;
            }
            if (currentDayList.includes(rid)) {
                alert("Cette recette est déjà prévue pour ce jour !");
                return;
            }
            const newA = { ...agenda, [day]: [...currentDayList, rid] };
            setAgenda(newA);
            
            const r = RECIPES.find(rec => rec.id === rid);
            let newS = [...shoppingList];
            if (r?.ingredients) {
                r.ingredients.forEach(i => { if (!newS.includes(i)) newS.push(i); });
                setShoppingList(newS);
            }
            saveToCloud({ agenda: newA, shoppingList: newS });
            alert("Recette ajoutée au planning avec succès !");
          };

          const removeFromAgenda = (day, rid) => {
             const currentDayList = agenda[day] || [];
             const newA = { ...agenda, [day]: currentDayList.filter(id => id !== rid) };
             setAgenda(newA);
             saveToCloud({ agenda: newA });
          };

          // --- GÉNÉRATEUR DE SEMAINE MAGIQUE ---
          const generateWeeklyMenu = () => {
            let availableRecipes = RECIPES;
            if (isSeasonalModeActive) {
                const seasonal = RECIPES.filter(r => getMatchingActiveSeasons(r.ingredients, currentActiveSeasons).length > 0);
                if (seasonal.length > 5) availableRecipes = seasonal; // Sécurité au cas où il n'y aurait pas assez de recettes pour la saison
            }

            const entrees = availableRecipes.filter(r => r.category?.includes("Entrée"));
            const plats = availableRecipes.filter(r => r.category?.includes("Plat"));
            const desserts = availableRecipes.filter(r => r.category?.includes("Dessert"));

            // Helper pour éviter de manger 4 fois la même chose dans la semaine
            const getRandom = (arr, excludeIds) => {
                let available = arr.filter(r => !excludeIds.includes(r.id));
                if (available.length === 0) available = arr; // On recommence s'il n'y a plus de choix
                return available[Math.floor(Math.random() * available.length)];
            };

            const newAgenda = {};
            let newShoppingList = [...shoppingList];
            let usedIds = [];

            DAYS_OF_WEEK.forEach(day => {
                const isWeekend = day === 'Samedi' || day === 'Dimanche';
                const mealsCount = isWeekend ? genConfig.weekendMeals : genConfig.weekdayMeals;
                
                let dayRecipes = [];
                for(let i=0; i<mealsCount; i++) {
                    if (genConfig.structure.includes('Entrée') && entrees.length > 0) {
                        const r = getRandom(entrees, usedIds);
                        if (r) { dayRecipes.push(r); usedIds.push(r.id); }
                    }
                    if (genConfig.structure.includes('Plat') && plats.length > 0) {
                        const r = getRandom(plats, usedIds);
                        if (r) { dayRecipes.push(r); usedIds.push(r.id); }
                    }
                    if (genConfig.structure.includes('Dessert') && desserts.length > 0) {
                        const r = getRandom(desserts, usedIds);
                        if (r) { dayRecipes.push(r); usedIds.push(r.id); }
                    }
                }

                // Déduplication & limite à 6 recettes max par jour
                const uniqueDayIds = Array.from(new Set(dayRecipes.map(r => r.id))).slice(0, 6);
                newAgenda[day] = uniqueDayIds;

                uniqueDayIds.forEach(id => {
                    const rec = RECIPES.find(r => r.id === id);
                    if(rec?.ingredients) {
                        rec.ingredients.forEach(i => {
                            if(!newShoppingList.includes(i)) newShoppingList.push(i);
                        });
                    }
                });
            });

            setAgenda(newAgenda);
            setShoppingList(newShoppingList);
            saveToCloud({ agenda: newAgenda, shoppingList: newShoppingList });
            setShowGeneratorModal(false);
            alert("✨ Menu de la semaine généré avec succès !");
            setCurrentTab('home');
          };

          // --- AUTRES HANDLERS ---
          const removeFromShoppingList = (item) => {
            const newS = shoppingList.filter(i => i !== item);
            setShoppingList(newS);
            saveToCloud({ shoppingList: newS });
          };

          const copyShoppingList = () => {
              if (shoppingList.length === 0) return;
              const textToCopy = "Ma liste de courses Cookidoudou :\n\n- " + shoppingList.join("\n- ");
              try { document.execCommand('copy'); navigator.clipboard.writeText(textToCopy); alert("Liste copiée !"); } catch (err) { alert("Erreur copie."); }
          };

          const handleCoachToggle = () => {
              if (isCoachEnabled) { setIsCoachEnabled(false); localStorage.setItem('cookidoudou_coach_enabled', JSON.stringify(false)); if (currentTab === 'coach') setCurrentTab('home'); } 
              else { setShowMedicalConsentModal(true); }
          };

          const acceptMedicalConsent = () => {
              setIsCoachEnabled(true); localStorage.setItem('cookidoudou_coach_enabled', JSON.stringify(true)); setShowMedicalConsentModal(false); setCurrentTab('coach');
          };

          const closeOnboarding = () => { setShowOnboardingModal(false); localStorage.setItem('cookidoudou_onboarded', 'true'); };

          const greetingNames = children.length > 0 ? children.map(c => c.name || "Bébé").join(' et ') : "!";

          // --- VUES DE L'APPLICATION ---
          const renderHome = () => {
            const todayStr = new Date().toLocaleDateString('fr-FR', { weekday: 'long' }).replace(/^\w/, c => c.toUpperCase());
            const displayRecipeIds = agenda[selectedHomeDay] || [];
            const displayRecipes = displayRecipeIds.map(id => RECIPES.find(r => r.id === id)).filter(Boolean);
            const menuTitle = selectedHomeDay === todayStr ? "Menu d'aujourd'hui" : `Menu du ${selectedHomeDay}`;
            
            return (
              <div className="space-y-6 animate-fadeIn pb-24">
                <div className="text-center">
                    <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest">{new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })}</p>
                    <h1 className="text-3xl font-black text-gray-800 tracking-tighter">Coucou {greetingNames}</h1>
                </div>

                {/* MA SEMAINE EN UN COUP D'OEIL */}
                <div className="bg-white rounded-[2rem] p-4 shadow-sm border border-gray-100">
                    <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2 uppercase text-[10px] tracking-widest px-2"><i className="fa-solid fa-calendar-week text-blue-500"></i> La Semaine</h3>
                    <div className="flex gap-3 overflow-x-auto hide-scrollbar pb-2 px-2">
                       {DAYS_OF_WEEK.map(day => {
                           const dayRecs = (agenda[day] || []).map(id => RECIPES.find(r => r.id === id)).filter(Boolean);
                           const isToday = day === todayStr;
                           const isSelected = day === selectedHomeDay;
                           return (
                               <div key={day} onClick={() => setSelectedHomeDay(day)} className={`flex flex-col items-center p-3 rounded-2xl min-w-[4rem] shadow-inner border cursor-pointer transition-all transform active:scale-95 ${isSelected ? 'ring-2 ring-orange-400 bg-orange-50 border-orange-200' : 'bg-gray-50 border-gray-100/50 hover:bg-gray-100'}`}>
                                   <span className={`text-[10px] font-black uppercase tracking-widest mb-2 relative ${isSelected ? 'text-orange-600' : isToday ? 'text-orange-400' : 'text-gray-400'}`}>
                                       {day.substring(0,3)}
                                       {isToday && !isSelected && <span className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-1 h-1 bg-orange-400 rounded-full"></span>}
                                   </span>
                                   <div className="flex flex-col gap-1 items-center">
                                       {dayRecs.length > 0 ? dayRecs.slice(0, 3).map((r, i) => (
                                           <div key={i} className="relative z-10" style={{ marginTop: i > 0 ? '-10px' : '0' }}>
                                              <img src={r.image} className="recipe-mini-avatar" alt={r.title} />
                                           </div>
                                       )) : (
                                          <div className="w-8 h-8 rounded-full bg-white border border-dashed border-gray-300 flex items-center justify-center"><i className="fa-solid fa-plus text-gray-200 text-xs"></i></div>
                                       )}
                                       {dayRecs.length > 3 && <span className="text-[8px] font-black text-gray-500 mt-1">+{dayRecs.length - 3}</span>}
                                   </div>
                               </div>
                           )
                       })}
                    </div>
                </div>

                {/* MENU DU JOUR SÉLECTIONNÉ (MULTI-RECETTES) */}
                <div className="bg-white rounded-[2.5rem] p-6 shadow-sm border border-gray-100">
                    <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2 uppercase text-xs tracking-widest"><i className="fa-solid fa-utensils text-orange-500"></i> {menuTitle}</h3>
                    {displayRecipes.length > 0 ? (
                        <div className="space-y-3">
                            {displayRecipes.map((r, idx) => (
                                <div key={idx} className="flex gap-4 bg-orange-50 p-3 pr-4 rounded-3xl items-center relative group">
                                    <div onClick={() => { setSelectedRecipe(r); setCurrentTab('recipe_detail'); }} className="flex gap-4 items-center flex-1 cursor-pointer">
                                        <div className="w-16 h-16 rounded-2xl bg-orange-100 overflow-hidden flex-shrink-0 shadow-sm relative">
                                            <img src={r.image} onError={(e)=>e.target.src=FALLBACK_IMAGE} className="w-full h-full object-cover transition duration-500 group-hover:scale-110" alt={r.title} />
                                        </div>
                                        <div className="flex-1">
                                            <h4 className="font-black text-gray-800 text-sm line-clamp-1">{r.title}</h4>
                                            <p className="text-[10px] text-orange-600 font-bold mt-1">⏱ {r.time}</p>
                                        </div>
                                    </div>
                                    {/* BOUTON SUPPRIMER */}
                                    <button onClick={(e) => { e.stopPropagation(); removeFromAgenda(selectedHomeDay, r.id); }} className="w-8 h-8 bg-white text-gray-400 rounded-full flex items-center justify-center shadow-sm hover:text-red-500 hover:bg-red-50 transition flex-shrink-0" title="Retirer du menu">
                                        <i className="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="text-center py-6 opacity-60">
                            <i className="fa-solid fa-plate-wheat text-3xl text-gray-300 mb-2"></i>
                            <p className="text-sm text-gray-500 italic">Rien de prévu pour ce jour.</p>
                            <button onClick={() => setCurrentTab('carnet')} className="mt-4 text-xs font-bold text-orange-500 uppercase tracking-widest bg-orange-50 px-4 py-2 rounded-xl">Voir les recettes</button>
                        </div>
                    )}
                </div>

                <div 
                    onClick={() => { if(children.length > 0) { setActiveModalChildId(children[0].id); setShowTypicalDayModal(true); } else { setCurrentTab('profile'); } }}
                    className="bg-blue-500 rounded-[2.5rem] p-6 shadow-md text-white relative overflow-hidden cursor-pointer transition transform active:scale-95"
                >
                    <i className="fa-solid fa-clipboard-list absolute -right-6 -bottom-6 text-8xl opacity-10 transform -rotate-12"></i>
                    <div className="relative z-10">
                        <h3 className="font-black mb-2 flex items-center gap-2 uppercase text-xs tracking-widest"><i className="fa-solid fa-lightbulb text-yellow-300"></i> Journée Type</h3>
                        {children.length > 0 ? (
                            <>
                                <p className="text-sm font-medium leading-relaxed mb-3">Découvrez les portions et menus recommandés selon l'âge.</p>
                                <div className="inline-flex items-center gap-2 bg-white/20 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-widest">Voir le menu <i className="fa-solid fa-arrow-right"></i></div>
                            </>
                        ) : (
                            <p className="text-sm font-medium leading-relaxed">Ajoutez un enfant dans le profil pour découvrir sa journée type !</p>
                        )}
                    </div>
                </div>
              </div>
            );
          };

          const renderCoach = () => (
            <div className="animate-fadeIn space-y-6 pb-24">
                <div className="flex justify-between items-center mb-2">
                    <h1 className="text-2xl font-black text-gray-800">Coach Bébé</h1>
                </div>

                {children.length === 0 ? (
                    <div className="text-center py-12 opacity-60 bg-white rounded-[2.5rem] p-6 shadow-sm border border-gray-100">
                        <i className="fa-solid fa-baby text-4xl mb-3 text-indigo-300"></i>
                        <p className="text-sm font-medium">Ajoutez un enfant dans le profil pour activer les conseils.</p>
                        <button onClick={() => setCurrentTab('profile')} className="mt-4 text-xs font-bold text-indigo-500 uppercase tracking-widest bg-indigo-50 px-4 py-2 rounded-xl">Aller au profil</button>
                    </div>
                ) : (
                    children.map(child => {
                        const ageInMonths = calculateAgeInMonths(child.birthdate);
                        if (ageInMonths === null) return null;
                        
                        return (
                            <div key={child.id} className="bg-white rounded-[3rem] p-6 shadow-sm border border-gray-100 mb-8 last:mb-0 relative overflow-hidden">
                                <i className="fa-solid fa-graduation-cap absolute -right-6 -bottom-6 text-8xl opacity-[0.03] transform -rotate-12"></i>
                                
                                {/* EN-TÊTE ENFANT */}
                                <div className="flex items-center gap-4 mb-6 border-b border-gray-50 pb-5 relative z-10">
                                    <div className="w-14 h-14 rounded-full overflow-hidden bg-indigo-50 border-2 border-white shadow-md flex items-center justify-center flex-shrink-0 text-indigo-200">
                                        {child.photo ? <img src={child.photo} className="w-full h-full object-cover" /> : <i className="fa-solid fa-baby text-2xl"></i>}
                                    </div>
                                    <div>
                                        <h2 className="text-xl font-black text-gray-800">{child.name || "Bébé"}</h2>
                                        <p className="text-xs text-indigo-500 font-bold uppercase tracking-widest">{ageInMonths} mois</p>
                                    </div>
                                </div>

                                {/* BLOC ÉTAPE */}
                                <div className="bg-gradient-to-br from-indigo-50 to-purple-50 rounded-3xl p-5 mb-5 border border-indigo-100 relative z-10">
                                    <h3 className="font-black text-indigo-800 mb-3 flex items-center gap-2 uppercase text-[10px] tracking-widest">
                                        <i className="fa-solid fa-bullseye text-indigo-500"></i> Étape actuelle
                                    </h3>
                                    <p className="text-sm text-indigo-900 font-medium mb-4 leading-relaxed">{getCoachAdvice(ageInMonths).text}</p>
                                    
                                    <div className="grid grid-cols-3 gap-2">
                                        <div className="bg-white p-3 rounded-2xl shadow-sm text-center flex flex-col justify-center">
                                            <span className="block text-xl mb-1">🥣</span>
                                            <span className="block text-[8px] uppercase tracking-widest text-gray-400 font-black mb-1">Texture</span>
                                            <span className="text-[10px] leading-tight font-black text-indigo-700">{getCoachAdvice(ageInMonths).texture}</span>
                                        </div>
                                        <div className="bg-white p-3 rounded-2xl shadow-sm text-center flex flex-col justify-center">
                                            <span className="block text-xl mb-1">🥩</span>
                                            <span className="block text-[8px] uppercase tracking-widest text-gray-400 font-black mb-1">Protéines</span>
                                            <span className="text-[10px] leading-tight font-black text-indigo-700">{getCoachAdvice(ageInMonths).prot}</span>
                                        </div>
                                        <div className="bg-white p-3 rounded-2xl shadow-sm text-center flex flex-col justify-center">
                                            <span className="block text-xl mb-1">🧈</span>
                                            <span className="block text-[8px] uppercase tracking-widest text-gray-400 font-black mb-1">Matières gr.</span>
                                            <span className="text-[10px] leading-tight font-black text-indigo-700">{getCoachAdvice(ageInMonths).fat}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* BLOC PRÉCAUTIONS IMPORTANTES */}
                                <div className="bg-red-50 rounded-3xl p-5 border border-red-100 relative z-10">
                                    <h4 className="font-black text-red-800 text-[10px] uppercase tracking-widest mb-4 flex items-center gap-2">
                                        <i className="fa-solid fa-triangle-exclamation text-red-500"></i> Précautions importantes
                                    </h4>
                                    <div className="space-y-3">
                                        {getGoldenRules(ageInMonths).map((rule, idx) => (
                                            <div key={idx} className="flex gap-3 items-start bg-white/50 p-3 rounded-2xl">
                                                <span className="text-lg leading-none mt-0.5">{rule.icon}</span>
                                                <p className="text-xs font-bold text-red-900 leading-relaxed">{rule.text}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <p className="text-[9px] text-gray-400 mt-5 text-center font-medium italic relative z-10">* Conseils donnés à titre indicatif, ne remplaçant pas une consultation médicale.</p>
                            </div>
                        );
                    })
                )}
            </div>
          );

          const renderCarnet = () => {
            let recipesToDisplay = RECIPES;
            if (isSeasonalModeActive) {
                recipesToDisplay = RECIPES.filter(r => getMatchingActiveSeasons(r.ingredients, currentActiveSeasons).length > 0);
            }

            const grouped = recipesToDisplay.reduce((acc, r) => {
              const c = r.category?.includes("Entrée") ? "Entrées" : (r.category?.includes("Dessert") ? "Desserts" : "Plats");
              if (!acc[c]) acc[c] = []; acc[c].push(r); return acc;
            }, {});

            return (
              <div className="animate-fadeIn space-y-8 pb-24">
                <div className="flex justify-between items-center mb-2">
                    <h1 className="text-2xl font-black text-gray-800">Recettes</h1>
                </div>

                {/* BOUTON INSPIRATION MAGIQUE */}
                <div onClick={() => setShowGeneratorModal(true)} className="bg-gradient-to-r from-orange-400 to-rose-400 rounded-[2rem] p-6 shadow-md text-white relative overflow-hidden cursor-pointer transition transform hover:-translate-y-1 active:scale-95 flex items-center justify-between">
                    <div className="relative z-10">
                        <h3 className="font-black text-lg mb-1 flex items-center gap-2"><i className="fa-solid fa-wand-magic-sparkles"></i> Besoin d'inspiration ?</h3>
                        <p className="text-sm font-medium text-orange-50">Générer un menu de la semaine complet.</p>
                    </div>
                    <div className="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center relative z-10 flex-shrink-0">
                        <i className="fa-solid fa-arrow-right"></i>
                    </div>
                </div>

                {isSeasonalModeActive && (
                    <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                        <div className="px-4 py-2 rounded-2xl font-black text-[10px] uppercase tracking-widest whitespace-nowrap bg-green-500 text-white shadow-md flex items-center gap-1.5">
                            {currentActiveSeasons.map(s => s.icon).join('')} De saison ({currentActiveSeasons.map(s => s.name).join(' & ')})
                        </div>
                    </div>
                )}
                
                {["Entrées", "Plats", "Desserts"].map(c => grouped[c] && grouped[c].length > 0 && (
                    <div key={c} className="mb-8">
                      <h2 className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4 border-b pb-2 flex items-center justify-between">
                         <span>{c}</span>
                         <span className="bg-gray-100 px-2 py-1 rounded-full text-[8px]">{grouped[c].length} recettes</span>
                      </h2>
                      <div className="grid grid-cols-1 gap-3">
                        {grouped[c].sort((a,b)=>a.id-b.id).map(r => {
                          const matchingSeasons = getMatchingActiveSeasons(r.ingredients, currentActiveSeasons);
                          const isSeasonMatch = matchingSeasons.length > 0;
                          return (
                              <div key={r.id} onClick={()=>{setSelectedRecipe(r); setCurrentTab('recipe_detail');}} className="bg-white p-4 rounded-3xl flex gap-4 items-center border border-gray-100 hover:bg-orange-50 transition cursor-pointer group shadow-sm">
                                <div className="w-16 h-16 rounded-2xl bg-gray-100 overflow-hidden flex-shrink-0 shadow-inner relative">
                                    <img src={r.image} onError={(e)=>e.target.src=FALLBACK_IMAGE} loading="lazy" className="w-full h-full object-cover transition duration-500 group-hover:scale-110" alt={r.title} />
                                    {isSeasonalModeActive && isSeasonMatch && (
                                        <div className="absolute top-1 right-1 bg-white/90 backdrop-blur-sm px-1.5 py-0.5 rounded-full text-[10px] shadow-sm flex items-center justify-center h-5 leading-none gap-0.5">
                                            {matchingSeasons.map(s => <span key={s.id}>{s.icon}</span>)}
                                        </div>
                                    )}
                                </div>
                                <div className="flex-1">
                                  <h4 className="font-bold text-gray-800 text-sm line-clamp-1">{r.title}</h4>
                                  <p className="text-[10px] text-gray-400 font-bold mt-1">⏱ {r.time}</p>
                                </div>
                                <i className="fa-solid fa-chevron-right text-gray-200 text-xs mr-2"></i>
                              </div>
                          )
                        })}
                      </div>
                    </div>
                ))}

                {isSeasonalModeActive && Object.keys(grouped).length === 0 && (
                    <div className="text-center py-12 opacity-60">
                        <i className="fa-solid fa-leaf text-4xl mb-3 text-green-300"></i>
                        <p className="text-sm font-medium">Aucune recette trouvée pour cette saison.</p>
                        <button onClick={() => setIsSeasonalModeActive(false)} className="mt-4 text-xs font-bold text-gray-500 uppercase tracking-widest bg-gray-200 px-4 py-2 rounded-xl">Désactiver le filtre</button>
                    </div>
                )}
              </div>
            );
          };

          const renderShopping = () => {
            // Regroupement par catégorie
            const groupedShopping = shoppingList.reduce((acc, item) => {
                const catId = categorizeIngredient(item);
                if (!acc[catId]) acc[catId] = [];
                acc[catId].push(item);
                return acc;
            }, {});

            const allCategories = [...SHOPPING_CATEGORIES, { id: 'autres', icon: '🛒', name: 'Autres' }];

            return (
              <div className="animate-fadeIn space-y-6 pb-24">
                <div className="flex justify-between items-center">
                    <h1 className="text-2xl font-black text-gray-800">Ma Liste</h1>
                    <div className="flex gap-2">
                        <button onClick={() => setShowTipsModal(true)} className="text-yellow-600 bg-yellow-50 p-3 rounded-2xl hover:bg-yellow-100 transition active:scale-95 flex items-center gap-2" title="Astuces d'organisation">
                            <i className="fa-solid fa-lightbulb text-lg"></i>
                        </button>
                        {shoppingList.length > 0 && (
                            <button onClick={copyShoppingList} className="text-orange-500 bg-orange-50 p-3 rounded-2xl hover:bg-orange-100 transition active:scale-95" title="Copier la liste">
                                <i className="fa-solid fa-copy text-lg"></i>
                            </button>
                        )}
                    </div>
                </div>

                {shoppingList.length === 0 ? (
                    <div className="text-center py-24 opacity-20 flex flex-col items-center">
                        <i className="fa-solid fa-basket-shopping text-7xl mb-4"></i>
                        <p className="font-black uppercase tracking-widest text-xs">Panier vide</p>
                    </div>
                ) : (
                  <div className="space-y-6">
                    {allCategories.map(cat => {
                        if (!groupedShopping[cat.id] || groupedShopping[cat.id].length === 0) return null;
                        
                        return (
                            <div key={cat.id} className="bg-white rounded-[2rem] border border-gray-100 overflow-hidden shadow-sm">
                                <div className="bg-gray-50 px-5 py-3 border-b border-gray-100 flex items-center gap-3">
                                    <span className="text-xl">{cat.icon}</span>
                                    <h3 className="font-black text-gray-800 uppercase tracking-widest text-[10px]">{cat.name}</h3>
                                    <span className="ml-auto bg-white px-2 py-1 rounded-full text-[9px] font-bold text-gray-400 shadow-sm border border-gray-100">{groupedShopping[cat.id].length}</span>
                                </div>
                                <div>
                                    {groupedShopping[cat.id].map((item, i) => (
                                        <div key={i} className="flex items-center gap-5 p-5 border-b border-gray-50 last:border-0 hover:bg-gray-50 transition">
                                            <input type="checkbox" className="w-6 h-6 rounded-full border-2 border-gray-300 text-orange-500 focus:ring-orange-500 cursor-pointer accent-orange-500" onChange={() => setTimeout(() => removeFromShoppingList(item), 300)} />
                                            <span className="text-sm font-bold text-gray-600 flex-1">{item}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        );
                    })}
                  </div>
                )}
              </div>
            );
          };

          const renderDetail = () => {
            if (!selectedRecipe) return null;
            const r = selectedRecipe;
            const recipeTip = getRecipeTip(r.ingredients);

            return (
              <div className="animate-fadeIn space-y-6 pb-32">
                <button onClick={()=>{setSelectedRecipe(null); setCurrentTab('carnet');}} className="text-gray-500 font-bold flex items-center gap-2 transition hover:text-gray-800 bg-white/80 px-4 py-2 rounded-full shadow-sm w-fit backdrop-blur-md border border-gray-100">
                    <i className="fa-solid fa-arrow-left"></i> Retour
                </button>
                
                <div className="relative">
                    <img src={r.image} onError={(e)=>e.target.src=FALLBACK_IMAGE} className="w-full h-72 object-cover rounded-[3rem] shadow-xl" alt={r.title} />
                    <div className="absolute bottom-4 right-4 bg-white/90 backdrop-blur-md px-4 py-2 rounded-2xl shadow-lg">
                        <span className="text-xs font-black text-gray-800">⏱ {r.time}</span>
                    </div>
                </div>

                <h1 className="text-3xl font-black text-gray-800 leading-tight px-2">{r.title}</h1>
                
                <div className="pt-2 flex gap-3 px-2">
                    <select value={selectedDayForAgenda} onChange={(e)=>setSelectedDayForAgenda(e.target.value)} className="flex-1 p-4 rounded-2xl bg-white border border-gray-200 font-black outline-none text-sm appearance-none shadow-sm focus:border-orange-400">
                      {DAYS_OF_WEEK.map(d=><option key={d} value={d}>{d}</option>)}
                    </select>
                    <button onClick={()=>{addToAgenda(selectedDayForAgenda, r.id);}} className="bg-gray-900 text-white px-8 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg active:scale-95 transition hover:bg-black">
                        Planifier
                    </button>
                </div>

                {children.length > 1 && (
                    <div className="mx-2 bg-red-50 border border-red-100 p-4 rounded-3xl text-red-700 shadow-sm flex gap-4 items-start">
                        <i className="fa-solid fa-triangle-exclamation text-2xl text-red-400 mt-1 flex-shrink-0"></i>
                        <p className="text-xs font-medium leading-relaxed">
                            <strong className="block font-black uppercase tracking-widest mb-1">Attention aux quantités</strong>
                            Cette recette est prévue pour 2 adultes et 1 enfant. Pensez à ajuster vos quantités pour régaler toute la tribu !
                        </p>
                    </div>
                )}

                {children.length === 0 ? (
                    <div className="bg-orange-500 p-8 rounded-[2.5rem] text-white shadow-xl mt-4 relative overflow-hidden">
                        <i className="fa-solid fa-baby absolute -right-4 -bottom-4 text-7xl opacity-10"></i>
                        <h4 className="font-black text-xs uppercase mb-3 flex items-center gap-2 relative z-10"><i className="fa-solid fa-spoon"></i> Part de bébé</h4>
                        <p className="text-sm font-medium relative z-10">Ajoutez un enfant dans le profil pour voir les adaptations.</p>
                    </div>
                ) : (
                    <div className="space-y-3 mt-4">
                        {children.map((child, index) => {
                            const ageInMonths = calculateAgeInMonths(child.birthdate);
                            const babySteps = r.babyAdaptations || [];
                            let babyStepText = "Âge non renseigné.";
                            if (ageInMonths !== null) {
                                const step = babySteps.find(a => ageInMonths <= a.maxAge);
                                babyStepText = step ? step.text : (babySteps[babySteps.length - 1]?.text || "Adaptation familiale standard");
                            }
                            const bgColors = ["bg-orange-500", "bg-amber-500", "bg-rose-500"];
                            const bgColor = bgColors[index % bgColors.length];

                            return (
                                <div key={child.id} className={`${bgColor} p-6 sm:p-8 rounded-[2.5rem] text-white shadow-md relative overflow-hidden`}>
                                    <i className="fa-solid fa-spoon absolute -right-4 -bottom-4 text-7xl opacity-10"></i>
                                    <div className="flex items-center gap-3 mb-3 relative z-10 border-b border-white/20 pb-3">
                                        <div className="w-8 h-8 rounded-full overflow-hidden bg-white/20 border-2 border-white flex items-center justify-center flex-shrink-0">
                                            {child.photo ? <img src={child.photo} className="w-full h-full object-cover" /> : <i className="fa-solid fa-baby text-xs"></i>}
                                        </div>
                                        <h4 className="font-black text-xs uppercase">Part de {child.name || "Bébé"} {ageInMonths !== null ? `(${ageInMonths} mois)` : ''}</h4>
                                    </div>
                                    <p className="text-sm leading-relaxed font-medium relative z-10 whitespace-pre-line">{babyStepText}</p>
                                </div>
                            );
                        })}
                    </div>
                )}

                <div className="space-y-8 pt-6 px-2">
                  <section>
                    <h3 className="font-black text-[10px] uppercase text-gray-400 mb-4 tracking-widest border-b pb-2">Ingrédients</h3>
                    <div className="grid grid-cols-1 gap-2">
                      {r.ingredients?.map((ing, idx) => (
                        <div key={idx} className="flex items-center gap-4 text-sm text-gray-700 bg-white p-4 rounded-2xl shadow-sm border border-gray-50">
                          <span className="w-2 h-2 bg-orange-400 rounded-full flex-shrink-0"></span>
                          <span className="font-medium">{ing}</span>
                        </div>
                      ))}
                    </div>
                  </section>

                  <section>
                    <h3 className="font-black text-[10px] uppercase text-gray-400 mb-4 tracking-widest border-b pb-2">Préparation</h3>
                    <div className="space-y-6">
                      {r.adultSteps?.map((s, idx) => (
                        <div key={idx} className="flex gap-5 bg-white p-5 rounded-3xl shadow-sm border border-gray-50">
                          <span className="font-black text-3xl text-orange-100 italic leading-none">{idx+1}</span>
                          <p className="text-sm leading-relaxed text-gray-600 font-medium pt-1">{s}</p>
                        </div>
                      ))}
                    </div>

                    <div className="bg-yellow-50 p-6 rounded-[2rem] border border-yellow-100 shadow-sm relative overflow-hidden mt-6">
                        <div className="text-5xl absolute -right-3 -top-3 opacity-10 transform rotate-12">{recipeTip.icon}</div>
                        <h4 className="font-black text-yellow-800 text-[10px] uppercase tracking-widest mb-3 flex items-center gap-2 relative z-10">
                            <i className="fa-solid fa-lightbulb"></i> Astuce d'Orga
                        </h4>
                        <p className="text-sm font-medium text-yellow-900 leading-relaxed relative z-10">
                            <strong className="block mb-1 font-black">{recipeTip.title}</strong>
                            {recipeTip.text}
                        </p>
                    </div>
                  </section>
                  
                  <section className="pt-4">
                    <h3 className="font-black text-[10px] uppercase text-gray-400 mb-4 tracking-widest border-b pb-2">Les Réflexes en Cuisine</h3>
                    <div className="grid grid-cols-1 gap-4">
                        <div className="flex gap-4 bg-white p-5 rounded-3xl shadow-sm border border-gray-50 items-start">
                            <div className="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 text-xl flex-shrink-0"><i className="fa-solid fa-broom"></i></div>
                            <div className="pt-1">
                                <h4 className="font-black text-gray-800 text-sm mb-1">Nettoyez au fur et à mesure</h4>
                                <p className="text-xs text-gray-500 leading-relaxed font-medium">Vous n'avez plus besoin d'un ustensile ? Nettoyez-le et rangez-le. C'est du temps de gagné à la fin du repas !</p>
                            </div>
                        </div>
                        <div className="flex gap-4 bg-white p-5 rounded-3xl shadow-sm border border-gray-50 items-start">
                            <div className="w-12 h-12 rounded-full bg-teal-50 flex items-center justify-center text-teal-500 text-xl flex-shrink-0"><i className="fa-solid fa-snowflake"></i></div>
                            <div className="pt-1">
                                <h4 className="font-black text-gray-800 text-sm mb-1">Recyclez les restes</h4>
                                <p className="text-xs text-gray-500 leading-relaxed font-medium">Il vous reste des portions ? Congelez-les pour un futur repas où vous n'aurez pas le temps de cuisiner.</p>
                            </div>
                        </div>
                    </div>
                  </section>
                </div>
              </div>
            );
          };

          const renderProfile = () => (
            <div className="animate-fadeIn space-y-6 pb-24">
              <h1 className="text-2xl font-black text-gray-800">La Famille</h1>
              
              <div className="space-y-6 mb-8">
                  {children.map((child, index) => (
                      <div key={child.id} className="bg-white rounded-[3rem] p-8 border border-gray-100 flex flex-col items-center shadow-sm relative group">
                          <button onClick={() => removeChild(child.id)} className="absolute top-6 right-6 w-8 h-8 bg-red-50 text-red-400 rounded-full flex items-center justify-center hover:bg-red-100 hover:text-red-600 transition">
                              <i className="fa-solid fa-trash-can text-xs"></i>
                          </button>

                          <div className="relative w-28 h-28 mx-auto mb-6 cursor-pointer transform hover:scale-105 transition" onClick={() => document.getElementById(`photo-${child.id}`).click()}>
                              <div className="w-full h-full rounded-full bg-orange-50 flex items-center justify-center border-4 border-white shadow-xl overflow-hidden text-orange-200">
                                  {child.photo ? <img src={child.photo} className="w-full h-full object-cover" /> : <i className="fa-solid fa-baby text-5xl"></i>}
                              </div>
                              <div className="absolute bottom-0 right-0 bg-white p-2.5 rounded-full shadow-lg text-orange-500 border border-gray-100 flex items-center justify-center">
                                  <i className="fa-solid fa-camera text-sm"></i>
                              </div>
                              <input type="file" id={`photo-${child.id}`} accept="image/*" className="hidden" onChange={(e) => handlePhotoUpload(e, child.id)} />
                          </div>

                          <div className="w-full space-y-4 text-center">
                              <div>
                                  <label className="block text-[10px] font-black uppercase text-gray-400 mb-1 tracking-widest">Prénom</label>
                                  <input type="text" value={child.name} onChange={(e) => updateChild(child.id, { name: e.target.value })} placeholder={`Enfant ${index + 1}`} className="w-full bg-gray-50 p-4 rounded-2xl text-center font-black outline-none border border-transparent focus:border-orange-200 focus:bg-white transition" />
                              </div>
                              <div>
                                  <label className="block text-[10px] font-black uppercase text-gray-400 mb-1 tracking-widest">Date de naissance</label>
                                  <input type="date" value={child.birthdate} onChange={(e) => updateChild(child.id, { birthdate: e.target.value })} className="w-full bg-gray-50 p-4 rounded-2xl text-center font-bold outline-none border border-transparent focus:border-orange-200 focus:bg-white transition" />
                              </div>
                          </div>
                      </div>
                  ))}

                  {children.length < 3 && (
                      <button onClick={addChild} className="w-full bg-orange-50 hover:bg-orange-100 text-orange-600 border-2 border-dashed border-orange-200 py-6 rounded-[2.5rem] font-black uppercase tracking-widest text-xs transition flex items-center justify-center gap-2">
                          <i className="fa-solid fa-plus"></i> Ajouter un enfant
                      </button>
                  )}
              </div>

              <div className="bg-white rounded-[2.5rem] p-8 border border-gray-100 shadow-sm mb-6 flex justify-between items-center">
                <div className="pr-4">
                  <h3 className="font-black mb-1 flex items-center gap-2 uppercase text-xs tracking-widest text-gray-800"><i className="fa-solid fa-graduation-cap text-indigo-500"></i> Coach Diversification</h3>
                  <p className="text-[10px] text-gray-500 font-medium leading-relaxed">Débloquez un onglet dédié au suivi de l'alimentation.</p>
                </div>
                <button onClick={handleCoachToggle} className={`w-12 h-6 rounded-full p-1 transition-colors duration-200 ease-in-out flex flex-shrink-0 shadow-inner ${isCoachEnabled ? 'bg-indigo-500 justify-end' : 'bg-gray-300 justify-start'}`}><div className="w-4 h-4 rounded-full bg-white shadow-sm"></div></button>
              </div>

              <div className="bg-white rounded-[2.5rem] p-8 border border-gray-100 shadow-sm mb-6 flex justify-between items-center">
                <div className="pr-4">
                  <h3 className="font-black mb-1 flex items-center gap-2 uppercase text-xs tracking-widest text-gray-800"><i className="fa-solid fa-leaf text-green-500"></i> Mode 100% Saison</h3>
                  <p className="text-[10px] text-gray-500 font-medium leading-relaxed">Mettre en avant les recettes pour la saison en cours.</p>
                </div>
                <button onClick={() => setIsSeasonalModeActive(!isSeasonalModeActive)} className={`w-12 h-6 rounded-full p-1 transition-colors duration-200 ease-in-out flex flex-shrink-0 shadow-inner ${isSeasonalModeActive ? 'bg-green-500 justify-end' : 'bg-gray-300 justify-start'}`}><div className="w-4 h-4 rounded-full bg-white shadow-sm"></div></button>
              </div>

              <div className="bg-white rounded-[2.5rem] p-8 border border-gray-100 shadow-sm relative overflow-hidden">
                <i className="fa-solid fa-cloud absolute -right-6 -bottom-6 text-8xl text-blue-50 opacity-50"></i>
                <div className="relative z-10">
                    <h3 className="font-black mb-2 flex items-center gap-2 uppercase text-xs tracking-widest text-gray-800"><i className="fa-solid fa-link text-blue-500"></i> Partage Familial</h3>
                    <p className="text-xs text-gray-500 mb-6 font-medium leading-relaxed">Entrez un code secret pour synchroniser vos données.</p>
                    <div className="flex gap-2">
                      <input type="text" value={tempFamilyCode} onChange={(e)=>setTempFamilyCode(e.target.value.toUpperCase())} placeholder="CODE SECRET" className="flex-1 bg-gray-50 p-4 rounded-2xl uppercase font-mono text-xs font-black outline-none border border-transparent focus:border-blue-200 transition" />
                      <button onClick={() => { if(!tempFamilyCode) return; setFamilyCode(tempFamilyCode); localStorage.setItem('cookidoudou_family_code', tempFamilyCode); alert("Synchronisation activée !"); }} className="bg-blue-600 text-white px-6 rounded-2xl font-black uppercase text-[10px] shadow-md active:scale-95 transition">Valider</button>
                    </div>
                    {familyCode && (
                        <div className="mt-5 inline-flex items-center gap-2 bg-green-50 px-3 py-2 rounded-xl">
                            <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> 
                            <span className="text-[10px] text-green-700 font-black uppercase tracking-widest">Connecté : {familyCode}</span>
                        </div>
                    )}
                </div>
              </div>
            </div>
          );

          const activeTypicalDayChild = children.find(c => c.id === activeModalChildId) || children[0];

          return (
            <div className="min-h-screen bg-gray-50 flex flex-col relative overflow-x-hidden">
              <main className="flex-1 max-w-2xl mx-auto w-full p-6 pt-10 overflow-y-auto">
                {currentTab === 'home' && renderHome()}
                {currentTab === 'carnet' && renderCarnet()}
                {currentTab === 'coach' && isCoachEnabled && renderCoach()}
                {currentTab === 'shopping' && renderShopping()}
                {currentTab === 'profile' && renderProfile()}
                {currentTab === 'recipe_detail' && renderDetail()}
              </main>

              {/* FENÊTRE MODALE GÉNÉRATEUR MAGIQUE */}
              {showGeneratorModal && (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4 sm:p-6 animate-fadeIn">
                    <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="bg-gradient-to-r from-orange-400 to-rose-400 p-6 text-white relative flex-shrink-0">
                            <button onClick={() => setShowGeneratorModal(false)} className="absolute top-6 right-6 w-8 h-8 bg-black/10 rounded-full flex items-center justify-center hover:bg-black/20 transition"><i className="fa-solid fa-xmark"></i></button>
                            <h2 className="text-2xl font-black mb-1 flex items-center gap-2"><i className="fa-solid fa-wand-magic-sparkles"></i> Inspiration</h2>
                            <p className="text-orange-50 text-sm font-medium">Paramétrez la génération de votre menu.</p>
                        </div>
                        
                        <div className="p-6 overflow-y-auto space-y-6 bg-gray-50 flex-1 hide-scrollbar">
                            <div>
                                <label className="block text-[10px] font-black uppercase text-gray-400 mb-2 tracking-widest">Repas par jour (Semaine)</label>
                                <div className="flex gap-2">
                                    {[1, 2].map(num => (
                                        <button key={num} onClick={() => setGenConfig({...genConfig, weekdayMeals: num})} className={`flex-1 py-3 rounded-2xl font-black text-sm transition ${genConfig.weekdayMeals === num ? 'bg-orange-500 text-white shadow-md' : 'bg-white text-gray-500 border border-gray-200 hover:bg-gray-50'}`}>{num} repas</button>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <label className="block text-[10px] font-black uppercase text-gray-400 mb-2 tracking-widest">Repas par jour (Week-end)</label>
                                <div className="flex gap-2">
                                    {[1, 2, 3].map(num => (
                                        <button key={num} onClick={() => setGenConfig({...genConfig, weekendMeals: num})} className={`flex-1 py-3 rounded-2xl font-black text-sm transition ${genConfig.weekendMeals === num ? 'bg-orange-500 text-white shadow-md' : 'bg-white text-gray-500 border border-gray-200 hover:bg-gray-50'}`}>{num} repas</button>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <label className="block text-[10px] font-black uppercase text-gray-400 mb-2 tracking-widest">Structure du repas</label>
                                <div className="flex flex-col gap-2">
                                    {['Plat', 'Entrée + Plat', 'Plat + Dessert', 'Entrée + Plat + Dessert'].map(struct => (
                                        <button key={struct} onClick={() => setGenConfig({...genConfig, structure: struct})} className={`w-full py-3 rounded-2xl font-black text-sm transition ${genConfig.structure === struct ? 'bg-rose-400 text-white shadow-md' : 'bg-white text-gray-500 border border-gray-200 hover:bg-gray-50'}`}>{struct}</button>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="bg-orange-50 p-4 rounded-2xl border border-orange-100">
                                <p className="text-xs text-orange-800 font-medium leading-relaxed">
                                    <i className="fa-solid fa-triangle-exclamation mr-1"></i> <strong>Attention :</strong> Générer un nouveau menu écrasera votre planning actuel de la semaine.
                                </p>
                            </div>
                        </div>
                        
                        <div className="p-6 bg-white border-t border-gray-100 flex-shrink-0">
                            <button onClick={generateWeeklyMenu} className="w-full bg-gray-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs active:scale-95 transition flex items-center justify-center gap-2">
                                <i className="fa-solid fa-wand-magic-sparkles"></i> Générer mon menu
                            </button>
                        </div>
                    </div>
                </div>
              )}

              {/* FENÊTRE MODALE ONBOARDING */}
              {showOnboardingModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4 sm:p-6 animate-fadeIn">
                    <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl p-8 text-center relative overflow-hidden">
                        <div className="w-24 h-24 bg-orange-50 rounded-full flex items-center justify-center mx-auto mb-6 text-orange-400"><i className="fa-solid fa-spoon text-5xl"></i></div>
                        <h2 className="text-2xl font-black text-gray-800 mb-3">Bienvenue dans Cookidoudou !</h2>
                        <p className="text-sm text-gray-600 font-medium leading-relaxed mb-8">L'application pour nourrir toute la famille simplement. Trouvez des idées de saison, planifiez vos menus et organisez vos courses en un clin d'œil !</p>
                        <button onClick={closeOnboarding} className="w-full bg-orange-500 hover:bg-orange-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs active:scale-95 transition">C'est parti !</button>
                    </div>
                </div>
              )}

              {/* FENÊTRE MODALE CONSENTEMENT MÉDICAL */}
              {showMedicalConsentModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-gray-900/60 backdrop-blur-md p-4 sm:p-6 animate-fadeIn">
                    <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden">
                        <div className="bg-red-50 p-8 text-center border-b border-red-100">
                            <i className="fa-solid fa-stethoscope text-4xl text-red-400 mb-4"></i>
                            <h2 className="text-xl font-black text-red-900 mb-2">Avertissement Médical</h2>
                            <p className="text-xs text-red-700 font-bold uppercase tracking-widest">À lire attentivement</p>
                        </div>
                        <div className="p-8">
                            <p className="text-sm text-gray-600 font-medium leading-relaxed mb-6 text-center">
                                Cookidoudou est un outil d'accompagnement culinaire. Les informations du Coach Diversification sont données à titre indicatif. <br/><br/>
