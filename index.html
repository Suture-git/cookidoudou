                                <strong className="text-gray-800">Elles ne remplacent en aucun cas une consultation chez un médecin généraliste ou un pédiatre</strong>, particulièrement en cas de trouble alimentaire, de retard de croissance ou de suspicion d'allergie.
                            </p>
                            <div className="space-y-3">
                                <button onClick={acceptMedicalConsent} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs active:scale-95 transition shadow-md">J'ai compris et j'accepte</button>
                                <button onClick={() => setShowMedicalConsentModal(false)} className="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 py-4 rounded-2xl font-black uppercase tracking-widest text-xs active:scale-95 transition">Annuler</button>
                            </div>
                        </div>
                    </div>
                </div>
              )}

              {/* FENÊTRE MODALE JOURNÉE TYPE */}
              {showTypicalDayModal && activeTypicalDayChild && (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4 sm:p-6 animate-fadeIn">
                    <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="bg-blue-500 pt-6 px-6 pb-4 text-white relative flex-shrink-0">
                            <button onClick={() => setShowTypicalDayModal(false)} className="absolute top-6 right-6 w-8 h-8 bg-black/20 rounded-full flex items-center justify-center hover:bg-black/30 transition z-10"><i className="fa-solid fa-xmark"></i></button>
                            {children.length > 1 && (
                                <div className="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pr-10">
                                    {children.map(child => (
                                        <button key={child.id} onClick={() => setActiveModalChildId(child.id)} className={`px-4 py-2 rounded-2xl font-black text-xs transition whitespace-nowrap flex items-center gap-2 ${activeModalChildId === child.id ? 'bg-white text-blue-600 shadow-md' : 'bg-blue-600/50 text-blue-100 hover:bg-blue-600'}`}>
                                            {child.photo ? <img src={child.photo} className="w-4 h-4 rounded-full object-cover" /> : <i className="fa-solid fa-baby"></i>} {child.name || "Bébé"}
                                        </button>
                                    ))}
                                </div>
                            )}
                            {(() => {
                                const ageInMonths = calculateAgeInMonths(activeTypicalDayChild.birthdate);
                                const typicalDayData = getTypicalDayForAge(ageInMonths);
                                return (
                                    <>
                                        <h2 className="text-2xl font-black mb-1">{typicalDayData ? typicalDayData.title : 'Âge inconnu'}</h2>
                                        <p className="text-blue-100 text-sm font-medium">{typicalDayData ? typicalDayData.subtitle : 'Veuillez renseigner une date de naissance.'}</p>
                                    </>
                                );
                            })()}
                        </div>
                        <div className="p-6 overflow-y-auto space-y-4 bg-gray-50 flex-1 hide-scrollbar">
                            {(() => {
                                const ageInMonths = calculateAgeInMonths(activeTypicalDayChild.birthdate);
                                const typicalDayData = getTypicalDayForAge(ageInMonths);
                                if (!typicalDayData) return <p className="text-center py-10 text-gray-500 font-medium">Information indisponible.</p>;
                                return typicalDayData.meals.map((meal, idx) => (
                                    <div key={idx} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                                        <h4 className="font-black text-gray-800 flex items-center gap-2 mb-3"><span className="text-xl">{meal.icon}</span> {meal.name}</h4>
                                        <p className="text-sm text-gray-600 font-medium leading-relaxed whitespace-pre-line pl-8 border-l-2 border-blue-100">{meal.text}</p>
                                        {(meal.name === "Déjeuner" || meal.name === "Dîner" || meal.name === "Midi" || meal.name === "Soir") && ageInMonths >= 6 && (
                                            <button onClick={() => { setShowTypicalDayModal(false); setCurrentTab('carnet'); }} className="mt-4 ml-8 text-[10px] font-black text-blue-500 uppercase tracking-widest bg-blue-50 px-3 py-1.5 rounded-xl hover:bg-blue-100 transition">Trouver une recette <i className="fa-solid fa-arrow-right ml-1"></i></button>
                                        )}
                                    </div>
                                ));
                            })()}
                        </div>
                        <div className="p-6 bg-white border-t border-gray-100 flex-shrink-0">
                            <button onClick={() => setShowTypicalDayModal(false)} className="w-full bg-gray-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs active:scale-95 transition">J'ai compris</button>
                        </div>
                    </div>
                </div>
              )}

              {/* FENÊTRE MODALE BOÎTE À ASTUCES GLOBALES */}
              {showTipsModal && (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4 sm:p-6 animate-fadeIn">
                    <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="bg-yellow-400 p-6 text-yellow-900 relative flex-shrink-0">
                            <button onClick={() => setShowTipsModal(false)} className="absolute top-6 right-6 w-8 h-8 bg-black/10 rounded-full flex items-center justify-center hover:bg-black/20 transition text-yellow-900"><i className="fa-solid fa-xmark"></i></button>
                            <h2 className="text-2xl font-black mb-1 flex items-center gap-2"><i className="fa-solid fa-lightbulb"></i> Boîte à Astuces</h2>
                            <p className="text-yellow-800 text-sm font-medium">L'organisation est le maître mot pour gagner du temps en cuisine.</p>
                        </div>
                        <div className="p-6 overflow-y-auto space-y-4 bg-gray-50 flex-1 hide-scrollbar">
                            {GENERAL_TIPS.map((tip, idx) => (
                                <div key={idx} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex gap-4 items-start">
                                    <div className="text-3xl flex-shrink-0">{tip.icon}</div>
                                    <div>
                                        <h4 className="font-black text-gray-800 mb-1">{tip.title}</h4>
                                        <p className="text-sm text-gray-600 font-medium leading-relaxed">{tip.text}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="p-6 bg-white border-t border-gray-100 flex-shrink-0">
                            <button onClick={() => setShowTipsModal(false)} className="w-full bg-gray-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs active:scale-95 transition">C'est noté !</button>
                        </div>
                    </div>
                </div>
              )}

              {/* Barre de navigation */}
              <nav className="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-xl border-t border-gray-100 flex justify-around py-4 px-2 z-50 pb-safe shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                {[
                  { id: 'home', icon: 'fa-house', label: 'Accueil' },
                  { id: 'carnet', icon: 'fa-book-open', label: 'Recettes' },
                  ...(isCoachEnabled ? [{ id: 'coach', icon: 'fa-graduation-cap', label: 'Coach' }] : []),
                  { id: 'shopping', icon: 'fa-cart-shopping', label: 'Courses' },
                  { id: 'profile', icon: 'fa-user', label: 'Profil' }
                ].map(t => (
                  <button key={t.id} onClick={() => { setCurrentTab(t.id); setSelectedRecipe(null); }} className={`flex flex-col items-center gap-1.5 relative w-16 ${currentTab === t.id || (t.id === 'carnet' && currentTab === 'recipe_detail') ? 'text-orange-500' : 'text-gray-400 hover:text-gray-600'} transition-colors duration-200`}>
                    <div className={`transition-transform duration-300 ${currentTab === t.id || (t.id === 'carnet' && currentTab === 'recipe_detail') ? '-translate-y-1 scale-110' : ''}`}>
                        <i className={`fa-solid ${t.icon} text-xl`}></i>
                    </div>
                    <span className={`text-[9px] font-black uppercase tracking-widest transition-opacity duration-300 ${currentTab === t.id || (t.id === 'carnet' && currentTab === 'recipe_detail') ? 'opacity-100' : 'opacity-70'}`}>{t.label}</span>
                    {(currentTab === t.id || (t.id === 'carnet' && currentTab === 'recipe_detail')) && (
                        <span className="absolute -bottom-2 w-1 h-1 bg-orange-500 rounded-full"></span>
                    )}
                  </button>
                ))}
              </nav>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
