        // ============================================================================

        function calculateAgeInMonths(birthdate) {
            if (!birthdate) return null;
            try { const diff = Math.abs(new Date() - new Date(birthdate)); return Math.floor(Math.ceil(diff / (1000 * 60 * 60 * 24)) / 30.44); } catch(e) { return null; }
        }

        function getCurrentActiveSeasons() {
            const month = new Date().getMonth();
            const activeIds = [];
            if ([10, 11, 0, 1, 2].includes(month)) activeIds.push('hiver');
            if ([1, 2, 3, 4, 5].includes(month)) activeIds.push('printemps');
            if ([4, 5, 6, 7, 8].includes(month)) activeIds.push('ete');
            if ([7, 8, 9, 10, 11].includes(month)) activeIds.push('automne');
            return activeIds.map(id => SEASONS_DATA[id]);
        }

        function getRecipeDominantSeasons(ingredientsArray) {
          if (!ingredientsArray || ingredientsArray.length === 0) return [];
          const text = ingredientsArray.join(' ').toLowerCase();
          const scores = { printemps: 0, ete: 0, automne: 0, hiver: 0 };
          Object.keys(SEASONAL_INGREDIENTS).forEach(season => { SEASONAL_INGREDIENTS[season].forEach(ing => { if (text.includes(ing)) scores[season]++; }); });
          let maxScore = 0;
          Object.values(scores).forEach(score => { if (score > maxScore) maxScore = score; });
          return maxScore === 0 ? [] : Object.keys(scores).filter(season => scores[season] === maxScore);
        }

        function getMatchingActiveSeasons(ingredientsArray, activeSeasons) {
          const dominantSeasonsIds = getRecipeDominantSeasons(ingredientsArray);
          return activeSeasons.filter(activeSeason => dominantSeasonsIds.includes(activeSeason.id));
        }

        function categorizeIngredient(displayStr) {
            if (!displayStr) return 'autres';
            const lower = displayStr.toLowerCase();
            const ingredientPart = lower.split(' : ')[0] || lower;
            for (const cat of SHOPPING_CATEGORIES) { if (cat.keywords.some(kw => ingredientPart.includes(kw))) return cat.id; }
            return 'autres';
        }

        function getCategoryForTested(ing) {
            const lower = ing.toLowerCase();
            for (const [allergen, words] of Object.entries(ALLERGEN_MAP)) { if (words.some(w => lower.includes(w))) return 'Aliments prioritaires *'; }
            const cat = categorizeIngredient(ing);
            if (cat === 'fruits' || cat === 'legumes') return 'Fruits & Légumes';
            if (cat === 'viande') return 'Viandes & Protéines';
            return 'Autres';
        }

        function getGrammaticallyCorrectPlural(root) {
            if (PLURALS_DICT[root]) return PLURALS_DICT[root];
            if (root.endsWith('s') || root.endsWith('x') || root.endsWith('z')) return root;
            return root + 's';
        }

        function parseIngredientV3(rawStr) {
            const match = rawStr.toLowerCase().trim().match(/^([\d.,/]+)?\s*(?:(g|kg|ml|cl|l|c\.à\.s|c\.à\.c|cuillères?|pincées?|gousses?|tranches?|feuilles?|filets?|poignées?|bocaux|bocal|bottes?|bouquets?)(?=\s|$|d'|d’|de\b))?\s*(?:de\s+|d'|d’)?(.*)$/);
            if (!match) return { qty: 0, unit: '', name: rawStr.toLowerCase().trim(), root: rawStr.toLowerCase().trim(), variety: 'classique', raw: rawStr };
            
            let qty = 0;
            const qtyStr = match[1] || '0';
            if (qtyStr.includes('/')) {
                const parts = qtyStr.split('/');
                if (parts.length === 2 && parseFloat(parts[1]) !== 0) qty = parseFloat(parts[0]) / parseFloat(parts[1]);
            } else {
                qty = parseFloat(qtyStr.replace(',', '.'));
            }
            
            let unit = (match[2] || '').trim();
            if (unit.startsWith('cuillère')) unit = 'cuillère';
            if (unit.startsWith('pincée')) unit = 'pincée';
            if (unit.startsWith('gousse')) unit = 'gousse';
            if (unit.startsWith('tranche')) unit = 'tranche';
            if (unit.startsWith('feuille')) unit = 'feuille';
            if (unit.startsWith('filet')) unit = 'filet';
            if (unit.startsWith('poignée')) unit = 'poignée';
            if (unit.startsWith('botte')) unit = 'botte';
            if (unit.startsWith('bouquet')) unit = 'bouquet';
            if (unit === 'bocaux') unit = 'bocal';

            let name = (match[3] || rawStr).trim().replace(/^(les|des|du|de la|un|une)\s+/, '');
            
            let root = name;
            let variety = 'classique';

            for (const rr of ROOT_REGEXES) {
                const regexMatch = name.match(rr.regex);
                if (regexMatch) {
                    root = rr.root;
                    let vRaw = name.substring(regexMatch[0].length).trim();
                    vRaw = vRaw.replace(/^(de |d'|des |aux |en )/, '').trim();
                    if (vRaw === 's' || vRaw === 'x') vRaw = '';
                    if (vRaw) variety = vRaw;
                    break;
                }
            }

            if (root === name && root.endsWith('s') && !['pois', 'radis', 'frais', 'épices'].includes(root)) {
                root = root.slice(0, -1);
            }

            return { qty, unit, name, root, variety, raw: rawStr };
        }

        function aggregateShoppingListV3(rawList) {
            const aggregated = {};
            
            rawList.forEach(rawStr => {
                const parsed = parseIngredientV3(rawStr);
                let baseUnit = parsed.unit;
                let baseQty = parsed.qty;
                
                let avgWeight = AVERAGE_WEIGHTS[parsed.root] || AVERAGE_WEIGHTS[baseUnit];
                
                if (['kg', 'l', 'L', 'cl', 'ml', 'c.à.s', 'c.à.c', 'cuillère', 'pincée'].includes(baseUnit)) {
                    if (baseUnit === 'kg') { baseUnit = 'g'; baseQty *= 1000; }
                    else if (baseUnit === 'l' || baseUnit === 'L') { baseUnit = 'ml'; baseQty *= 1000; }
                    else if (baseUnit === 'cl') { baseUnit = 'ml'; baseQty *= 10; }
                } else {
                    if (avgWeight && baseQty > 0) {
                        baseQty = baseQty * avgWeight;
                        baseUnit = 'g';
                    }
                }
                
                const root = parsed.root;
                if (!aggregated[root]) aggregated[root] = {};
                if (!aggregated[root][baseUnit]) {
                    aggregated[root][baseUnit] = { varieties: {}, rawItems: [] };
                }
                
                const varKey = parsed.variety;
                aggregated[root][baseUnit].varieties[varKey] = (aggregated[root][baseUnit].varieties[varKey] || 0) + baseQty;
                aggregated[root][baseUnit].rawItems.push(rawStr);
            });
            
            const result = [];
            Object.keys(aggregated).forEach(root => {
                Object.keys(aggregated[root]).forEach(unit => {
                    const data = aggregated[root][unit];
                    const varKeys = Object.keys(data.varieties);
                    const totalQty = varKeys.reduce((sum, k) => sum + data.varieties[k], 0); 
                    
                    let displayQty = totalQty;
                    let displayUnit = unit;
                    
                    if (unit === 'g' && totalQty >= 1000) { displayQty = totalQty / 1000; displayUnit = 'kg'; }
                    if (unit === 'ml' && totalQty >= 1000) { displayQty = totalQty / 1000; displayUnit = 'L'; }
                    
                    let isPlural = false;
                    let avg = AVERAGE_WEIGHTS[root] || 50; 
                    if (unit === 'g') {
                        if (totalQty > avg) isPlural = true;
                    } else if (unit === 'ml') {
                        isPlural = false;
                    } else {
                        if (totalQty > 1) isPlural = true;
                    }
                    
                    let displayName = isPlural ? getGrammaticallyCorrectPlural(root) : root;
                    
                    let varietyDetails = "";
                    if (varKeys.length === 1 && varKeys[0] !== 'classique') {
                        let vName = varKeys[0];
                        if (isPlural && !vName.endsWith('s') && !vName.endsWith('x')) vName += 's';
                        displayName = `${displayName} ${vName}`;
                    } else if (varKeys.length > 1) {
                        const details = varKeys.map(vk => {
                            let vQty = data.varieties[vk]; 
                            
                            if (displayUnit === 'kg') vQty /= 1000;
                            if (displayUnit === 'L') vQty /= 1000;
                            
                            const qStr = Number.isInteger(vQty) ? vQty : parseFloat(vQty.toFixed(2));
                            const qStrFr = qStr.toString().replace('.', ',');
                            
                            let vkName = vk;
                            let baseVQty = data.varieties[vk]; 
                            let isVarPlural = (unit === 'g' && baseVQty > avg) || (unit !== 'g' && baseVQty > 1);
                            
                            if (vk === 'classique') {
                                vkName = isVarPlural ? 'classiques' : 'classique';
                            } else {
                                if (isVarPlural && !vk.endsWith('s') && !vk.endsWith('x')) vkName += 's';
                            }
                            
                            let vUnitStr = displayUnit ? displayUnit + " " : "";
                            
                            return `${qStrFr} ${vUnitStr}${vkName}`.trim();
                        }).join(', ');
                        varietyDetails = ` (${details})`;
                    }
                    
                    let qtyStr = "";
                    if (displayQty > 0) {
                        let finalQty = Number.isInteger(displayQty) ? displayQty : parseFloat(displayQty.toFixed(2));
                        let formattedQty = finalQty.toString().replace('.', ',');
                        
                        let finalUnit = displayUnit;
                        if (['cuillère', 'pincée', 'gousse', 'tranche', 'feuille', 'filet', 'poignée', 'bocal', 'botte', 'bouquet'].includes(finalUnit)) {
                            finalUnit = displayQty > 1 ? (finalUnit === 'bocal' ? 'bocaux' : finalUnit + 's') : finalUnit;
                        }
                        
                        let equivalentStr = "";
                        if (AVERAGE_WEIGHTS[root] && unit === 'g') {
                            let pieces = Math.round(totalQty / AVERAGE_WEIGHTS[root]);
                            if (pieces > 0 && (AVERAGE_WEIGHTS[root] >= 15 || root === 'ail')) {
                                equivalentStr = ` (~ ${pieces} pièce${pieces > 1 ? 's' : ''})`;
                            }
                        }
                        
                        if (['g', 'kg', 'ml', 'L'].includes(finalUnit)) {
                            qtyStr = formattedQty + " " + finalUnit + equivalentStr;
                        } else if (finalUnit) {
                            qtyStr = formattedQty + " " + finalUnit;
                        } else {
                            qtyStr = formattedQty + equivalentStr;
                        }
                    }
                    
                    let finalLabel = displayName.charAt(0).toUpperCase() + displayName.slice(1) + varietyDetails;
                    if (qtyStr) finalLabel += " : " + qtyStr;
                    result.push({ displayStr: finalLabel, rawItems: data.rawItems });
                });
            });
            return result;
        }

            if (ageInMonths < 6) return { texture: "Lisse", prot: "5g", fat: "1 c.à.c", text: <>L'introduction des aliments autres que le lait ne doit jamais se faire avant 4 mois révolus.<sup>3</sup> Introduisez toutes les familles d'aliments, y compris ceux qui peuvent provoquer une allergie (œufs, arachides...) et le gluten.<sup>3</sup> Ajoutez de la matière grasse.<sup>2</sup></>, textureReason: <>Proposez tous les aliments en purée ou en compote lisses pour que le bébé les avale sans risque.<sup>2</sup></> };
            if (ageInMonths < 8) return { texture: "Écrasé", prot: "10g", fat: "1 c.à.c", text: <>Tous les aliments hachés ou écrasés grossièrement à la fourchette.<sup>2</sup></>, textureReason: <>À partir de 6/8 mois, c'est important de proposer progressivement de nouvelles textures à votre enfant. Il va ainsi pouvoir développer ses capacités à bien mâcher.<sup>2,3</sup></> };
            if (ageInMonths <= 12) return { texture: "Morceaux", prot: "20g", fat: "1 c.à.c", text: <>Les aliments protéiques (viandes, poissons, oeufs) ne devraient être proposés qu'une fois par jour et en quantité adaptée (exemple, 5 g à 6 mois, 20 g à 12 mois).<sup>3</sup></>, textureReason: <>Aliments en morceaux très mous qui s'écrasent entre la langue et le palais puis à croquer dès 10 mois.<sup>2</sup> Proposer un quignon de pain de temps en temps au repas permet de stimuler la mastication et de fortifier la mâchoire.<sup>3</sup></> };
            return { texture: "Familiale", prot: "20-30g", fat: "1-2 c.à.c", text: <>L'enfant passe progressivement d'une alimentation infantile spécifique, adaptée à son âge, à l'alimentation familiale. 3 repas par jour + 1 goûter (et 1 seul).<sup>1,3</sup></>, textureReason: <>Votre enfant mange presque comme les grands, en quantités adaptées à son âge.<sup>2</sup></> };
        }

                </div>
              )}

              {showTypicalDayModal && activeModalChildId && (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4 animate-fadeIn">
                    <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="bg-blue-500 pt-6 px-6 pb-4 text-white">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex gap-2 overflow-x-auto hide-scrollbar">
                                    {children.map(c => <button key={c.id} onClick={()=>setActiveModalChildId(c.id)} className={`px-4 py-2 rounded-2xl text-[10px] font-black transition whitespace-nowrap ${activeModalChildId===c.id?'bg-white text-blue-500':'bg-blue-600 text-blue-100'}`}>{c.name||"Bébé"}</button>)}
                                </div>
                                <button onClick={()=>setShowTypicalDayModal(false)}><i className="fa-solid fa-xmark"></i></button>
                            </div>
                            {(() => { const activeChild = children.find(c => c.id === activeModalChildId); const age = calculateAgeInMonths(activeChild?.birthdate); const td = getTypicalDayForAge(age); return <><h2 className="text-2xl font-black">{td?.title||"Âge inconnu"}</h2><p className="text-blue-100 text-sm font-medium">{td?.subtitle}</p></>; })()}
                        </div>
                        <div className="p-6 overflow-y-auto space-y-4 bg-gray-50 flex-1 hide-scrollbar">
                            {(() => { const activeChild = children.find(c => c.id === activeModalChildId); const age = calculateAgeInMonths(activeChild?.birthdate); const td = getTypicalDayForAge(age); return td?.meals.map((m, i) => (
                                <div key={i} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                                    <h4 className="font-black text-gray-800 flex items-center gap-2 mb-2"><span className="text-xl">{m.icon}</span> {m.name}</h4>
                                    <p className="text-sm text-gray-600 pl-8 border-l-2 border-blue-100 whitespace-pre-line font-medium">{m.text}</p>
                                </div>
                            )); })()}
                        </div>
                        <div className="p-6 bg-white border-t border-gray-100"><button onClick={()=>setShowTypicalDayModal(false)} className="w-full bg-gray-900 text-white py-4 rounded-2xl font-black uppercase text-xs active:scale-95 transition">Fermer</button></div>
                    </div>
                </div>
              )}

              {showOnboardingModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-gray-900/40 p-4 backdrop-blur-sm">
                    <div className="bg-white w-full max-w-md rounded-[3rem] p-8 text-center shadow-2xl overflow-hidden relative">
                        <div className="w-20 h-20 bg-orange-50 rounded-full flex items-center justify-center mx-auto mb-6 text-orange-400 text-4xl shadow-inner"><i className="fa-solid fa-spoon"></i></div>
                        <h2 className="text-2xl font-black mb-2 text-gray-800 tracking-tight">Bienvenue !</h2>
                        <p className="text-sm text-gray-600 mb-8 font-medium leading-relaxed">Nourrir toute la famille simplement et de saison.</p>
                        <button onClick={handleCloseOnboarding} className="w-full bg-orange-500 text-white py-4 rounded-2xl font-black uppercase text-xs active:scale-95 transition">Commencer</button>
                    </div>
                </div>
              )}

              {showMedicalConsentModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-gray-900/60 p-4 backdrop-blur-md animate-fadeIn">
                    <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden">
                        <div className="bg-red-50 p-8 text-center border-b border-red-100"><i className="fa-solid fa-stethoscope text-4xl text-red-400 mb-4"></i><h2 className="text-xl font-black text-red-900 tracking-tight">Avertissement</h2></div>
                        <div className="p-8 text-sm text-gray-600 space-y-4 text-center"><p>Les conseils du Coach sont donnés à titre indicatif.</p><button onClick={handleAcceptMedicalConsent} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-xs shadow-md active:scale-95 transition">J'ai compris</button></div>
                    </div>
                </div>
              )}

              {showTipsModal && (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-gray-900/40 p-4 animate-fadeIn">
                    <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
                        <div className="bg-yellow-400 p-6 text-yellow-900 flex justify-between items-center relative"><h2 className="text-2xl font-black">Astuces</h2><button onClick={()=>setShowTipsModal(false)}><i className="fa-solid fa-xmark"></i></button></div>
                        <div className="p-6 overflow-y-auto space-y-4 flex-1 hide-scrollbar bg-gray-50">
                            {GENERAL_TIPS.map((t, i) => <div key={i} className="flex gap-4 items-start bg-white p-5 rounded-3xl shadow-sm border border-gray-100 font-medium text-gray-600"><span className="text-3xl">{t.icon}</span><div><h4 className="font-black text-gray-800 text-sm mb-1">{t.title}</h4><p className="text-xs">{t.text}</p></div></div>)}
                        </div>
                    </div>
                </div>
              )}

              <nav className="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-xl border-t border-gray-100 flex justify-around py-4 px-2 z-50 pb-safe shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                {[
                  { id: 'home', icon: 'fa-house', label: 'Accueil' },
                  { id: 'carnet', icon: 'fa-book-open', label: 'Recettes' },
                  ...(isCoachEnabled ? [{ id: 'coach', icon: 'fa-graduation-cap', label: 'Coach' }] : []),
                  { id: 'shopping', icon: 'fa-cart-shopping', label: 'Courses' },
                  { id: 'profile', icon: 'fa-user', label: 'Profil' }
                ].map(t => {
                  const isActive = currentTab === t.id || (t.id === 'carnet' && currentTab === 'recipe_detail');
                  return (
                    <button key={t.id} onClick={() => { setCurrentTab(t.id); setSelectedRecipe(null); }} className={`flex flex-col items-center gap-1.5 w-16 transition-all duration-300 ${isActive ? 'text-orange-500' : 'text-gray-400 hover:text-gray-600'}`}>
                      <div className={`transition-transform duration-300 ${isActive ? '-translate-y-1 scale-110' : ''}`}><i className={`fa-solid ${t.icon} text-xl`}></i></div>
                      <span className={`text-[9px] font-black uppercase tracking-widest transition-opacity ${isActive ? 'opacity-100' : 'opacity-60'}`}>{t.label}</span>
                    </button>
                  );
                })}
              </nav>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
