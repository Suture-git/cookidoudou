        // --- FONCTIONS UTILITAIRES ---
        function calculateAgeInMonths(birthdate) {
            if (!birthdate) return null;
            try {
                const diffTime = Math.abs(new Date() - new Date(birthdate));
                return Math.floor(Math.ceil(diffTime / (1000 * 60 * 60 * 24)) / 30.44); 
            } catch(e) { return null; }
        }

        function getCurrentActiveSeasons() {
            const month = new Date().getMonth();
            const activeIds = [];
            if ([10, 11, 0, 1, 2].includes(month)) activeIds.push('hiver');
            if ([1, 2, 3, 4, 5].includes(month)) activeIds.push('printemps');
            if ([4, 5, 6, 7, 8].includes(month)) activeIds.push('ete');
            if ([7, 8, 9, 10, 11].includes(month)) activeIds.push('automne');
            return activeIds.map(id => SEASONS_DATA[id]);
        }

        function getRecipeDominantSeasons(ingredientsArray) {
          if (!ingredientsArray || ingredientsArray.length === 0) return [];
          const text = ingredientsArray.join(' ').toLowerCase();
          const scores = { printemps: 0, ete: 0, automne: 0, hiver: 0 };
          Object.keys(SEASONAL_INGREDIENTS).forEach(season => {
              SEASONAL_INGREDIENTS[season].forEach(ing => {
                  if (text.includes(ing)) scores[season]++;
              });
          });
          let maxScore = 0;
          Object.values(scores).forEach(score => { if (score > maxScore) maxScore = score; });
          return maxScore === 0 ? [] : Object.keys(scores).filter(season => scores[season] === maxScore);
        }

        function getMatchingActiveSeasons(ingredientsArray, activeSeasons) {
          const dominantSeasonsIds = getRecipeDominantSeasons(ingredientsArray);
          return activeSeasons.filter(activeSeason => dominantSeasonsIds.includes(activeSeason.id));
        }

        function categorizeIngredient(displayStr) {
            if (!displayStr) return 'autres';
            const lower = displayStr.toLowerCase();
            const ingredientPart = lower.split(' : ')[0] || lower;
            for (const cat of SHOPPING_CATEGORIES) {
                if (cat.keywords.some(kw => ingredientPart.includes(kw))) return cat.id;
            }
            return 'autres';
        }

        // Fonction pour catégoriser dans le carnet du Coach
        function getCategoryForTested(ing) {
            const lower = ing.toLowerCase();
            for (const [allergen, words] of Object.entries(ALLERGEN_MAP)) {
                if (words.some(w => lower.includes(w))) return 'Aliments prioritaires *';
            }
            const cat = categorizeIngredient(ing);
            if (cat === 'fruits' || cat === 'legumes') return 'Fruits & Légumes';
            if (cat === 'viande') return 'Viandes & Protéines';
            return 'Autres';
        }

        function parseIngredient(rawStr) {
            const match = rawStr.toLowerCase().trim().match(/^([\d.,/]+)?\s*(?:(g|kg|ml|cl|l|c\.à\.s|c\.à\.c|cuillères?|pincées?|gousses?|tranches?|feuilles?|filets?|poignées?|bocaux|bocal|bottes?|bouquets?)(?=\s|$|d'|d’|de\b))?\s*(?:de\s+|d'|d’)?(.*)$/);
            if (!match) return { qty: 0, unit: '', name: rawStr.toLowerCase().trim(), root: rawStr.toLowerCase().trim(), variety: '', raw: rawStr };
            
            let qty = 0;
            const qtyStr = match[1] || '0';
            if (qtyStr.includes('/')) {
                const parts = qtyStr.split('/');
                if (parts.length === 2 && parseFloat(parts[1]) !== 0) qty = parseFloat(parts[0]) / parseFloat(parts[1]);
            } else {
                qty = parseFloat(qtyStr.replace(',', '.'));
            }
            
            let unit = (match[2] || '').trim();
            if (unit.startsWith('cuillère')) unit = 'cuillère';
            if (unit.startsWith('pincée')) unit = 'pincée';
            if (unit.startsWith('gousse')) unit = 'gousse';
            if (unit.startsWith('tranche')) unit = 'tranche';
            if (unit.startsWith('feuille')) unit = 'feuille';
            if (unit.startsWith('filet')) unit = 'filet';
            if (unit.startsWith('poignée')) unit = 'poignée';
            if (unit.startsWith('botte')) unit = 'botte';
            if (unit.startsWith('bouquet')) unit = 'bouquet';
            if (unit === 'bocaux') unit = 'bocal';

            let name = (match[3] || rawStr).trim().replace(/^(les|des|du|de la|un|une)\s+/, '');
            
            let normalizedName = name;
            if (normalizedName.endsWith('s') && !['pois', 'radis', 'frais', 'épices'].includes(normalizedName)) {
                normalizedName = normalizedName.replace(/s$/, '');
            }

            let root = normalizedName;
            let variety = 'classique';
            for (const r of ROOTS) {
                if (normalizedName.startsWith(r)) {
                    root = r;
                    const vRaw = normalizedName.substring(r.length).trim().replace(/^(de |d'|des |aux |en )/, '').trim();
                    if (vRaw && vRaw !== 's' && vRaw !== 'x') {
                        variety = vRaw;
                    }
                    break;
                }
            }
            return { qty, unit, name: normalizedName, root, variety, raw: rawStr };
        }

        function aggregateShoppingList(rawList) {
            const aggregated = {};
            rawList.forEach(rawStr => {
                const parsed = parseIngredient(rawStr);
                let baseUnit = parsed.unit;
                let baseQty = parsed.qty;
                if (baseUnit === 'kg') { baseUnit = 'g'; baseQty *= 1000; }
                else if (baseUnit === 'l' || baseUnit === 'L') { baseUnit = 'ml'; baseQty *= 1000; }
                else if (baseUnit === 'cl') { baseUnit = 'ml'; baseQty *= 10; }
                
                const root = parsed.root;
                if (!aggregated[root]) aggregated[root] = {};
                if (!aggregated[root][baseUnit]) {
                    aggregated[root][baseUnit] = { varieties: {}, rawItems: [] };
                }
                const varKey = parsed.variety;
                aggregated[root][baseUnit].varieties[varKey] = (aggregated[root][baseUnit].varieties[varKey] || 0) + baseQty;
                aggregated[root][baseUnit].rawItems.push(rawStr);
            });
            
            const result = [];
            Object.keys(aggregated).forEach(root => {
                Object.keys(aggregated[root]).forEach(unit => {
                    const data = aggregated[root][unit];
                    const varKeys = Object.keys(data.varieties);
                    const totalQty = varKeys.reduce((sum, k) => sum + data.varieties[k], 0);
                    
                    let displayQty = totalQty;
                    let displayUnit = unit;
                    if (unit === 'g' && totalQty >= 1000) { displayQty = totalQty / 1000; displayUnit = 'kg'; }
                    if (unit === 'ml' && totalQty >= 1000) { displayQty = totalQty / 1000; displayUnit = 'L'; }
                    
                    let pluralRoot = root;
                    if (displayQty > 1 && !displayUnit) {
                        if (!pluralRoot.endsWith('s') && !pluralRoot.endsWith('x') && !pluralRoot.endsWith('z') && root !== 'chou') pluralRoot += 's';
                        else if (root === 'chou') pluralRoot = 'choux';
                    }
                    
                    let displayName = pluralRoot;
                    let varietyDetails = "";
                    if (varKeys.length === 1 && varKeys[0] !== 'classique') {
                        displayName = `${pluralRoot} ${varKeys[0]}`;
                    } else if (varKeys.length > 1) {
                        const details = varKeys.map(vk => {
                            let vQty = data.varieties[vk];
                            if (unit === 'g' && vQty >= 1000) vQty /= 1000;
                            if (unit === 'ml' && vQty >= 1000) vQty /= 1000;
                            const qStr = Number.isInteger(vQty) ? vQty : vQty.toFixed(1);
                            return vk === 'classique' ? `${qStr} classiques` : `${qStr} ${vk}`;
                        }).join(', ');
                        varietyDetails = ` (${details})`;
                    }
                    
                    let qtyStr = "";
                    if (displayQty > 0) {
                        let finalQty = Number.isInteger(displayQty) ? displayQty : displayQty.toFixed(1);
                        let finalUnit = displayUnit;
                        if (['cuillère', 'pincée', 'gousse', 'tranche', 'feuille', 'filet', 'poignée', 'bocal', 'botte', 'bouquet'].includes(finalUnit)) {
                            finalUnit = displayQty > 1 ? (finalUnit === 'bocal' ? 'bocaux' : finalUnit + 's') : finalUnit;
                        }
                        qtyStr = finalQty + (finalUnit ? " " + finalUnit : "");
                    }
                    
                    let finalLabel = displayName.charAt(0).toUpperCase() + displayName.slice(1) + varietyDetails;
                    if (qtyStr) finalLabel += " : " + qtyStr;
                    result.push({ displayStr: finalLabel, rawItems: data.rawItems });
                });
            });
            return result;
        }

        function getTypicalDayForAge(ageInMonths) {
            if (ageInMonths === null) return null;
            return TYPICAL_DAYS.find(td => ageInMonths <= td.maxAge) || TYPICAL_DAYS[TYPICAL_DAYS.length - 1];
        }

        function getCoachAdvice(ageInMonths) {
            if (ageInMonths === null) return null;
            
            if (ageInMonths < 4) return { 
                texture: "Liquide", prot: "0g", fat: "Non", 
                text: <>Le nourrisson ne doit recevoir qu'un seul type d'aliment : un lait répondant à ses besoins. Le lait de vache est totalement inadapté à cet âge.<sup>1</sup></>,
                textureReason: <>Le système digestif de votre enfant n'est prêt que pour déglutir du lait.<sup>1</sup></>
            };
            
            if (ageInMonths < 6) return { 
                texture: "Lisse", prot: "5g", fat: "1 c.à.c", 
                text: <>L'introduction des aliments autres que le lait ne doit jamais se faire avant 4 mois révolus.<sup>3</sup> Introduisez toutes les familles d'aliments, y compris ceux qui peuvent provoquer une allergie (œufs, arachides...) et le gluten.<sup>3</sup> Ajoutez de la matière grasse.<sup>2</sup></>,
                textureReason: <>Proposez tous les aliments en purée ou en compote lisses pour que le bébé les avale sans risque.<sup>2</sup></>
            };
            
            if (ageInMonths < 8) return { 
                texture: "Écrasé", prot: "10g", fat: "1 c.à.c", 
                text: <>Tous les aliments hachés ou écrasés grossièrement à la fourchette.<sup>2</sup></>,
                textureReason: <>À partir de 6/8 mois, c'est important de proposer progressivement de nouvelles textures à votre enfant. Il va ainsi pouvoir développer ses capacités à bien mâcher.<sup>2,3</sup></>
            };
            
            if (ageInMonths <= 12) return { 
                texture: "Morceaux", prot: "20g", fat: "1 c.à.c", 
                text: <>Les aliments protéiques (viandes, poissons, oeufs) ne devraient être proposés qu'une fois par jour et en quantité adaptée (exemple, 5 g à 6 mois, 20 g à 12 mois).<sup>3</sup></>,
                textureReason: <>Aliments en morceaux très mous qui s'écrasent entre la langue et le palais puis à croquer dès 10 mois.<sup>2</sup> Proposer un quignon de pain de temps en temps au repas permet de stimuler la mastication et de fortifier la mâchoire.<sup>3</sup></>
            };
            
            return { 
                texture: "Familiale", prot: "20-30g", fat: "1-2 c.à.c", 
                text: <>L'enfant passe progressivement d'une alimentation infantile spécifique, adaptée à son âge, à l'alimentation familiale. 3 repas par jour + 1 goûter (et 1 seul).<sup>1,3</sup></>,
                textureReason: <>Votre enfant mange presque comme les grands, en quantités adaptées à son âge.<sup>2</sup></>
            };
        }

        function getGoldenRules(ageInMonths) {
            if (ageInMonths === null) return [];
            const rules = [];
            
            rules.push({ icon: '🚫', text: <>La règle à tout âge est de proposer sans jamais forcer en respectant son appétit.<sup>2,3</sup></> });
            rules.push({ icon: '📺', text: <>Il est préférable d'éteindre la télé et de laisser son téléphone à distance.<sup>2</sup></> });
            
            if (ageInMonths < 36) {
                rules.push({ icon: '🧂', text: <>Jusqu'à 3 ans, ne salez pas le fait maison ou les petits pots.<sup>1,2</sup></> });
                rules.push({ icon: '🍯', text: <>Proposez des fruits tendres crus ou cuits écrasés à la fourchette, toujours sans sucre.<sup>1,2</sup></> });
            }
            return rules;
        }

        function getRecipeTip() {
            return GENERAL_TIPS[Math.floor(Math.random() * GENERAL_TIPS.length)];
        }

        // --- COMPOSANT PRINCIPAL ---
        function App() {
          const [currentTab, setCurrentTab] = useState('home');
          const [selectedRecipe, setSelectedRecipe] = useState(null);
          const [selectedDayForAgenda, setSelectedDayForAgenda] = useState(DAYS_OF_WEEK[0]);
          const todayStrGlobal = new Date().toLocaleDateString('fr-FR', { weekday: 'long' }).replace(/^\w/, c => c.toUpperCase());
          const [selectedHomeDay, setSelectedHomeDay] = useState(todayStrGlobal);
          const [children, setChildren] = useState([]); 
          const [agenda, setAgenda] = useState({}); 
          const [shoppingList, setShoppingList] = useState([]); 
          const [pantry, setPantry] = useState([]); 
          const [testedIngredients, setTestedIngredients] = useState({});
          const [user, setUser] = useState(null);
          const [appError, setAppError] = useState(null);
          const [familyCode, setFamilyCode] = useState(() => localStorage.getItem('cookidoudou_family_code') || '');
          const [tempFamilyCode, setTempFamilyCode] = useState(familyCode);
          const [showTypicalDayModal, setShowTypicalDayModal] = useState(false);
          const [activeModalChildId, setActiveModalChildId] = useState(null); 
          const [showTipsModal, setShowTipsModal] = useState(false);
          const [showGeneratorModal, setShowGeneratorModal] = useState(false);
          
          // État pour la recherche dans le carnet par enfant
          const [coachSearchTerms, setCoachSearchTerms] = useState({});

          const [genConfig, setGenConfig] = useState({ weekdayMeals: 1, weekendMeals: 2, structure: 'Plat + Dessert' });
          const [collapsedCategories, setCollapsedCategories] = useState({});
          const [showOnboardingModal, setShowOnboardingModal] = useState(() => localStorage.getItem('cookidoudou_onboarded') !== 'true');
          const [showMedicalConsentModal, setShowMedicalConsentModal] = useState(false);
          const [isCoachEnabled, setIsCoachEnabled] = useState(() => JSON.parse(localStorage.getItem('cookidoudou_coach_enabled')) || false);
          const currentActiveSeasons = useMemo(() => getCurrentActiveSeasons(), []);
          const [isSeasonalModeActive, setIsSeasonalModeActive] = useState(() => JSON.parse(localStorage.getItem('cookidoudou_season_mode')) !== false);

          const names = useMemo(() => children.length ? children.map(c => c.name || "Bébé").join(' et ') : "!", [children]);

          useEffect(() => { localStorage.setItem('cookidoudou_season_mode', JSON.stringify(isSeasonalModeActive)); }, [isSeasonalModeActive]);

          // --- FIREBASE ET SYNC ---
          useEffect(() => {
            const start = async () => {
              if (!window.FirebaseHelper) return;
              try {
                const app = window.FirebaseHelper.initializeApp(firebaseConfig);
                const auth = window.FirebaseHelper.getAuth(app);
                window._db = window.FirebaseHelper.getFirestore(app);
                const cred = await window.FirebaseHelper.signInAnonymously(auth);
                setUser(cred.user);
              } catch (e) { setAppError("Erreur de connexion."); }
            };
            start();
          }, []);

          useEffect(() => {
            if (!user || !window._db || !familyCode) return;
            const fid = familyCode.trim().toLowerCase();
            const pRef = window.FirebaseHelper.doc(window._db, 'artifacts', appId, 'public', 'data', 'profiles', fid);
            return window.FirebaseHelper.onSnapshot(pRef, (s) => {
              if (s.exists()) {
                const d = s.data();
                if (d.children) setChildren(d.children);
                if (d.testedIngredients) setTestedIngredients(d.testedIngredients);
                if (d.agenda) {
                    const mig = {};
                    Object.keys(d.agenda).forEach(day => { mig[day] = Array.isArray(d.agenda[day]) ? d.agenda[day] : [d.agenda[day]].filter(Boolean); });
                    setAgenda(mig);
                }
                if (d.shoppingList) setShoppingList(d.shoppingList);
                if (d.pantry) setPantry(d.pantry);
              }
            });
          }, [user, familyCode]);

          const saveToCloud = useCallback(async (data) => {
            if (!user || !window._db || !familyCode) return;
            const fid = familyCode.trim().toLowerCase();
            const docRef = window.FirebaseHelper.doc(window._db, 'artifacts', appId, 'public', 'data', 'profiles', fid);
            await window.FirebaseHelper.setDoc(docRef, data, { merge: true });
          }, [user, familyCode]);

          // --- ACTIONS ---
          const toggleTestedIngredient = (childId, ingredient) => {
            const currentList = testedIngredients[childId] || [];
            let newList;
            if (currentList.includes(ingredient)) {
                newList = currentList.filter(i => i !== ingredient);
            } else {
                newList = [...currentList, ingredient];
            }
            const newTested = { ...testedIngredients, [childId]: newList };
            setTestedIngredients(newTested);
            saveToCloud({ testedIngredients: newTested });
          };

          const suggestRecipeForNewIngredient = (childId) => {
              const tested = testedIngredients[childId] || [];
              let recipesWithNew = [];

              RECIPES.forEach(r => {
                  let hasNew = false;
                  if (r.ingredients) {
                      r.ingredients.forEach(rawIng => {
                          const parsed = parseIngredient(rawIng);
                          const dictMatch = ALL_INGREDIENTS_DICT.find(d => 
                              d.toLowerCase() === parsed.root.toLowerCase() || 
                              d.toLowerCase() === parsed.name.toLowerCase()
                          );
                          if (dictMatch && !tested.includes(dictMatch)) {
                              hasNew = true;
                          }
                      });
                  }
                  if (hasNew) recipesWithNew.push(r);
              });

              if (recipesWithNew.length > 0) {
                  const randomRecipe = recipesWithNew[Math.floor(Math.random() * recipesWithNew.length)];
                  setSelectedRecipe(randomRecipe);
                  setCurrentTab('recipe_detail');
              } else {
                  alert("Incroyable ! Bébé a déjà goûté à tous les ingrédients de nos recettes.");
              }
          };

          const getRebuiltShoppingList = (agendaObj, pantryArr) => {
            let newList = [];
            Object.values(agendaObj).flat().forEach(rid => {
                const r = RECIPES.find(rec => rec.id === rid);
                if (r && r.ingredients) {
                    r.ingredients.forEach(i => { if (!pantryArr.includes(i) && !newList.includes(i)) newList.push(i); });
                }
            });
            return newList;
          };

          const addToAgenda = (day, rid) => {
            const current = agenda[day] || [];
            if (current.length >= 6) return alert("Plein !");
            if (current.includes(rid)) return alert("Déjà là !");
            const newA = { ...agenda, [day]: [...current, rid] };
            const newS = getRebuiltShoppingList(newA, pantry);
            setAgenda(newA); setShoppingList(newS);
            saveToCloud({ agenda: newA, shoppingList: newS });
          };

          const removeFromAgenda = (day, rid) => {
            const newA = { ...agenda, [day]: (agenda[day] || []).filter(id => id !== rid) };
            const isAllEmpty = Object.values(newA).flat().length === 0;
            const newPantry = isAllEmpty ? [] : pantry;
            const newS = getRebuiltShoppingList(newA, newPantry);
            setAgenda(newA); setShoppingList(newS); setPantry(newPantry);
            saveToCloud({ agenda: newA, shoppingList: newS, pantry: newPantry });
          };

          const generateWeeklyMenu = () => {
            let pool = isSeasonalModeActive ? RECIPES.filter(r => getMatchingActiveSeasons(r.ingredients, currentActiveSeasons).length > 0) : RECIPES;
            if (pool.length < 5) pool = RECIPES;
            const entrees = pool.filter(r => r.category?.includes("Entrée"));
            const plats = pool.filter(r => r.category?.includes("Plat"));
            const desserts = pool.filter(r => r.category?.includes("Dessert"));
            const newA = {};
            let used = [];
            const pick = (arr) => {
                let avail = arr.filter(r => !used.includes(r.id));
                if (avail.length === 0) avail = arr;
                const r = avail[Math.floor(Math.random() * avail.length)];
                if (r) used.push(r.id);
                return r;
            };
            DAYS_OF_WEEK.forEach(day => {
                const count = (day === 'Samedi' || day === 'Dimanche') ? genConfig.weekendMeals : genConfig.weekdayMeals;
                let dayRecs = [];
                for(let i=0; i<count; i++) {
                    if (genConfig.structure.includes('Entrée')) { const r = pick(entrees); if(r) dayRecs.push(r.id); }
                    if (genConfig.structure.includes('Plat')) { const r = pick(plats); if(r) dayRecs.push(r.id); }
                    if (genConfig.structure.includes('Dessert')) { const r = pick(desserts); if(r) dayRecs.push(r.id); }
                }
                newA[day] = Array.from(new Set(dayRecs)).slice(0, 6);
            });
            const newP = [];
            const newS = getRebuiltShoppingList(newA, newP);
            setAgenda(newA); setShoppingList(newS); setPantry(newP);
            saveToCloud({ agenda: newA, shoppingList: newS, pantry: newP });
            setShowGeneratorModal(false); setCurrentTab('home');
          };

          const handleCloseOnboarding = () => { setShowOnboardingModal(false); localStorage.setItem('cookidoudou_onboarded', 'true'); };
          const handleAcceptMedicalConsent = () => { setIsCoachEnabled(true); localStorage.setItem('cookidoudou_coach_enabled', 'true'); setShowMedicalConsentModal(false); setCurrentTab('coach'); };
          const handleCoachToggle = () => isCoachEnabled ? (setIsCoachEnabled(false), localStorage.setItem('cookidoudou_coach_enabled', 'false')) : setShowMedicalConsentModal(true);

          const updateChild_func = (id, up) => { const n = children.map(c => c.id === id ? {...c, ...up} : c); setChildren(n); saveToCloud({children: n}); };
          const removeChild = (id) => { const n = children.filter(c => c.id !== id); setChildren(n); saveToCloud({children: n}); };
          const handlePhoto_func = (e, id) => {
            const f = e.target.files[0]; if(!f) return;
            const rd = new FileReader(); rd.onload=(ev)=>{
                const i = new Image(); i.onload=()=>{
                    const c = document.createElement('canvas'); c.width=300; c.height=300; const ctx=c.getContext('2d');
                    const s = Math.min(i.width, i.height);
                    ctx.drawImage(i, (i.width-s)/2, (i.height-s)/2, s, s, 0, 0, 300, 300);
                    updateChild_func(id, {photo: c.toDataURL('image/jpeg', 0.8)});
                }; i.src=ev.target.result;
            }; rd.readAsDataURL(f);
          };

          // --- RENDUS ---
          const renderHome = () => {
            const displayRecs = (agenda[selectedHomeDay] || []).map(id => RECIPES.find(r => r.id === id)).filter(Boolean);
            return (
              <div className="space-y-6 animate-fadeIn pb-24">
                <div className="text-center"><p className="text-[10px] font-black text-gray-400 uppercase tracking-widest">{new Date().toLocaleDateString('fr-FR', {day:'numeric', month:'long'})}</p><h1 className="text-3xl font-black text-gray-800 tracking-tighter">Coucou {names}</h1></div>
                <div className="bg-white rounded-[2rem] p-4 shadow-sm border border-gray-100">
                    <h3 className="font-bold text-gray-800 mb-3 text-[10px] uppercase tracking-widest px-2"><i className="fa-solid fa-calendar-week text-blue-500"></i> La Semaine</h3>
                    <div className="flex gap-3 overflow-x-auto hide-scrollbar pt-2 pb-2 px-2">
                       {DAYS_OF_WEEK.map(day => {
                           const dayRecs = (agenda[day] || []).map(id => RECIPES.find(r => r.id === id)).filter(Boolean);
                           const isToday = day === todayStrGlobal;
                           const isSel = day === selectedHomeDay;
                           return (
                               <div key={day} onClick={() => setSelectedHomeDay(day)} className={`flex flex-col items-center p-3 rounded-2xl min-w-[4rem] border transition-all cursor-pointer ${isSel ? 'ring-2 ring-orange-400 bg-orange-50 border-orange-200' : 'bg-gray-50 border-gray-100'}`}>
                                   <span className={`text-[10px] font-black uppercase mb-2 ${isSel ? 'text-orange-600' : isToday ? 'text-orange-400' : 'text-gray-400'}`}>{day.substring(0,3)}</span>
                                   <div className="flex flex-col gap-1 items-center">
                                       {dayRecs.length ? dayRecs.slice(0,3).map((r,i) => <img key={i} src={r.image} className="recipe-mini-avatar" style={{marginTop: i>0?'-10px':'0'}} />) : <div className="w-8 h-8 rounded-full border-dashed border border-gray-300 flex items-center justify-center"><i className="fa-solid fa-plus text-gray-200 text-xs"></i></div>}
                                   </div>
                               </div>
                           )
                       })}
                    </div>
                </div>
                <div className="bg-white rounded-[2.5rem] p-6 shadow-sm border border-gray-100">
                    <h3 className="font-bold text-gray-800 mb-4 text-xs uppercase tracking-widest"><i className="fa-solid fa-utensils text-orange-500"></i> {selectedHomeDay === todayStrGlobal ? "Menu d'aujourd'hui" : `Menu du ${selectedHomeDay}`}</h3>
                    {displayRecs.length ? <div className="space-y-3">
                        {displayRecs.map((r, idx) => (
                            <div key={idx} className="flex gap-4 bg-orange-50 p-3 rounded-3xl items-center group">
                                <div onClick={() => { setSelectedRecipe(r); setCurrentTab('recipe_detail'); }} className="flex-1 flex items-center gap-4 cursor-pointer">
                                    <div className="w-16 h-16 rounded-2xl overflow-hidden shadow-sm flex-shrink-0"><img src={r.image} className="w-full h-full object-cover" /></div>
                                    <div className="flex-1"><h4 className="font-black text-gray-800 text-sm line-clamp-1">{r.title}</h4><p className="text-[10px] text-orange-600 font-bold">⏱ {r.time}</p></div>
                                </div>
                                <button onClick={() => removeFromAgenda(selectedHomeDay, r.id)} className="w-8 h-8 bg-white text-gray-400 rounded-full flex items-center justify-center shadow-sm hover:text-red-500 transition-colors"><i className="fa-solid fa-trash-can text-xs"></i></button>
                            </div>
                        ))}
                    </div> : <div className="text-center py-6 opacity-40 italic text-sm">Rien de prévu.</div>}
                </div>
                <div onClick={() => children.length ? (setActiveModalChildId(children[0].id), setShowTypicalDayModal(true)) : setCurrentTab('profile')} className="bg-blue-500 rounded-[2.5rem] p-6 shadow-md text-white relative overflow-hidden cursor-pointer active:scale-95 transition">
                    <i className="fa-solid fa-clipboard-list absolute -right-6 -bottom-6 text-8xl opacity-10 transform -rotate-12"></i>
                    <h3 className="font-black mb-2 text-xs uppercase tracking-widest"><i className="fa-solid fa-lightbulb text-yellow-300"></i> Journée Type</h3>
                    <p className="text-sm font-medium mb-3">Portions et menus adaptés.</p>
                </div>
              </div>
            );
          };

          const renderShopping = () => {
            const agg = aggregateShoppingList(shoppingList);
            const grouped = agg.reduce((acc, obj) => {
                const cid = categorizeIngredient(obj.displayStr);
                if(!acc[cid]) acc[cid] = []; acc[cid].push(obj); return acc;
            }, {});
            const cats = [...SHOPPING_CATEGORIES, {id:'autres', icon:'🛒', name:'Autres'}];
            return (
              <div className="animate-fadeIn space-y-6 pb-24">
                <h1 className="text-2xl font-black text-gray-800">Ma Liste <span className="text-sm text-gray-400 font-bold ml-2">({agg.length})</span></h1>
                {!agg.length ? <div className="text-center py-24 opacity-20"><i className="fa-solid fa-basket-shopping text-7xl mb-4"></i><p className="font-black uppercase tracking-widest text-xs">Panier vide</p></div> : 
                  <div className="space-y-4">
                    {cats.map(c => {
                        if(!grouped[c.id]) return null;
                        const isCol = collapsedCategories[c.id] !== false;
                        return (
                            <div key={c.id} className="bg-white rounded-[2rem] border border-gray-100 overflow-hidden shadow-sm transition-all">
                                <div onClick={() => setCollapsedCategories({...collapsedCategories, [c.id]: !isCol})} className="bg-gray-50 px-5 py-4 flex items-center gap-3 cursor-pointer group select-none">
                                    <span className="text-xl">{c.icon}</span>
                                    <h3 className="font-black text-gray-800 text-[10px] uppercase tracking-widest">{c.name}</h3>
                                    <div className="ml-auto flex items-center gap-3">
                                        <span className="bg-white px-2 py-1 rounded-full text-[9px] font-bold text-gray-400 border">{grouped[c.id].length}</span>
                                        <i className={`fa-solid fa-chevron-down text-[10px] transition-transform duration-300 ${!isCol?'rotate-180 text-orange-500':''}`}></i>
                                    </div>
                                </div>
                                {!isCol && <div className="animate-fadeIn">
                                    {grouped[c.id].map((it, i) => (
                                        <div key={i} className="flex items-center gap-4 p-4 sm:px-5 border-b border-gray-50 last:border-0 hover:bg-gray-50/50 transition">
                                            <input type="checkbox" className="w-6 h-6 rounded-full border-2 border-gray-300 accent-orange-500 cursor-pointer" onChange={() => { const nP = [...new Set([...pantry, ...it.rawItems])]; setPantry(nP); setShoppingList(getRebuiltShoppingList(agenda, nP)); saveToCloud({shoppingList: getRebuiltShoppingList(agenda, nP), pantry: nP}); }} />
                                            <span className="text-sm font-bold text-gray-700 flex-1">{it.displayStr}</span>
                                        </div>
                                    ))}
                                </div>}
                            </div>
                        )
                    })}
                  </div>
                }
              </div>
            );
          };

          const renderDetail = () => {
            if(!selectedRecipe) return null; const r=selectedRecipe;
            return (
              <div className="animate-fadeIn space-y-6 pb-32">
                <button onClick={() => {setSelectedRecipe(null); setCurrentTab('carnet');}} className="text-gray-500 font-bold bg-white px-4 py-2 rounded-full border border-gray-100 shadow-sm flex items-center gap-2"><i className="fa-solid fa-arrow-left"></i> Retour</button>
                <div className="relative"><img src={r.image} className="w-full h-72 object-cover rounded-[3rem] shadow-xl"/><div className="absolute bottom-4 right-4 bg-white/90 p-3 rounded-2xl font-black text-xs shadow-lg">⏱ {r.time}</div></div>
                <h1 className="text-3xl font-black text-gray-800 leading-tight px-2">{r.title}</h1>
                <div className="pt-2 flex gap-3 px-2">
                    <select value={selectedDayForAgenda} onChange={e=>setSelectedDayForAgenda(e.target.value)} className="flex-1 p-4 rounded-2xl bg-white border border-gray-200 font-black text-sm outline-none shadow-sm appearance-none">
                      {DAYS_OF_WEEK.map(d=><option key={d} value={d}>{d}</option>)}
                    </select>
                    <button onClick={()=>addToAgenda(selectedDayForAgenda, r.id)} className="bg-gray-900 text-white px-8 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg active:scale-95 transition hover:bg-black">Planifier</button>
                </div>
                {children.length > 0 && <div className="space-y-3 mt-4">
                    {children.map((c, idx) => {
                        const age = calculateAgeInMonths(c.birthdate);
                        const steps = r.babyAdaptations || [];
                        let txt = age !== null ? (steps.find(a => age <= a.maxAge)?.text || steps[steps.length-1]?.text) : "Âge inconnu.";
                        return (
                            <div key={c.id} className={`${["bg-orange-500", "bg-amber-500", "bg-rose-500"][idx%3]} p-6 rounded-[2.5rem] text-white shadow-md relative overflow-hidden`}>
                                <div className="flex items-center gap-3 mb-3 relative z-10 border-b border-white/20 pb-3">
                                    <div className="w-8 h-8 rounded-full overflow-hidden border-2 border-white flex items-center justify-center shadow-sm">{c.photo ? <img src={c.photo} className="w-full h-full object-cover"/> : <i className="fa-solid fa-baby text-xs"></i>}</div>
                                    <h4 className="font-black text-xs uppercase tracking-widest">Part de {c.name || "Bébé"} {age!==null?`(${age} m)` : ''}</h4>
                                </div>
                                <p className="text-sm leading-relaxed font-medium">{txt}</p>
                            </div>
                        );
                    })}
                </div>}
                <div className="space-y-8 pt-6 px-2">
                  <section>
                    <h3 className="font-black text-[10px] uppercase text-gray-400 mb-4 border-b pb-2 tracking-widest">Ingrédients</h3>
                    <div className="grid gap-2">
                      {r.ingredients?.map((ing, i) => <div key={i} className="flex items-center gap-4 text-sm bg-white p-4 rounded-2xl shadow-sm border border-gray-50 font-medium text-gray-700"><span className="w-2 h-2 bg-orange-400 rounded-full flex-shrink-0"></span><span>{ing}</span></div>)}
                    </div>
                  </section>
                  <section>
                    <h3 className="font-black text-[10px] uppercase text-gray-400 mb-4 border-b pb-2 tracking-widest">Préparation</h3>
                    <div className="space-y-6">
                      {r.adultSteps?.map((s, i) => <div key={i} className="flex gap-5 bg-white p-5 rounded-3xl border border-gray-50 shadow-sm"><span className="text-3xl text-orange-100 font-black italic">{i+1}</span><p className="text-sm leading-relaxed text-gray-600 font-medium">{s}</p></div>)}
                    </div>
                  </section>
                </div>
              </div>
            );
          };

          const renderCoach = () => (
            <div className="animate-fadeIn space-y-6 pb-24">
                <h1 className="text-2xl font-black text-gray-800">Coach Bébé</h1>
                {!children.length ? (
                    <div className="text-center py-12 opacity-40 bg-white rounded-[2rem] p-6 border border-gray-100 font-bold"><p>Ajoutez un enfant.</p></div>
                ) : (
                    <>
                        {children.map(c => {
                            const age = calculateAgeInMonths(c.birthdate); if(age === null) return null;
                            const adv = getCoachAdvice(age);
                            
                            // Groupement dynamique des aliments testés
                            const tested = testedIngredients[c.id] || [];
                            const groupedTested = tested.reduce((acc, ing) => {
                                const cat = getCategoryForTested(ing);
                                if (!acc[cat]) acc[cat] = [];
                                acc[cat].push(ing);
                                return acc;
                            }, {});
                            
                            // Ordre d'affichage des catégories du carnet (Modifié selon nos échanges)
                            const catOrder = ['Aliments prioritaires *', 'Fruits & Légumes', 'Viandes & Protéines', 'Autres'];

                            return (
