<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookidoudou - Premium</title>

    <!-- Base de données recettes -->
    <script src="./recettes.js"></script>

    <!-- Design & Icônes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
      import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
      import { getFirestore, doc, setDoc, collection, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
      window.FirebaseHelper = { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore, doc, setDoc, collection, onSnapshot, getDoc };
    </script>

    <style>
        .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 12px); }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader-ring {
            width: 40px; height: 40px; border: 4px solid rgba(249, 115, 22, 0.1);
            border-radius: 50%; border-top-color: #f97316; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 overflow-x-hidden">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        const FALLBACK_IMAGE = "https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=600&q=80";
        
        // Banque d'images culinaires professionnelles HD (Rapide et 100% fiable)
        const FOOD_IMAGES = [
            "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1493770348161-369560ae357d?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1482049016688-2d3e1b311543?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1476224203421-9ac39bcb3327?auto=format&fit=crop&w=600&q=80"
        ];

        // --- CONFIGURATION FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCOY2zjdwiQ9fIHfKdTt3B5c5eH5NocWUk",
            authDomain: "cookidoudou-4ac92.firebaseapp.com",
            projectId: "cookidoudou-4ac92",
            storageBucket: "cookidoudou-4ac92.firebasestorage.app",
            messagingSenderId: "590128476695",
            appId: "1:590128476695:web:821122bbc1e8280694e252"
        };

        const RECIPES = (typeof window !== 'undefined' && window.RECIPES) ? window.RECIPES : [];
        const DAYS_OF_WEEK = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];

        function App() {
          const [currentTab, setCurrentTab] = useState('home');
          const [selectedRecipe, setSelectedRecipe] = useState(null);
          const [selectedDayForAgenda, setSelectedDayForAgenda] = useState(DAYS_OF_WEEK[0]);
          const [babyProfile, setBabyProfile] = useState({ name: '', birthdate: '', photo: null });
          const [agenda, setAgenda] = useState({}); 
          const [shoppingList, setShoppingList] = useState([]); 
          const [customImages, setCustomImages] = useState({}); 
          const [user, setUser] = useState(null);
          const [familyCode, setFamilyCode] = useState(() => localStorage.getItem('cookidoudou_family_code') || '');
          const [tempFamilyCode, setTempFamilyCode] = useState(familyCode);
          const [initStatus, setInitStatus] = useState({ active: false, current: 0, total: 88 });

          const appId = "cookidoudou-final-v14";

          const ageInMonths = useMemo(() => {
            if (!babyProfile.birthdate) return null;
            try {
                const diffTime = Math.abs(new Date() - new Date(babyProfile.birthdate));
                return Math.floor(Math.ceil(diffTime / (1000 * 60 * 60 * 24)) / 30.44); 
            } catch(e) { return null; }
          }, [babyProfile.birthdate]);

          // --- 1. INITIALISATION ---
          useEffect(() => {
            const start = async () => {
              if (!window.FirebaseHelper) return;
              try {
                const app = window.FirebaseHelper.initializeApp(firebaseConfig);
                const auth = window.FirebaseHelper.getAuth(app);
                window._db = window.FirebaseHelper.getFirestore(app);
                const cred = await window.FirebaseHelper.signInAnonymously(auth);
                setUser(cred.user);
              } catch (e) { console.error("Firebase Error", e); }
            };
            start();
          }, []);

          // --- 2. SYNCHRONISATION CLOUD ---
          useEffect(() => {
            if (!user || !window._db || !familyCode) return;
            const fid = familyCode.trim().toLowerCase();
            
            // Sync Profile & Data
            const pRef = window.FirebaseHelper.doc(window._db, 'artifacts', appId, 'public', 'data', 'profiles', fid);
            const unsubP = window.FirebaseHelper.onSnapshot(pRef, (s) => {
              if (s.exists()) {
                const d = s.data();
                if (d.babyProfile) setBabyProfile(d.babyProfile);
                if (d.agenda) setAgenda(d.agenda);
                if (d.shoppingList) setShoppingList(d.shoppingList);
              }
            });

            // Sync Images
            const iCol = window.FirebaseHelper.collection(window._db, 'artifacts', appId, 'public', 'data', 'recipeImages');
            const unsubI = window.FirebaseHelper.onSnapshot(iCol, (s) => {
              const imgs = {};
              s.forEach(docSnap => {
                if (docSnap.id.startsWith(fid + '_')) {
                  imgs[docSnap.id.replace(fid + '_', '')] = docSnap.data().url;
                }
              });
              setCustomImages(imgs);
            });

            return () => { unsubP(); unsubI(); };
          }, [user, familyCode]);

          const saveToCloud = useCallback(async (data) => {
            if (!user || !window._db || !familyCode) return;
            const fid = familyCode.trim().toLowerCase();
            const docRef = window.FirebaseHelper.doc(window._db, 'artifacts', appId, 'public', 'data', 'profiles', fid);
            try { await window.FirebaseHelper.setDoc(docRef, data, { merge: true }); } catch (e) { }
          }, [user, familyCode]);

          // --- 3. GÉNÉRATEUR INSTANTANÉ (SANS ERREUR 530) ---
          const startInitialization = async () => {
            if (!familyCode) return alert("Veuillez d'abord définir un Code Famille dans Profil.");
            const recipes = RECIPES.slice(0, 88);
            setInitStatus({ active: true, current: 0, total: 88 });
            const fid = familyCode.trim().toLowerCase();

            for (let i = 0; i < recipes.length; i++) {
              const r = recipes[i];
              setInitStatus(prev => ({ ...prev, current: i + 1 }));

              if (customImages[r.id]) continue;

              try {
                 // Utilise une image haute définition aléatoire de la banque d'images
                 const imgUrl = FOOD_IMAGES[r.id % FOOD_IMAGES.length];
                 const imgDoc = window.FirebaseHelper.doc(window._db, 'artifacts', appId, 'public', 'data', 'recipeImages', fid + '_' + r.id);
                 
                 // Sauvegarde de l'URL directement (très léger et rapide pour la base de données)
                 await window.FirebaseHelper.setDoc(imgDoc, { url: imgUrl, fid: fid });
              } catch (err) { console.error("Erreur de sauvegarde", err); }
              
              // Pause très courte pour l'animation (100ms au lieu de 1500ms)
              await new Promise(res => setTimeout(res, 100)); 
            }
            setInitStatus(prev => ({ ...prev, active: false }));
          };

          const getRecipeImageUrl = (id) => customImages[id] || FALLBACK_IMAGE;

          // --- HANDLERS ---
          const handleUpdateProfile = (newP) => { setBabyProfile(newP); saveToCloud({ babyProfile: newP }); };
          
          const addToAgenda = (day, rid) => {
            const newA = { ...agenda, [day]: rid };
            setAgenda(newA);
            const r = RECIPES.find(rec => rec.id === rid);
            let newS = [...shoppingList];
            if (r?.ingredients) {
                r.ingredients.forEach(i => { if (!newS.includes(i)) newS.push(i); });
                setShoppingList(newS);
            }
            saveToCloud({ agenda: newA, shoppingList: newS });
          };

          const removeFromShoppingList = (item) => {
            const newS = shoppingList.filter(i => i !== item);
            setShoppingList(newS);
            saveToCloud({ shoppingList: newS });
          };

          // --- RENDERING VIEWS ---
          const renderHome = () => {
            const todayStr = new Date().toLocaleDateString('fr-FR', { weekday: 'long' }).replace(/^\w/, c => c.toUpperCase());
            const todayRecipe = RECIPES.find(r => r.id === agenda[todayStr]);
            
            return (
              <div className="space-y-6 animate-fadeIn">
                <div className="text-center">
                    <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest">{new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })}</p>
                    <h1 className="text-3xl font-black text-gray-800 tracking-tighter">Coucou {babyProfile.name || "Miam"} !</h1>
                </div>
                <div className="bg-white rounded-[2.5rem] p-6 shadow-sm border border-gray-100">
                    <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2 uppercase text-xs tracking-widest"><i className="fa-solid fa-calendar-day text-orange-500"></i> Menu du jour</h3>
                    {todayRecipe ? (
                        <div onClick={() => { setSelectedRecipe(todayRecipe); setCurrentTab('recipe_detail'); }} className="flex gap-4 cursor-pointer bg-orange-50 p-4 rounded-3xl group">
                            <div className="w-20 h-20 rounded-2xl bg-orange-100 overflow-hidden flex-shrink-0">
                                <img src={getRecipeImageUrl(todayRecipe.id)} loading="lazy" className="w-full h-full object-cover transition duration-500 group-hover:scale-110" />
                            </div>
                            <div className="flex-1 flex flex-col justify-center">
                                <h4 className="font-black text-gray-800 line-clamp-1">{todayRecipe.title}</h4>
                                <p className="text-xs text-orange-600 font-bold">⏱ {todayRecipe.time}</p>
                            </div>
                        </div>
                    ) : <p className="text-sm text-gray-400 py-4 italic">Rien de prévu pour le moment.</p>}
                </div>
              </div>
            );
          };

          const renderCarnet = () => {
            const grouped = RECIPES.reduce((acc, r) => {
              const c = r.category?.includes("Entrée") ? "Entrées" : (r.category?.includes("Dessert") || r.category?.includes("Goûter") ? "Desserts" : "Plats");
              if (!acc[c]) acc[c] = []; acc[c].push(r); return acc;
            }, {});
            const progress = Object.keys(customImages).length;

            return (
              <div className="animate-fadeIn space-y-8 pb-10">
                <h1 className="text-2xl font-black text-gray-800">Toutes les recettes</h1>
                {familyCode && progress < 88 && !initStatus.active && (
                    <div className="bg-gradient-to-br from-orange-400 to-red-500 p-8 rounded-[2.5rem] text-white shadow-xl relative overflow-hidden">
                        <div className="relative z-10">
                            <h3 className="font-black text-xl mb-1 text-white">Générer la galerie</h3>
                            <p className="text-xs opacity-90 mb-5 text-white">Création instantanée des 88 photos de votre livre.</p>
                            <button onClick={startInitialization} className="w-full bg-white text-orange-600 py-4 rounded-2xl font-black text-xs uppercase shadow-lg active:scale-95 transition">Démarrer ({progress}/88)</button>
                        </div>
                        <i className="fa-solid fa-wand-magic-sparkles absolute -bottom-4 -right-4 text-8xl opacity-10 rotate-12"></i>
                    </div>
                )}
                {["Entrées", "Plats", "Desserts"].map(c => grouped[c] && (
                    <div key={c} className="mb-6">
                      <h2 className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4 border-b pb-2 flex items-center gap-2">
                         {c} <span className="w-1 h-1 bg-gray-300 rounded-full"></span> {grouped[c].length}
                      </h2>
                      <div className="grid grid-cols-1 gap-3">
                        {grouped[c].sort((a,b)=>a.id-b.id).map(r => (
                          <div key={r.id} onClick={()=>{setSelectedRecipe(r); setCurrentTab('recipe_detail');}} className="bg-white p-4 rounded-3xl flex gap-4 items-center border border-gray-100 hover:bg-orange-50 transition cursor-pointer group">
                            <div className="w-16 h-16 rounded-2xl bg-gray-100 overflow-hidden flex-shrink-0 shadow-inner">
                                <img src={getRecipeImageUrl(r.id)} loading="lazy" className="w-full h-full object-cover transition duration-500 group-hover:scale-110" />
                            </div>
                            <div className="flex-1">
                              <h4 className="font-bold text-gray-800 text-sm line-clamp-1">{r.title}</h4>
                              <p className="text-[10px] text-gray-400 font-bold">⏱ {r.time}</p>
                            </div>
                            <i className="fa-solid fa-chevron-right text-gray-200 text-xs"></i>
                          </div>
                        ))}
                      </div>
                    </div>
                ))}
              </div>
            );
          };

          const renderShopping = () => (
            <div className="animate-fadeIn space-y-6">
              <h1 className="text-2xl font-black text-gray-800">Courses</h1>
              {shoppingList.length === 0 ? <div className="text-center py-24 opacity-10 flex flex-col items-center"><i className="fa-solid fa-basket-shopping text-7xl mb-4"></i><p className="font-black uppercase tracking-widest text-xs">Panier vide</p></div> : (
                <div className="bg-white rounded-[3rem] border border-gray-100 overflow-hidden shadow-sm">
                  {shoppingList.map((item, i) => (
                    <div key={i} className="flex items-center gap-5 p-5 border-b last:border-0 hover:bg-gray-50 transition">
                      <input type="checkbox" className="w-7 h-7 rounded-full border-2 border-gray-200 text-orange-500 focus:ring-orange-500 cursor-pointer" onChange={() => setTimeout(() => removeFromShoppingList(item), 300)} />
                      <span className="text-sm font-bold text-gray-600">{item}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );

          const renderDetail = () => {
            if (!selectedRecipe) return null;
            const r = selectedRecipe;
            const babySteps = r.babyAdaptations || [];
            const babyStepText = babyProfile.birthdate 
                ? (babySteps.find(a => ageInMonths <= a.maxAge)?.text || babySteps[babySteps.length - 1]?.text || "Adaptation standard")
                : "Indiquez l'âge dans Profil.";

            return (
              <div className="animate-fadeIn space-y-6 pb-24">
                <button onClick={()=>{setSelectedRecipe(null); setCurrentTab('carnet');}} className="text-gray-400 font-bold flex items-center gap-2 transition hover:text-gray-600"><i className="fa-solid fa-arrow-left"></i> Livre</button>
                <img src={getRecipeImageUrl(r.id)} onError={(e)=>e.target.src=FALLBACK_IMAGE} className="w-full h-72 object-cover rounded-[3rem] shadow-xl" />
                <h1 className="text-3xl font-black text-gray-800 leading-tight">{r.title}</h1>
                
                <div className="pt-4 flex gap-3">
                    <select value={selectedDayForAgenda} onChange={(e)=>setSelectedDayForAgenda(e.target.value)} className="flex-1 p-5 rounded-[2rem] bg-white border border-gray-200 font-black outline-none text-sm appearance-none shadow-sm">
                      {DAYS_OF_WEEK.map(d=><option key={d} value={d}>{d}</option>)}
                    </select>
                    <button onClick={()=>{addToAgenda(selectedDayForAgenda, r.id); alert("Planifié avec succès !");}} className="bg-gray-900 text-white px-8 rounded-[2rem] font-black uppercase text-xs tracking-widest shadow-lg">Planifier</button>
                </div>

                <div className="bg-orange-500 p-8 rounded-[2.5rem] text-white shadow-xl mt-6">
                  <h4 className="font-black text-xs uppercase mb-3 flex items-center gap-2"><i className="fa-solid fa-baby"></i> Pour bébé ({ageInMonths || '?'} mois)</h4>
                  <p className="text-sm leading-relaxed font-medium">{babyStepText}</p>
                </div>
                <div className="space-y-10 pt-4">
                  <section>
                    <h3 className="font-black text-[10px] uppercase text-gray-300 mb-5 text-center tracking-widest font-black">Ingrédients</h3>
                    <div className="grid grid-cols-1 gap-2">
                      {r.ingredients?.map((ing, idx) => (
                        <div key={idx} className="flex items-center gap-4 text-sm text-gray-700 bg-white p-4 rounded-2xl border border-gray-100">
                          <span className="w-2 h-2 bg-orange-400 rounded-full"></span>{ing}
                        </div>
                      ))}
                    </div>
                  </section>
                  <section>
                    <h3 className="font-black text-[10px] uppercase text-gray-300 mb-5 text-center tracking-widest font-black">Préparation</h3>
                    <div className="space-y-8">
                      {r.adultSteps?.map((s, idx) => (
                        <div key={idx} className="flex gap-6">
                          <span className="font-black text-4xl text-orange-100 italic">{idx+1}</span>
                          <p className="text-sm leading-relaxed text-gray-600 pt-2 font-medium">{s}</p>
                        </div>
                      ))}
                    </div>
                  </section>
                </div>
              </div>
            );
          };

          const renderProfile = () => (
            <div className="animate-fadeIn space-y-6 pb-20">
              <h1 className="text-2xl font-black text-gray-800">Configuration</h1>
              <div className="bg-white rounded-[3rem] p-10 border border-gray-100 flex flex-col items-center shadow-sm">
                <div className="w-32 h-32 rounded-full bg-orange-50 flex items-center justify-center border-4 border-white shadow-2xl overflow-hidden mb-10 text-orange-200">
                  <i className="fa-solid fa-baby text-6xl"></i>
                </div>
                <div className="w-full space-y-4 text-center">
                    <input type="text" value={babyProfile.name} onChange={(e) => handleUpdateProfile({...babyProfile, name: e.target.value})} placeholder="Prénom" className="w-full bg-gray-50 p-5 rounded-2xl text-center font-black outline-none border-none focus:ring-2 ring-orange-200" />
                    <input type="date" value={babyProfile.birthdate} onChange={(e) => handleUpdateProfile({...babyProfile, birthdate: e.target.value})} className="w-full bg-gray-50 p-5 rounded-2xl text-center font-bold outline-none border-none" />
                </div>
              </div>
              <div className="bg-white rounded-[2.5rem] p-8 border border-gray-100 shadow-sm">
                <h3 className="font-black mb-2 flex items-center gap-2 uppercase text-xs tracking-widest"><i className="fa-solid fa-link text-blue-500"></i> Code Famille</h3>
                <p className="text-[10px] text-gray-400 mb-6 uppercase font-bold">Synchronisez tous vos téléphones</p>
                <div className="flex gap-2">
                  <input type="text" value={tempFamilyCode} onChange={(e)=>setTempFamilyCode(e.target.value.toUpperCase())} placeholder="VOTRE CODE" className="flex-1 bg-gray-50 p-5 rounded-2xl uppercase font-mono text-xs font-black outline-none border-none" />
                  <button onClick={() => { if(!tempFamilyCode) return; setFamilyCode(tempFamilyCode); localStorage.setItem('cookidoudou_family_code', tempFamilyCode); alert("Synchronisé !"); }} className="bg-blue-600 text-white px-8 rounded-2xl font-black uppercase text-[10px]">OK</button>
                </div>
                {familyCode && <p className="text-[10px] text-green-600 mt-4 font-black uppercase flex items-center gap-2 tracking-widest"><span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Connecté : {familyCode}</p>}
              </div>
            </div>
          );

          return (
            <div className="min-h-screen bg-gray-50 flex flex-col relative overflow-x-hidden">
              {initStatus.active && (
                  <div className="fixed inset-0 bg-gray-900/98 backdrop-blur-2xl z-[100] flex flex-col items-center justify-center p-12 text-center text-white animate-fadeIn">
                      <div className="loader-ring mb-10"></div>
                      <h2 className="text-4xl font-black mb-3 uppercase tracking-tighter italic tracking-tight">Studio Photo</h2>
                      <p className="text-orange-200 text-sm mb-12 opacity-80 leading-relaxed font-bold tracking-wide">Mise en place de votre galerie...<br/>C'est presque fini !</p>
                      <div className="w-full max-w-xs bg-white/5 h-4 rounded-full overflow-hidden mb-5 p-1 border border-white/5">
                          <div className="bg-gradient-to-r from-orange-400 to-red-500 h-full transition-all duration-300 rounded-full shadow-[0_0_20px_rgba(249,115,22,0.6)]" style={{ width: `${(initStatus.current / initStatus.total) * 100}%` }}></div>
                      </div>
                      <span className="text-orange-500 font-black text-[10px] tracking-[0.5em] uppercase">{initStatus.current} / 88</span>
                  </div>
              )}
              <main className="flex-1 max-w-2xl mx-auto w-full p-6 pt-12 overflow-y-auto">
                {currentTab === 'home' && renderHome()}
                {currentTab === 'carnet' && renderCarnet()}
                {currentTab === 'shopping' && renderShopping()}
                {currentTab === 'profile' && renderProfile()}
                {currentTab === 'recipe_detail' && renderDetail()}
              </main>
              <nav className="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-2xl border-t border-gray-100 flex justify-around py-5 px-2 z-50 pb-safe shadow-[0_-15px_40px_rgba(0,0,0,0.04)]">
                {[
                  { id: 'home', icon: 'fa-house', label: 'Accueil' },
                  { id: 'carnet', icon: 'fa-book-open', label: 'Livre' },
                  { id: 'shopping', icon: 'fa-cart-shopping', label: 'Liste' },
                  { id: 'profile', icon: 'fa-user', label: 'Profil' }
                ].map(t => (
                  <button key={t.id} onClick={() => { setCurrentTab(t.id); setSelectedRecipe(null); }} className={`flex flex-col items-center gap-1 relative ${currentTab === t.id || (t.id === 'carnet' && currentTab === 'recipe_detail') ? 'text-orange-500 scale-110' : 'text-gray-300'} transition-all duration-300`}>
                    <i className={`fa-solid ${t.icon} text-xl transition-all`}></i>
                    <span className="text-[8px] font-black uppercase tracking-wider tracking-widest">{t.label}</span>
                  </button>
                ))}
              </nav>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
